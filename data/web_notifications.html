<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETS2 Assist — Уведомления</title>
<script src="js/debug_show.js"></script>
<script src="js/ui_category.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Open Sans','Helvetica Neue',Arial,sans-serif;pointer-events:none}
#notifications{position:fixed;inset:0;pointer-events:none}
.slot{position:absolute;display:flex;flex-direction:column;gap:10px;width:min(620px,38vw);pointer-events:none}
#top{top:37.5%;left:50%;transform:translate(-50%,-50%);align-items:center}
#left{left:28px;top:50%;transform:translateY(-50%);align-items:flex-start}
#right{right:28px;top:50%;transform:translateY(-50%);align-items:flex-end}

/* Плашка повторяет стиль игрового уведомления: серая подложка, оранжевая
   полоса-подсветка снизу и иконка слева. Ширина фиксирована, высота — по
   размеру текста. */
.note{
    box-sizing:border-box;width:min(620px,38vw);min-width:280px;max-width:100%;
    display:flex;align-items:center;gap:12px;
    padding:12px 18px;border-radius:4px;
    background:rgba(38,38,38,.92);
    border-bottom:3px solid #e59310;
    box-shadow:0 6px 22px rgba(0,0,0,.5);
    color:#e8edf4;opacity:0;transform:translateY(0);transition:opacity 150ms ease-out;pointer-events:none
}
.note.show{opacity:1}
.noteIcon{
    flex:0 0 34px;width:34px;height:34px;align-self:center;
    display:flex;align-items:center;justify-content:center;
}
/* Иконка квестового уведомления — метка-восклицание. */
.noteIcon img{width:34px;height:34px;object-fit:contain;display:block}
.noteBody{min-width:0;flex:1 1 auto}
.noteTitle{font-size:14px;font-weight:700;color:#e59310;margin-bottom:4px;white-space:pre-wrap}
.noteText{font-size:14px;line-height:1.4;white-space:pre-wrap;color:#e8edf4}
.note.reputation .noteTitle,.note.reward .noteTitle{color:#e59310}
.note.noicon{padding-left:18px}
@media(max-width:1000px){.slot{width:min(620px,72vw)}.note{width:min(620px,72vw);min-width:0}.noteTitle{font-size:13px}.noteText{font-size:13px}}
</style>
</head>
<body>
<div id="notifications" data-category="game">
  <div class="slot" id="top"></div>
  <div class="slot" id="left"></div>
  <div class="slot" id="right"></div>
</div>
<script>
(function(){
'use strict';
var ws=null, counters={top:0,left:0,right:0};
function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c]})}
function slotName(n){n=String(n||'top').toLowerCase();return n==='left'||n==='right'?'#'+n:'#top'}
/* Иконка квестового уведомления — метка-восклицание (Pointer_quest_on).
   Пустая строка в icon означает «уведомление пришло из квестового слоя»:
   подставляем стандартную квестовую метку, а не оставляем плашку без иконки. */
var QUEST_ICON='quests/images/Pointer_quest_on_32x32.png';
function noteIconHtml(icon){
  var src=icon?String(icon):QUEST_ICON;
  if(!src)return '';
  return '<div class="noteIcon"><img src="'+esc(src)+'" alt="" onerror="this.onerror=null;this.src=\''+QUEST_ICON+'\';"></div>';
}
function showNotification(n){
  n=n||{};
  var slot=slotName(n.position);
  var host=document.querySelector(slot);if(!host)return;
  var id=++counters[slot.slice(1)];
  var item=document.createElement('div');
  item.className='note '+(n.accent||'');
  item.dataset.id=String(id);
  var icon=noteIconHtml(n.icon);
  if(!icon)item.className+=' noicon';
  item.innerHTML=icon+'<div class="noteBody">'
    +(n.title?'<div class="noteTitle">'+esc(n.title)+'</div>':'')
    +'<div class="noteText">'+esc(n.text||'')+'</div></div>';
  host.appendChild(item);
  requestAnimationFrame(function(){item.classList.add('show')});
  var duration=Math.max(1500,Number(n.durationMs)||4500);
  setTimeout(function(){item.classList.remove('show');setTimeout(function(){item.remove()},260)},duration);
}
function connect(){
  try{
    ws=new WebSocket('ws://localhost:8085/');
    ws.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(d.command==='quest_notify')showNotification(d.notification||{})}catch(e){}};
    ws.onclose=function(){setTimeout(connect,1500)};
    ws.onerror=function(){try{ws.close()}catch(e){}};
  }catch(e){setTimeout(connect,1500)}
}
document.addEventListener('DOMContentLoaded',connect);
})();
</script>
</body>
</html>
