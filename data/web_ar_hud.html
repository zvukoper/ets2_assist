<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ETS2 Assist — AR HUD</title>
    <link rel="icon" href="ets2_assist.ico">
    <!-- v1.0.40.28: ЕДИНЫЙ debugShow(bool) для всего веб-контента. -->
    <script src="js/debug_show.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }
        body {
            opacity: 1;
            transition: opacity 150ms ease;
        }
        #arCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #arStatus {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        #arStatus.warn { color: #ffd166; }
        #arStatus.err  { color: #ff6b6b; }
        #arStatus.ok   { color: #7bed9f; }
    </style>
</head>
<body>
    <canvas id="arCanvas" data-category="game"></canvas>
    <div id="arStatus" data-category="game">AR: подключение…</div>

    <!-- ar_hud.js остаётся владельцем игровой AR-отрисовки. -->
    <script src="js/debug_show.js"></script>
    <script src="js/ui_category.js"></script>
    <script src="js/ar_hud.js"></script>
    <script src="js/ar_quests.js"></script>
    <!-- Только этот модуль управляет дополнительной диагностикой AR1.
         По умолчанию обе опции выключены и ничего игроку не показывают. -->
    <script src="js/ar_debug_view.js"></script>
    <style>
        /* Тоггл кнопки «AR»: слой скрыт, но окно и страница остаются живыми. */
        html[data-ar-layer="off"] #arCanvas,
        html[data-ar-layer="off"] #arStatus { visibility: hidden !important; }
    </style>
    <script>
    // v1.0.41: показом AR1 владеет ОБЩАЯ политика категорий (js/ui_category.js,
    // атрибут data-category="game"). Дублирующий канал паузы здесь больше не нужен:
    // AR скрывается вместе с остальными игровыми интерфейсами.
    // Отдельно обрабатывается команда приложения «ar_layer_visible» — это тоггл
    // кнопки AR в главной форме, он не влияет на остальные слои.
    (function () {
        'use strict';
        var visible = true;
        function apply() {
            document.documentElement.setAttribute('data-ar-layer', visible ? 'on' : 'off');
        }
        apply();
        var ws = null;
        function connect() {
            try {
                ws = new WebSocket('ws://localhost:8084/');
                ws.onmessage = function (ev) {
                    try {
                        var d = JSON.parse(ev.data);
                        if (d && d.command === 'ar_layer_visible') { visible = d.value !== false; apply(); }
                    } catch (_) { }
                };
                ws.onclose = function () { setTimeout(connect, 1000); };
                ws.onerror = function () { try { ws.close(); } catch (_) { } };
            } catch (_) {
                setTimeout(connect, 1000);
            }
        }
        connect();
    })();
    </script>
</body>
</html>
