<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ETS2 Assist — AR HUD</title>
    <link rel="icon" href="ets2_assist.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }
        #arCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #arStatus {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        #arStatus.warn { color: #ffd166; }
        #arStatus.err  { color: #ff6b6b; }
        #arStatus.ok   { color: #7bed9f; }
    </style>
</head>
<body>
    <canvas id="arCanvas"></canvas>
    <div id="arStatus">AR: подключение…</div>
    <!-- ТОЛЬКО ar_hud.js: страница ничего не загружает сама.
         Команды (ar_target) и телеметрия (ar_telemetry) приходят от приложения
         по WS 8084 (command server, как у миникарты). -->
    <script src="js/ar_hud.js"></script>
</body>
</html>
