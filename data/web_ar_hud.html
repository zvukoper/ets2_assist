<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ETS2 Assist — AR HUD</title>
    <link rel="icon" href="ets2_assist.ico">
    <!-- v1.0.40.28: ЕДИНЫЙ debugShow(bool) для всего веб-контента (подключается ПЕРВЫМ,
         чтобы флаг успел стать до остальных скриптов и до логики показа). -->
    <script src="js/debug_show.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: none;
            user-select: none;
        }
        body {
            opacity: 1;
            transition: opacity 150ms ease;
        }
        #arCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #arStatus {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        #arStatus.warn { color: #ffd166; }
        #arStatus.err  { color: #ff6b6b; }
        #arStatus.ok   { color: #7bed9f; }
    </style>
</head>
<body>
    <canvas id="arCanvas"></canvas>
    <div id="arStatus">AR: подключение…</div>
    <!-- ТОЛЬКО ar_hud.js: страница ничего не загружает сама.
         Команды (ar_target) и телеметрия (ar_telemetry) приходят от приложения
         по WS 8084 (command server, как у миникарты). -->
    <script src="js/ar_hud.js"></script>
    <script src="js/ar_quests.js"></script>
    <script>
    // v1.0.40.46: AR1 обязан плавно исчезать при переходе игры в паузу.
    // Состояние паузы уже рассылается QuestRuntime по WS 8085, поэтому AR HUD
    // реагирует на тот же подтверждённый источник, что и квестовый интерфейс.
    (function () {
        'use strict';
        var pauseWs = null;
        var reconnectTimer = null;

        function setPaused(paused) {
            document.body.style.opacity = paused ? '0' : '1';
        }

        function connectPauseState() {
            try {
                pauseWs = new WebSocket('ws://localhost:8085/');
                pauseWs.onmessage = function (ev) {
                    try {
                        var data = JSON.parse(ev.data);
                        if (data && data.command === 'quest_state')
                            setPaused(data.paused === true);
                    } catch (_) { }
                };
                pauseWs.onclose = function () {
                    pauseWs = null;
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connectPauseState, 250);
                };
                pauseWs.onerror = function () {
                    try { pauseWs.close(); } catch (_) { }
                };
            } catch (_) {
                reconnectTimer = setTimeout(connectPauseState, 250);
            }
        }

        if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', connectPauseState);
        else
            connectPauseState();
    })();
    </script>
</body>
</html>
