<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETS2 Assist - Квесты</title>
<script src="js/debug_show.js"></script>
<script src="js/ui_category.js"></script>
<style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#e8edf4;background:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#questApp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#questApp.paused{display:flex;pointer-events:auto}
/* v1.0.40.59: над окном квестов — обычный курсор (в остальных слоях курсор игры
   скрыт). Вид курсора переключает js/quests_ui.js вместе с кликабельностью. */
#questApp.paused{cursor:default}
#questTab{cursor:pointer}
.questWindow{position:relative;width:min(1280px,92vw);height:min(900px,88vh);display:grid;grid-template-columns:240px minmax(420px,1fr) 310px;grid-template-rows:1fr 54px;gap:10px;padding:12px;box-sizing:border-box;background:rgba(13,17,22,.97);border:1px solid rgba(255,205,85,.35);box-shadow:0 15px 70px rgba(0,0,0,.75);border-radius:10px;opacity:1;transform:translateX(0);transition:opacity 160ms ease,transform 220ms ease 160ms}
/* v1.0.40.57: окно уезжает за край НЕ ПОЛНОСТЬЮ — в финальных кадрах анимации
   добавляем фейдаут, иначе у левой границы остаётся видимая полоса.
   Раскрытие — ЗЕРКАЛЬНОЕ: сначала проявление (opacity 0→1), затем въезд
   (transform), т.е. задержки переходов меняются местами между состояниями. */
.questWindow.collapsed{opacity:0;transform:translateX(calc(-100% - 40px));pointer-events:none;transition:transform 220ms ease,opacity 160ms ease 220ms}
.panel{min-width:0;min-height:0;background:rgba(24,29,36,.98);border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.panelTitle{padding:11px 12px;font-weight:700;color:#ffd45a;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025)}
.scroll{height:calc(100% - 43px);overflow:auto}
.sideItem,.questItem{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.055);background:transparent;color:#dce3eb;padding:10px;text-align:left;cursor:pointer}
.sideItem:hover,.questItem:hover,.sideItem.selected{background:rgba(255,205,85,.10)}
.sideItem img{width:28px;height:28px;vertical-align:middle;margin-right:8px;object-fit:contain}.questItem span{display:block;color:#7f8c9e;font-size:11px;margin-top:4px}
#dialog{display:flex;flex-direction:column;height:100%}
#dialogHeader{display:grid;grid-template-columns:25% 75%;gap:14px;height:44%;min-height:150px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.07);padding:10px;box-sizing:border-box}
#portrait{background:#0f1216;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px}
#dialogImage{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;object-position:center;background:#0f1216;border-radius:6px}
#dialogHeaderText{padding:4px 6px;overflow:auto;min-width:0}
#dialogSpeaker{font-size:21px;font-weight:700;color:#fff;margin-bottom:10px}
#dialogText{font-family:Roboto,'Roboto Regular','Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.55;white-space:pre-wrap;color:#fff;-webkit-text-stroke:.35px #000;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#dialogBody{padding:18px;overflow:auto;flex:1;min-height:0}
#dialogOptions{display:flex;flex-direction:column;gap:8px}
.dialogOption{padding:12px 14px;border:1px solid rgba(255,255,255,.12);background:#232a33;color:#e7edf4;border-radius:6px;text-align:left;cursor:pointer;font:inherit;transition:background 120ms ease,border-color 120ms ease,box-shadow 120ms ease}
.dialogOption:hover{border-color:rgba(255,211,77,.65);background:#333c49;box-shadow:inset 0 0 0 1px rgba(255,211,77,.18)}
.dialogOption:disabled{opacity:.38;cursor:not-allowed}
.dialogOption:disabled:hover{border-color:rgba(255,255,255,.12);background:#232a33;box-shadow:none}
.rewardLine{padding:6px 0}
#inventory{grid-column:1/4;padding:12px 14px;display:flex;align-items:center;gap:14px;white-space:nowrap;overflow:auto;background:#11151b;border:1px solid rgba(255,255,255,.08);border-radius:8px}
.inventoryTitle{font-weight:700;color:#ffd45a}.inventoryItem{padding:5px 8px;border-radius:5px;background:#242c35;color:#d7dee7}.muted{color:#788496;padding:12px}.error{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#5b2020;color:#fff;padding:8px 15px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:900}.error.show{opacity:1}
#collapseBtn{position:absolute;right:8px;top:8px;z-index:5;width:30px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,205,85,.4);background:rgba(24,29,36,.95);color:#ffd45a;border-radius:5px;cursor:pointer;font:700 15px/1 'Segoe UI',Arial,sans-serif}
#collapseBtn:hover{background:rgba(255,205,85,.18)}
#questTab{position:fixed;left:0;top:50%;transform:translate(-115%,-50%);display:flex;align-items:center;justify-content:center;width:34px;padding:18px 6px;writing-mode:vertical-rl;background:rgba(13,17,22,.96);border:1px solid rgba(255,205,85,.45);border-left:0;border-radius:0 7px 7px 0;color:#ffd45a;font:700 14px/1 'Segoe UI',Arial,sans-serif;letter-spacing:1px;cursor:pointer;pointer-events:none;transition:transform 220ms ease,box-shadow 220ms ease;box-shadow:0 0 0 rgba(255,205,85,0)}
#questTab.visible{transform:translate(0,-50%);pointer-events:auto}
#questTab.pulse{animation:questTabPulse 2s ease-in-out infinite}
@keyframes questTabPulse{0%,100%{box-shadow:0 0 2px rgba(255,205,85,.25);border-color:rgba(255,205,85,.45);background:rgba(13,17,22,.96)}50%{box-shadow:0 0 22px rgba(255,205,85,.95);border-color:#ffd45a;background:rgba(58,46,12,.96)}}
@media(max-width:1100px){.questWindow{grid-template-columns:190px minmax(0,1fr) 240px;width:96vw;height:92vh}#dialogText{font-size:14px}}
</style>
</head>
<body>
<div id="questApp" data-category="interactive">
  <div class="questWindow" id="questWindow">
    <button id="collapseBtn" title="Свернуть окно квестов">&#8592;</button>
    <section class="panel"><div class="panelTitle">Интерактивы</div><div class="scroll" id="interactionList"></div></section>
    <section class="panel" id="dialog">
      <div id="dialogHeader">
        <div id="portrait"><img id="dialogImage" alt=""></div>
        <div id="dialogHeaderText"><div id="dialogSpeaker"></div><div id="dialogText">Выберите интерактив слева.</div></div>
      </div>
      <div id="dialogBody"><div id="dialogOptions"></div></div>
    </section>
    <section class="panel"><div class="panelTitle">Квесты</div><div class="scroll" id="questList"></div></section>
    <div id="inventory"><span class="inventoryTitle">Инвентарь</span><span class="muted">пусто</span></div>
  </div>
  <div class="error" id="overlayError"></div>
</div>
<div id="questTab" data-category="interactive">Квесты</div>
<script src="js/quests_ui.js"></script>
</body>
</html>
