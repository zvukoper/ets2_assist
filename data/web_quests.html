<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETS2 Assist — интерактив R27 1.0.40.97</title>
<script src="js/debug_show.js"></script>
<script src="js/ui_category.js"></script>
<style>
/* Оформление повторяет интерфейс игры: тот же шрифт, оранжевый акцент и
   серые панели. Тёмный фон окна совпадает с игровым и не меняется. */
:root{
  --font-ui:'Open Sans','Helvetica Neue',Arial,sans-serif;
  --accent:#e59310;
  --muted:#9e9e9e;
  --panel:#262626;
  --hover:#181f23;
  --selected:#4b5a66;
  --scroll-thumb:#4b5a66;
  --scroll-thumb-hover:#5d7080;
  font-family:var(--font-ui);color:#e7edf4;background:transparent;user-select:none
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font-ui)}

/* Тёмно-серые скроллбары. Вертикальные — автоматически при переполнении,
   горизонтальные исключены полностью. */
*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
*::-webkit-scrollbar{width:8px;height:0}
*::-webkit-scrollbar:horizontal{height:0;display:none}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
::-webkit-scrollbar-corner{background:transparent}

/* The page itself fades; the quest panel also slides out when collapsed. */
#questApp{position:fixed;inset:0;visibility:visible;opacity:1;pointer-events:none;transition:opacity 150ms ease;z-index:100}
#miniLogo{
    position:absolute;left:10px;top:1px;width:84px;height:83px;
    z-index:20;pointer-events:none;overflow:hidden;
    opacity:0;
    transition:opacity 150ms ease;
}
html.ets2-cat-interactive #miniLogo{visibility:visible!important;opacity:1!important}
html.ets2-cat-game #miniLogo{visibility:visible!important;opacity:0!important}
[data-category~="game"]{transition:opacity 150ms ease}
#questApp.interactiveVisible{visibility:visible;opacity:1;pointer-events:none}

/* Pixel design space: all supplied measurements are from a 1920x1080 mockup.
   JS applies one uniform scale to this canvas so proportions never distort. */
#designCanvas{
    position:absolute;left:0;top:0;width:1920px;height:1080px;
    transform-origin:0 0;
    transform:scale(var(--design-scale,1));
    overflow:visible;
    pointer-events:none;
}

/* === supplied 1920x1080 geometry === */
#miniLogo img{display:block;width:84px;height:83px;object-fit:contain}
#miniLogoVersion{display:none}

/* STANDARD INTERFACE MOTION
   Единая анимация для всех интерактивных окон:
   - вход: slide-in из-за левой границы + быстрый fade-in;
   - выход: slide-out, а последние 100 мс — fade-out.
   Вся геометрия задаётся только через --interface-closed-transform. */
.interfaceWindow{
    position:absolute;
    box-sizing:border-box;
    opacity:0;
    visibility:hidden;
    transform:var(--interface-closed-transform);
    pointer-events:none;
    will-change:transform,opacity;
}
.interfaceWindow.interfaceActive{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    pointer-events:auto;
}
.interfaceWindow.interfaceMotionEnter{
    animation:
        interfaceSlideIn 320ms cubic-bezier(.22,.8,.2,1) both,
        interfaceFadeIn 120ms ease-out both;
}
.interfaceWindow.interfaceMotionExit{
    animation:
        interfaceSlideOut 320ms ease-in both,
        interfaceFadeOut 100ms ease-in 220ms both;
}
@keyframes interfaceSlideIn{
    from{transform:var(--interface-closed-transform);visibility:visible}
    to{transform:translateX(0);visibility:visible}
}
@keyframes interfaceSlideOut{
    from{transform:translateX(0);visibility:visible}
    to{transform:var(--interface-closed-transform);visibility:hidden}
}
@keyframes interfaceFadeIn{
    from{opacity:0}
    to{opacity:1}
}
@keyframes interfaceFadeOut{
    from{opacity:1}
    to{opacity:0}
}
#questWindow{
    --interface-closed-transform:translateX(calc(-100% - 40px));
    left:0;top:0;width:1410px;height:906px;
}
#questWindow.collapsed{
    opacity:0;
    transform:var(--interface-closed-transform);
    pointer-events:none;
}
#inventoryWindow{
    --interface-closed-transform:translateX(calc(-100% - 40px - 104px));
    left:104px;top:74px;width:278px;height:829px;
    z-index:35;
    border-radius:10px;
    background:rgba(23,24,25,.87);
    overflow:hidden;
}

#questLayout{position:absolute;left:0;top:0;width:1410px;height:906px;display:block}

#questSidebar,#eventPanel,#responsePanel,#imagePanel,#servicePanel{
    position:absolute;box-sizing:border-box;
    border:0;border-radius:10px;
    background:rgba(23,24,25,.87);
    box-shadow:none;
    overflow:hidden;
}
#questSidebar{left:104px;top:74px;width:278px;height:829px;display:flex;flex-direction:column}
#eventPanel{left:392px;top:75px;width:722px;height:278px}
#responsePanel{left:392px;top:365px;width:722px;height:540px}
#imagePanel{left:1124px;top:75px;width:286px;height:278px}
#servicePanel{left:1124px;top:365px;width:286px;height:540px}

#questList,.scroll{padding:6px;overflow-y:auto;overflow-x:hidden;min-height:0}
.questSectionTitle{padding:7px 6px 5px;color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.55px}
.questDivider{height:1px;background:rgba(255,255,255,.14);margin:6px 0}
.questItem{width:100%;display:block;border:1px solid transparent;background:var(--panel);color:#e7edf4;padding:8px 6px;text-align:left;cursor:pointer;border-radius:6px;margin-bottom:2px}
.questItem:hover,.questItem.quest-native-hover{background:var(--hover)}
.questItem.selected{background:var(--selected);border-color:var(--accent)}
.questItem strong{display:block;font-size:14px;font-weight:600}
.questItem span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.questItem em{display:block;margin-top:4px;color:var(--muted);font-size:13px;font-style:normal;line-height:1.3}
.archiveToggle{margin:8px 6px 0;padding:8px;border:1px solid transparent;background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;text-transform:lowercase;font-family:inherit}
.archiveToggle:hover,.archiveToggle.quest-native-hover{background:var(--hover)}

.panelInner{height:100%;padding:6px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden}
.panelTitle{padding:6px;color:var(--accent);font-weight:700;font-size:14px}
#dialog{height:100%;display:flex;flex-direction:column}
#dialogSpeaker{padding:0 6px 6px;color:#fff;font-size:18px;font-weight:700}
#dialogText{padding:0 6px;color:#fff;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-y:auto;overflow-x:hidden;flex:1;transition:opacity 150ms ease}
#dialogText.fading{opacity:0}
#dialogService{padding:6px;color:var(--muted);font-size:14px;line-height:1.4}
#dialogOptions{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden}

/* Блок ответов — колонка: список заполняет высоту, панель кнопок прижата к низу. */
.responseInner{height:100%;display:flex;flex-direction:column;padding:6px;box-sizing:border-box;min-height:0}
.responseInner #dialogOptions{flex:1 1 auto;min-height:0}

/* Ответы: выбор подсвечивается, применение — только по кнопке «Подтвердить». */
.dialogOption{
    padding:9px;
    border:1px solid transparent;
    background:var(--panel);
    color:#e7edf4;border-radius:7px;text-align:left;cursor:pointer;font:inherit;
    transition:background-color 50ms ease,border-color 50ms ease,box-shadow 50ms ease,color 50ms ease;
}
.dialogOption:hover,.dialogOption.quest-native-hover{background:var(--hover)}
.dialogOption.selected{background:var(--selected);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dialogOption:disabled{opacity:.38;cursor:not-allowed}
.optionText{display:block;font-size:14px}
.optionRequirements,.optionService,.optionReason{display:block;font-size:13px;font-weight:400;margin-top:4px}
.optionService{color:var(--accent)}
.optionRequirements,.optionReason{color:var(--muted)}

/* Невозвратный ответ: оранжевая звёздочка перед текстом и предупреждение
   курсивом в блоке допинформации. */
.irreversibleStar{color:var(--accent);margin-right:6px;font-size:13px}
.dialogOption.irreversible .optionText{font-weight:600}
.irreversibleNote{color:var(--muted);font-size:13px;line-height:1.4}
.irreversibleNote em{font-style:italic}
.irreversibleNote .irreversibleStar{margin-right:2px}

/* Панель кнопок: своя полоса во всю ширину блока ответов. */
#actionBar{
    display:flex;gap:8px;align-items:stretch;
    padding:8px 6px 6px;border-top:1px solid rgba(255,255,255,.12);
    flex:0 0 auto;
}
/* «Назад» всегда у правого края и не переносится — у неё личное место.
   «Подтвердить» расширяется до неё, но не перекрывает. */
.actionBack{flex:0 0 120px;max-width:120px}
.actionPrimary{flex:0 1 auto;min-width:0;max-width:calc(100% - 128px)}
.actionBtn{
    padding:10px 14px;border:1px solid transparent;border-radius:7px;
    background:var(--panel);color:#e7edf4;font:inherit;font-size:14px;
    cursor:pointer;text-align:center;
    transition:background-color 50ms ease,border-color 50ms ease,color 50ms ease;
}
.actionBtn:hover,.actionBtn.quest-native-hover{background:var(--hover)}
/* Подтвердить — акцентная кнопка. */
.actionBtn.primary{background:var(--accent);color:#1b1b1b;font-weight:600}
.actionBtn.primary:hover,.actionBtn.primary.quest-native-hover{background:#f0a52a}
/* Текст кнопки переносится максимум на две строки. */
.actionBtn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
/* Вариант инициации события «Поговорить» и его пометка «(продолжить)». */
.dialogOption.talkOption{background:var(--hover)}
.talkOption.continuation .optionText{color:var(--accent)}
#imagePanel{padding:12px}
#dialogImage{
    width:100%;height:100%;margin:0;object-fit:cover;
    border-radius:8px;background:rgba(0,0,0,1);display:none;
}
.serviceBlock{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.questRewardTitle{margin-top:9px;margin-bottom:4px;color:var(--accent);font-weight:700;font-size:14px}
.rewardLine{padding:3px 0;font-size:14px}
.rewardService{color:var(--muted);font-size:13px;font-weight:400}

/* Bookmarks use the SAME enter/exit motion as interface windows.
   Each bookmark controls only its own interface. Other bookmarks stay visible. */
#questTab,#inventoryTab{
    position:absolute;left:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:34px;padding:18px 6px;
    background:var(--panel);
    border:1px solid transparent;border-left:0;
    border-radius:0 7px 7px 0;
    color:var(--accent);font:700 14px/1 var(--font-ui);
    letter-spacing:1px;cursor:pointer;box-sizing:content-box;
    opacity:0;pointer-events:none;z-index:40;
    transform:translate(-115%,-50%);
    transition:transform 220ms ease,opacity 150ms ease;
    will-change:transform;
}
#questTab{top:50%}
#inventoryTab{top:calc(50% + 149px)}
#questTab.visible,#inventoryTab.visible{
    transform:translate(0,-50%);opacity:1;pointer-events:none;
    transition:transform 220ms ease,opacity 150ms ease;
}
#questTab.visible.interactive,#inventoryTab.visible.interactive{pointer-events:auto}
#questTab:hover,#inventoryTab:hover,
#questTab.quest-native-hover,#inventoryTab.quest-native-hover{background:var(--hover)}
#questTab.active,#inventoryTab.active{
    border-color:transparent;
    box-shadow:none;
}
#questTab.beacon,#inventoryTab.beacon{animation:bookmarkBeaconPulse 700ms ease-in-out 2}
@keyframes bookmarkBeaconPulse{
    0%,100%{box-shadow:0 0 2px rgba(229,147,16,.15)}
    50%{box-shadow:0 0 22px rgba(229,147,16,.95)}
}
.questTabText,.inventoryTabText{writing-mode:vertical-rl}
.questTabHint,.inventoryTabHint{
    position:absolute;left:0;right:0;bottom:2px;
    text-align:center;writing-mode:horizontal-tb;
    color:var(--muted);font:400 9px/1 var(--font-ui);letter-spacing:0;
}
#questTab.pulse,#inventoryTab.pulse{animation:none}

/* New-item indicator: a small circle in the same place where the old
   star marker was. It uses EXACTLY the bookmark beacon animation. */
.inventoryNewDot{
    display:inline-block;
    flex:0 0 7px;
    width:7px;
    height:7px;
    margin-left:6px;
    margin-top:4px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent);
    box-shadow:0 0 2px rgba(229,147,16,.15);
    animation:bookmarkBeaconPulse 700ms ease-in-out 2;
    will-change:box-shadow,transform;
}
.inventoryItemName{
    display:flex;align-items:flex-start;min-width:0;
}
.inventoryItemLabel{min-width:0}
#inventoryList{height:100%;padding:6px;overflow-y:auto;overflow-x:hidden;box-sizing:border-box}
.inventoryItem{
    width:100%;display:flex;justify-content:space-between;gap:8px;
    padding:9px 7px;margin-bottom:2px;border-radius:7px;
    border:1px solid transparent;background:var(--panel);color:#e7edf4;
    text-align:left;cursor:pointer;font:inherit;font-size:14px;
}
.inventoryItem:hover,.inventoryItem.quest-native-hover{background:var(--hover)}
.inventoryItem.selected{background:var(--selected);border-color:var(--accent)}
.inventoryItem small{color:var(--muted)}

#overlayError{
    position:fixed;left:50%;top:5vh;transform:translateX(-50%);
    background:rgba(80,28,28,.92);color:#fff;padding:8px 14px;border-radius:8px;
    opacity:0;transition:opacity 150ms ease;z-index:2147483646
}
#overlayError.show{opacity:1}
#rawInputDebug{display:none!important}
#cursorDot{
    position:fixed;left:0;top:0;width:27px;height:44px;display:none;
    z-index:2147483647;pointer-events:none;will-change:transform,opacity;
    transition:opacity 50ms ease-out;
    filter:drop-shadow(2px 3px 2px rgba(0,0,0,.82))
}
</style>
</head>
<body>
<div id="questApp" data-category="interactive">
 <div id="designCanvas">
  <div id="miniLogo" data-category="interactive"><img src="ets2a_logo.png" alt="ETS2 Assist"></div>
  <button id="questTab" type="button"><span class="questTabText">Квесты</span><span class="questTabHint">TAB</span></button>
  <button id="inventoryTab" type="button"><span class="inventoryTabText">Инвентарь</span><span class="inventoryTabHint">I</span></button>

  <div id="questWindow" class="interfaceWindow collapsed" data-category="interactive"><div id="questLayout">
   <section id="questSidebar"><div id="questList"></div></section>
   <section id="eventPanel"><div id="dialog" class="panelInner"><div id="dialogSpeaker"></div><div id="dialogText"></div></div></section>
   <section id="responsePanel">
    <div class="responseInner">
     <div class="panelTitle">Ответы</div>
     <div id="dialogOptions"></div>
     <div id="actionBar"></div>
    </div>
   </section>
   <section id="imagePanel"><img id="dialogImage" alt=""></section>
   <section id="servicePanel"><div class="panelInner"><div class="panelTitle">Служебная информация</div><div id="dialogService"></div></div></section>
  </div></div>

  <section id="inventoryWindow" class="interfaceWindow" data-category="interactive"><div id="inventoryList"></div></section>
 </div>

 <div id="overlayError" aria-live="polite"></div>
 <div id="rawInputDebug"></div>
 <img id="cursorDot" src="quests/images/cursor.png" alt="">

<script>
(function(){
    'use strict';
    var W=1920,H=1080;
    function applyDesignScale(){
        var c=document.getElementById('designCanvas');
        if(!c)return;
        var vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
        var s=Math.min(vw/W,vh/H);
        c.style.setProperty('--design-scale',String(s));
        c.style.transform='scale('+s+')';
    }
    window.addEventListener('resize',applyDesignScale);
    applyDesignScale();
})();
</script>
<script>
window.__questHtmlDiagBuild='QHTML-NAV-R27-2026-09-20';
window.__questBootstrapErrors=[];
window.addEventListener('error',function(e){
    try{
        var target=e&&e.target;
        window.__questBootstrapErrors.push(
            'resourceError message='+(e.message||'')+
            ' file='+(e.filename||'')+
            ' line='+(e.lineno||0)+
            ' target='+(target&&target.src||'')
        );
    }catch(_){}
},true);
window.addEventListener('unhandledrejection',function(e){
    try{
        window.__questBootstrapErrors.push('unhandledRejection reason='+(e&&e.reason&&e.reason.message||e&&e.reason||''));
    }catch(_){}
},true);
</script>
<script src="js/quests_ui.js?v=1.0.40.97"></script>
</body>
</html>
