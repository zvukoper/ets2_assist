<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETS2 Assist — интерактив R13 1.0.40.83</title>
<script src="js/debug_show.js"></script>
<script src="js/ui_category.js"></script>
<style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#e7edf4;background:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#questApp{position:fixed;inset:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity 150ms ease;z-index:100}
#questApp.interactiveVisible{visibility:visible;opacity:1;pointer-events:none}
#safeZone{position:fixed;left:5vw;right:5vw;top:5vh;bottom:5vh;pointer-events:none}
.panel{position:relative;min-width:0;min-height:0;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;box-sizing:border-box}
#miniLogo{position:absolute;left:0;top:0;width:104px;z-index:20;pointer-events:none}
#miniLogo img{display:block;width:86px;height:86px;object-fit:contain}
#miniLogoVersion{display:flex;flex-direction:column;gap:1px;margin-top:2px;font-size:9px;line-height:1.15;color:#b8c1cc;word-break:break-all}
#miniLogoVersion span:first-child{color:#e7edf4}
#questLayout{position:absolute;left:0;right:0;top:104px;bottom:0;display:grid;grid-template-columns:minmax(215px,24%) minmax(0,1fr) minmax(245px,28%);grid-template-rows:minmax(0,1fr) minmax(0,.56fr);gap:12px}
#questWindow{position:absolute;left:0;right:0;top:104px;bottom:0;opacity:1;transform:translateX(0);pointer-events:auto;transition:transform 320ms ease-out,opacity 96ms ease-out}
#questWindow.collapsed{opacity:0;transform:translateX(calc(-100% - 40px));pointer-events:none;transition:transform 320ms ease-in,opacity 92ms ease-in 224ms}
#questSidebar{grid-column:1;grid-row:1/3;display:flex;flex-direction:column}
#questList,.scroll{padding:6px;overflow:auto;min-height:0}
.questSectionTitle{padding:7px 6px 5px;color:#ffd45a;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.55px}
.questDivider{height:1px;background:rgba(255,255,255,.14);margin:6px 0}
.questItem{width:100%;display:block;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;color:#dce3eb;padding:8px 6px;text-align:left;cursor:pointer;border-radius:6px}
.questItem:hover,.questItem.selected{background:rgba(255,205,85,.11)}
.questItem strong{display:block;font-size:12px}
.questItem span{display:block;color:#8794a5;font-size:10px;margin-top:3px}
.questItem em{display:block;margin-top:4px;color:#8794a5;font-size:9px;font-style:normal;line-height:1.3}
.archiveToggle{margin:8px 6px 0;padding:8px;border:1px solid rgba(255,205,85,.22);background:rgba(0,0,0,.15);color:#ffd45a;border-radius:7px;cursor:pointer;text-transform:lowercase}
#eventPanel{grid-column:2;grid-row:1}
#responsePanel{grid-column:2;grid-row:2}
#imagePanel{grid-column:3;grid-row:1}
#servicePanel{grid-column:3;grid-row:2}
.panelInner{height:100%;padding:6px;box-sizing:border-box;overflow:auto}
.panelTitle{padding:6px;color:#ffd45a;font-weight:700;font-size:12px}
#dialog{height:100%;display:flex;flex-direction:column}
#dialogSpeaker{padding:0 6px 6px;color:#fff;font-size:17px;font-weight:700}
#dialogText{padding:0 6px;color:#fff;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow:auto;flex:1}
#dialogService{padding:6px;color:#c4ccd6;font:12px/1.4 'Courier New',monospace}
#dialogText.fading{opacity:0;transition:opacity 150ms ease}
#dialogText{transition:opacity 150ms ease}
#dialogOptions{height:100%;display:flex;flex-direction:column;gap:7px;overflow:auto}
.dialogOption{padding:9px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:#e7edf4;border-radius:7px;text-align:left;cursor:pointer;font:inherit}
.dialogOption:hover{border-color:rgba(255,211,77,.65);background:rgba(255,255,255,.06)}
.dialogOption:disabled{opacity:.38;cursor:not-allowed}
#dialogImage{width:calc(100% - 12px);height:calc(100% - 12px);margin:6px;object-fit:cover;border-radius:10px;background:rgba(0,0,0,.14);display:block}
.serviceBlock{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.questRewardTitle{margin-top:9px;margin-bottom:4px;color:#ffd45a;font-weight:700}
.rewardLine{padding:3px 0}
#questTab,#inventoryTab{position:absolute;left:0;width:94px;min-height:34px;padding:7px 10px;border-radius:0 9px 9px 0;border:1px solid rgba(255,205,85,.28);background:rgba(0,0,0,.55);color:#e7edf4;cursor:pointer;text-align:left;transition:transform 150ms ease,opacity 150ms ease;transform:translateX(-105%);opacity:0;pointer-events:auto;z-index:30}
#questTab{top:46%}
#inventoryTab{top:calc(46% + 45px)}
#questTab.visible,#inventoryTab.visible{transform:translateX(0);opacity:1}
#questTab.active,#inventoryTab.active{border-color:rgba(255,205,85,.7);color:#ffd45a}
#questTab.pulse{animation:questTabPulse 900ms ease-in-out 1}
@keyframes questTabPulse{0%,100%{transform:translateX(0) scale(1)}45%{transform:translateX(0) scale(1.045)}}
#inventoryWindow{position:absolute;left:0;top:104px;bottom:0;width:26%;display:none}
#inventoryWindow.visible{display:block}
#inventoryList{height:100%;padding:6px;overflow:auto;box-sizing:border-box}
.inventoryItem{width:100%;display:flex;justify-content:space-between;gap:8px;padding:9px 7px;margin-bottom:2px;border:0;border-bottom:1px solid rgba(255,255,255,.06);border-radius:6px;background:transparent;color:#dce3eb;text-align:left;cursor:pointer}
.inventoryItem:hover{background:rgba(255,205,85,.11)}
.inventoryItem small{color:#8c98a9}
#overlayError{position:fixed;left:50%;top:5vh;transform:translateX(-50%);background:rgba(80,28,28,.92);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity 150ms;z-index:2147483646}
#overlayError.show{opacity:1}
#cursorDot{position:fixed;left:0;top:0;width:27px;height:44px;display:none;z-index:2147483647;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.82))}
#rawInputDebug{display:none!important}
@media(max-width:1050px){#questLayout{grid-template-columns:210px minmax(0,1fr) 220px}.questItem strong{font-size:11px}}
</style>
</head>
<body data-category="interactive">
<div id="questApp">
 <div id="safeZone">
  <div id="miniLogo"><img src="ets2a_logo.png" alt="ETS2 Assist"><div id="miniLogoVersion"><span id="versionNumber">1.0.40.82</span><span id="versionText">CURSOR-CAL-TAB-QUEST-R12</span></div></div>
  <button id="questTab" type="button">Квесты</button>
  <button id="inventoryTab" type="button">Инвентарь<br><small>I</small></button>
  <div id="questWindow"><div id="questLayout">
   <section id="questSidebar" class="panel"><div id="questList"></div></section>
   <section id="eventPanel" class="panel"><div id="dialog" class="panelInner"><div id="dialogSpeaker"></div><div id="dialogText"></div></div></section>
   <section id="responsePanel" class="panel"><div class="panelInner"><div class="panelTitle">Ответы</div><div id="dialogOptions"></div></div></section>
   <section id="imagePanel" class="panel"><img id="dialogImage" alt=""></section>
   <section id="servicePanel" class="panel"><div class="panelInner"><div class="panelTitle">Служебная информация</div><div id="dialogService"></div></div></section>
  </div></div>
  <section id="inventoryWindow" class="panel"><div id="inventoryList"></div></section>
  <div id="overlayError" aria-live="polite"></div>
  <div id="rawInputDebug"></div>
  <img id="cursorDot" src="cursor.png" alt="">
 </div>
</div>
<script src="js/quests_ui.js"></script>
</body>
</html>
