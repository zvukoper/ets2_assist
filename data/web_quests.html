<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETS2 Assist — интерактив R13 1.0.40.83</title>
<script src="js/debug_show.js"></script>
<script src="js/ui_category.js"></script>
<style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#e7edf4;background:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}

/* The page itself fades; the quest panel also slides out when collapsed. */
#questApp{position:fixed;inset:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity 150ms ease;z-index:100}
#questApp.interactiveVisible{visibility:visible;opacity:1;pointer-events:none}

/* Pixel design space: all supplied measurements are from a 1920x1080 mockup.
   JS applies one uniform scale to this canvas so proportions never distort. */
#designCanvas{
    position:absolute;left:0;top:0;width:1920px;height:1080px;
    transform-origin:0 0;
    transform:scale(var(--design-scale,1));
    overflow:visible;
    pointer-events:none;
}

/* === supplied 1920x1080 geometry === */
#miniLogo{
    position:absolute;left:10px;top:1px;width:84px;height:83px;
    z-index:20;pointer-events:none;overflow:hidden;
}
#miniLogo img{display:block;width:84px;height:83px;object-fit:contain}
#miniLogoVersion{display:none}

/* STANDARD INTERFACE MOTION
   One reusable animation for every interactive screen: enter from outside,
   leave to outside. Future interfaces should use .interfaceWindow too. */
.interfaceWindow{
    position:absolute;
    box-sizing:border-box;
    opacity:0;
    transform:translateX(calc(-100% - 40px));
    pointer-events:none;
    transition:transform 220ms ease,opacity 160ms ease 160ms;
    will-change:transform,opacity;
}
.interfaceWindow.interfaceActive{
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
    transition:transform 220ms ease,opacity 160ms ease;
}
#questWindow{
    left:0;top:0;width:1410px;height:906px;
}
#questWindow.collapsed{
    opacity:0;transform:translateX(calc(-100% - 40px));pointer-events:none;
}
#inventoryWindow{
    left:104px;top:74px;width:278px;height:829px;
    z-index:35;
    border-radius:10px;
    background:rgba(23,24,25,.87);
    overflow:hidden;
}

#questLayout{position:absolute;left:0;top:0;width:1410px;height:906px;display:block}

#questSidebar,#eventPanel,#responsePanel,#imagePanel,#servicePanel{
    position:absolute;box-sizing:border-box;
    border:0;border-radius:10px;
    background:rgba(23,24,25,.87);
    box-shadow:none;
    overflow:hidden;
}
#questSidebar{left:104px;top:74px;width:278px;height:829px;display:flex;flex-direction:column}
#eventPanel{left:392px;top:75px;width:722px;height:278px}
#responsePanel{left:392px;top:365px;width:722px;height:540px}
#imagePanel{left:1124px;top:75px;width:286px;height:278px}
#servicePanel{left:1124px;top:365px;width:286px;height:540px}

#questList,.scroll{padding:6px;overflow:auto;min-height:0}
.questSectionTitle{padding:7px 6px 5px;color:#ffd45a;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.55px}
.questDivider{height:1px;background:rgba(255,255,255,.14);margin:6px 0}
.questItem{width:100%;display:block;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;color:#dce3eb;padding:8px 6px;text-align:left;cursor:pointer;border-radius:6px}
.questItem:hover,.questItem.selected{background:rgba(255,205,85,.11)}
.questItem strong{display:block;font-size:12px}
.questItem span{display:block;color:#8794a5;font-size:10px;margin-top:3px}
.questItem em{display:block;margin-top:4px;color:#8794a5;font-size:9px;font-style:normal;line-height:1.3}
.archiveToggle{margin:8px 6px 0;padding:8px;border:1px solid rgba(255,205,85,.22);background:rgba(0,0,0,.15);color:#ffd45a;border-radius:7px;cursor:pointer;text-transform:lowercase}

.panelInner{height:100%;padding:6px;box-sizing:border-box;overflow:auto}
.panelTitle{padding:6px;color:#ffd45a;font-weight:700;font-size:12px}
#dialog{height:100%;display:flex;flex-direction:column}
#dialogSpeaker{padding:0 6px 6px;color:#fff;font-size:17px;font-weight:700}
#dialogText{padding:0 6px;color:#fff;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow:auto;flex:1;transition:opacity 150ms ease}
#dialogText.fading{opacity:0}
#dialogService{padding:6px;color:#c4ccd6;font:12px/1.4 'Courier New',monospace}
#dialogOptions{height:100%;display:flex;flex-direction:column;gap:7px;overflow:auto}
.dialogOption{
    padding:9px;
    border:1px solid rgba(255,255,255,.12);
    background:rgb(19,20,21);
    color:#e7edf4;border-radius:7px;text-align:left;cursor:pointer;font:inherit;
    transition:background-color 50ms ease,border-color 50ms ease,box-shadow 50ms ease,color 50ms ease;
}
.dialogOption:hover,.dialogOption.quest-native-hover{
    border-color:rgba(255,211,77,.65);
    background:rgb(33,34,35);
}
.dialogOption:disabled{opacity:.38;cursor:not-allowed}
#imagePanel{padding:12px}
#dialogImage{
    width:100%;height:100%;margin:0;object-fit:cover;
    border-radius:8px;background:rgba(0,0,0,1);display:none;
}
.serviceBlock{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.questRewardTitle{margin-top:9px;margin-bottom:4px;color:#ffd45a;font-weight:700}
.rewardLine{padding:3px 0}

/* Bookmarks use the SAME enter/exit motion as interface windows.
   While any interface is open both bookmarks are physically outside the screen. */
#questTab,#inventoryTab{
    position:absolute;left:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:34px;padding:18px 6px;
    background:rgb(19,20,21);
    border:1px solid rgba(255,255,255,.12);border-left:0;
    border-radius:0 7px 7px 0;
    color:#ffd45a;font:700 14px/1 'Segoe UI',Arial,sans-serif;
    letter-spacing:1px;cursor:pointer;box-sizing:content-box;
    opacity:0;pointer-events:none;z-index:40;
    transform:translate(-115%,-50%);
    transition:transform 220ms ease,opacity 160ms ease 160ms;
    will-change:transform,opacity;
}
#questTab{top:50%}
#inventoryTab{top:calc(50% + 149px)}
#questTab.visible,#inventoryTab.visible{
    transform:translate(0,-50%);opacity:1;pointer-events:auto;
    transition:transform 220ms ease,opacity 160ms ease;
}
#questTab.active,#inventoryTab.active{
    border-color:rgba(255,205,85,.45);
    box-shadow:none;
}
.questTabText,.inventoryTabText{writing-mode:vertical-rl}
.questTabHint,.inventoryTabHint{
    position:absolute;left:0;right:0;bottom:2px;
    text-align:center;writing-mode:horizontal-tb;
    color:#5c646e;font:400 9px/1 'Segoe UI',Arial,sans-serif;letter-spacing:0;
}
#questTab.pulse,#inventoryTab.pulse{animation:questTabPulse 2s ease-in-out infinite}
@keyframes questTabPulse{
    0%,100%{box-shadow:0 0 2px rgba(255,205,85,.25)}
    50%{box-shadow:0 0 22px rgba(255,205,85,.95)}
}

/* New-item indicator: static, positioned to the RIGHT and slightly ABOVE the name. */
.inventoryNewDot{
    flex:0 0 auto;
    margin-left:6px;
    margin-top:-2px;
    color:#ffd45a;
    font:700 13px/1 'Segoe UI',Arial,sans-serif;
}
.inventoryItemName{
    display:flex;align-items:flex-start;min-width:0;
}
.inventoryItemLabel{min-width:0}
#inventoryList{height:100%;padding:6px;overflow:auto;box-sizing:border-box}
.inventoryItem{
    width:100%;display:flex;justify-content:space-between;gap:8px;
    padding:9px 7px;margin-bottom:2px;border-radius:7px;
    text-align:left;cursor:pointer;font:inherit;
}
.inventoryItem small{color:#8c98a9}

#overlayError{
    position:fixed;left:50%;top:5vh;transform:translateX(-50%);
    background:rgba(80,28,28,.92);color:#fff;padding:8px 14px;border-radius:8px;
    opacity:0;transition:opacity 150ms ease;z-index:2147483646
}
#overlayError.show{opacity:1}
#rawInputDebug{display:none!important}
#cursorDot{
    position:fixed;left:0;top:0;width:27px;height:44px;display:none;
    z-index:2147483647;pointer-events:none;will-change:transform,opacity;
    filter:drop-shadow(2px 3px 2px rgba(0,0,0,.82))
}
</style>
</head>
<body data-category="interactive">
<div id="questApp">
 <div id="designCanvas">
  <div id="miniLogo"><img src="ets2a_logo.png" alt="ETS2 Assist"></div>
  <button id="questTab" type="button"><span class="questTabText">Квесты</span><span class="questTabHint">TAB</span></button>
  <button id="inventoryTab" type="button"><span class="inventoryTabText">Инвентарь</span><span class="inventoryTabHint">I</span></button>

  <div id="questWindow" class="interfaceWindow collapsed"><div id="questLayout">
   <section id="questSidebar"><div id="questList"></div></section>
   <section id="eventPanel"><div id="dialog" class="panelInner"><div id="dialogSpeaker"></div><div id="dialogText"></div></div></section>
   <section id="responsePanel"><div class="panelInner"><div class="panelTitle">Ответы</div><div id="dialogOptions"></div></div></section>
   <section id="imagePanel"><img id="dialogImage" alt=""></section>
   <section id="servicePanel"><div class="panelInner"><div class="panelTitle">Служебная информация</div><div id="dialogService"></div></div></section>
  </div></div>

  <section id="inventoryWindow" class="interfaceWindow"><div id="inventoryList"></div></section>
 </div>

 <div id="overlayError" aria-live="polite"></div>
 <div id="rawInputDebug"></div>
 <img id="cursorDot" src="quests/images/cursor.png" alt="">

<script>
(function(){
    'use strict';
    var W=1920,H=1080;
    function applyDesignScale(){
        var c=document.getElementById('designCanvas');
        if(!c)return;
        var vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
        var s=Math.min(vw/W,vh/H);
        c.style.setProperty('--design-scale',String(s));
        c.style.transform='scale('+s+')';
    }
    window.addEventListener('resize',applyDesignScale);
    applyDesignScale();
})();
</script>
<script src="js/quests_ui.js"></script>
</body>
</html>
