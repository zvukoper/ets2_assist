<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ETS2 Map Editor 2</title>
<style>
:root{--top:40px;--footer:26px;--left:290px;--right:300px;--status:28px;--panel:#171c23;--line:rgba(150,165,185,.20);--font-scale:1.15}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1217;color:#e7ebf0;font:calc(12px * var(--font-scale)) "Segoe UI",Arial,sans-serif}body{user-select:none}
#app{width:100%;height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--footer)}
#topMenu{display:flex;align-items:center;gap:18px;padding:0 14px;background:#151a21;border-bottom:1px solid var(--line);position:relative}.brand{font-weight:700;font-size:calc(13px * var(--font-scale));margin-right:8px}.menuItem{color:#b8c0cb;cursor:pointer;padding:5px 2px}.menuItem:hover{color:#fff}.menuPopup{position:absolute;top:35px;left:92px;display:none;min-width:150px;background:#202732;border:1px solid rgba(180,195,215,.22);border-radius:4px;box-shadow:0 10px 22px rgba(0,0,0,.35);z-index:20;padding:4px}.menuPopup.open{display:block}.menuBtn{display:block;width:100%;border:0;background:transparent;color:#dce3eb;text-align:left;padding:7px 9px;font-size:calc(11px * var(--font-scale));cursor:pointer;border-radius:3px}.menuBtn:hover{background:#2b3440}
#workspace{min-height:0;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right)}
#leftPane,#rightPane{min-width:0;min-height:0;background:var(--panel);display:grid}#leftPane{grid-template-rows:auto 1fr;border-right:1px solid var(--line)}#rightPane{grid-template-rows:36px 1fr;border-left:1px solid var(--line)}
#pointTools{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:5px 6px;background:#151a21;border-bottom:1px solid var(--line)}.tool{border:1px solid rgba(150,165,185,.18);background:#202732;color:#dce3eb;border-radius:3px;padding:5px 7px;font-size:calc(10px * var(--font-scale));cursor:pointer}.tool:hover{background:#293240}.tool.active{background:#334052;border-color:rgba(170,190,215,.4)}
#categoryList{overflow:auto;padding:5px}.category{border:1px solid rgba(150,165,185,.14);border-radius:4px;background:#1a2028;margin-bottom:3px;overflow:hidden}.categoryHead{width:100%;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--catbg,#27303a);color:#edf1f5;border:0;text-align:left;cursor:pointer;font:600 calc(11px * var(--font-scale)) "Segoe UI",Arial,sans-serif}.categoryHead:hover{filter:brightness(1.12)}.caret{width:9px;color:#c5ced8}.catCheck,.pointCheck{accent-color:#b7ff46}.catName{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catCount{color:#dce2e8;font-weight:400;font-size:calc(9px * var(--font-scale));margin-left:2px}.eye{width:24px;height:22px;border:0;background:transparent;color:#f2f5f8;cursor:pointer;border-radius:3px;font-size:calc(13px * var(--font-scale));padding:0}.eye.off{opacity:.35}.categoryBody{display:none;padding:3px;border-top:1px solid rgba(255,255,255,.10)}.category.open .categoryBody{display:block}
.pointButton{display:flex;align-items:center;gap:5px;width:100%;border:0;background:#20262f;color:#dce2ea;border-radius:3px;padding:4px 6px;margin:0 0 2px;text-align:left;cursor:pointer;font:calc(10px * var(--font-scale)) "Segoe UI",Arial,sans-serif}.pointButton:hover{background:#29313d}.pointButton.selected{background:#2b3542}.pointCheck{display:none}.pointButton.multi .pointCheck,.category.multi .catCheck{display:block}.pointButton.selected .pointName{color:#fff}.pointName{display:block;font-weight:600;color:#f0f3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading,.empty{padding:7px;color:#8995a4;font-size:calc(9px * var(--font-scale))}
#mapPane{position:relative;min-width:0;min-height:0;background:#0f1217;display:grid;grid-template-rows:minmax(0,1fr) var(--status)}#map{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0f1217}canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#grid{z-index:0;pointer-events:none}#gl{z-index:1;cursor:default}#labels{z-index:2;pointer-events:none}
#status{display:flex;align-items:center;padding:0 8px;background:#151a21;border-top:1px solid var(--line);color:#c0c8d2;font-size:calc(10px * var(--font-scale));white-space:nowrap}.onlySelected{display:flex;align-items:center;gap:6px;cursor:pointer}.onlySelected input{width:15px;height:15px}
#mapInfo{position:absolute;right:8px;bottom:6px;z-index:5;pointer-events:none;text-align:right;color:#c3cbd5;text-shadow:0 1px 3px #000;background:rgba(10,13,17,.48);padding:3px 6px;border-radius:3px;font-size:calc(9px * var(--font-scale));white-space:nowrap}
#rightTitle{display:flex;align-items:center;padding:0 10px;background:#151a21;border-bottom:1px solid var(--line);font-weight:600;font-size:calc(11px * var(--font-scale))}#rightBody{padding:9px;overflow:auto}.hint{color:#85909e;line-height:1.4}.field{margin:0 0 8px}.label{color:#7f8a99;font-size:calc(9px * var(--font-scale));margin-bottom:2px}.value{color:#e8edf3;font-size:calc(10px * var(--font-scale));word-break:break-word}.createBtn{border:1px solid rgba(150,165,185,.24);background:#202732;color:#fff;border-radius:3px;padding:6px 9px;font-size:calc(10px * var(--font-scale));cursor:pointer}.createBtn:hover{background:#2c3643}
#footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#12171d;border-top:1px solid var(--line);color:#7f8a98;font-size:calc(9px * var(--font-scale))}.footerLeft{display:flex;gap:14px}
</style>
</head>
<body>
<div id="app">
<div id="topMenu"><div class="brand">Редактор карты 2</div><div class="menuItem" data-menu="file">Файл</div><div class="menuItem" data-menu="view">Вид</div><div class="menuItem" data-menu="points">Точки</div><div class="menuItem" data-menu="service">Сервис</div><div id="viewPopup" class="menuPopup"><button class="menuBtn" id="fontPlus">Шрифт+</button><button class="menuBtn" id="fontMinus">Шрифт-</button></div></div>
<div id="workspace">
<aside id="leftPane"><div id="pointTools"><button class="tool" id="showAllBtn">Показать все</button><button class="tool" id="hideAllBtn">Скрыть все</button><button class="tool" id="invertBtn">Инверсия</button><button class="tool" id="resetBtn">Сброс</button><button class="tool active" data-tool="select">Выбор</button><button class="tool" data-tool="add">Добавить</button><button class="tool" data-tool="delete">Удалить</button><button class="tool" id="fitBtn">Fit</button></div><div id="categoryList"><div class="loading">Загрузка категорий…</div></div></aside>
<section id="mapPane"><div id="map"><canvas id="grid"></canvas><canvas id="gl"></canvas><canvas id="labels"></canvas><div id="mapInfo"></div></div><div id="status"><label class="onlySelected"><input id="onlySelectedChk" type="checkbox">только выделенные</label></div></section>
<aside id="rightPane"><div id="rightTitle">Редактирование точки</div><div id="rightBody"><div class="hint">Выберите точку в левом сайдбаре или на карте.</div></div></aside>
</div>
<footer id="footer"><div class="footerLeft"><span>ETS2 Assist</span><span>Map Editor 2</span></div><span>WebGL2</span></footer>
</div>
<script>
(()=>{
'use strict';
const map=document.getElementById('map'),glCanvas=document.getElementById('gl'),labelCanvas=document.getElementById('labels'),gridCanvas=document.getElementById('grid'),labelCtx=labelCanvas.getContext('2d'),gridCtx=gridCanvas.getContext('2d'),status=document.getElementById('status'),categoryList=document.getElementById('categoryList'),rightBody=document.getElementById('rightBody'),mapInfo=document.getElementById('mapInfo'),onlySelectedChk=document.getElementById('onlySelectedChk');
const gl=glCanvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false});if(!gl){status.textContent='Map Editor 2 · WebGL2 unavailable';return;}
const dpr=Math.min(devicePixelRatio||1,1.5),camera={x:0,z:0,mpp:100},limits={minMpp:.02,maxMpp:10000},bounds={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};
let roadsCount=0,roadCasing=null,roadInner=null,roadCasingBuffer=gl.createBuffer(),roadInnerBuffer=gl.createBuffer(),allPoints=[],externalPoints=[],selectedPoint=null,selectedIds=new Set(),selectedCategories=new Set(),rightPanning=false,lastX=0,lastY=0,dirty=true,raf=0,activeTool='select',multiMode=false,onlySelected=false,staticFiles=[],metaCategories={},categories=[],loadedPointFileCount=0,gridWorldStep=100,fontScale=1.15;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roadVS=`#version 300 es\nprecision highp float;layout(location=0) in vec2 a_pos;uniform vec2 u_center;uniform float u_mpp;uniform vec2 u_viewport;void main(){float sx=u_viewport.x*.5+(a_pos.x-u_center.x)/u_mpp*${dpr.toFixed(3)};float sy=u_viewport.y*.5+(a_pos.y-u_center.y)/u_mpp*${dpr.toFixed(3)};gl_Position=vec4(sx/u_viewport.x*2.-1.,1.-sy/u_viewport.y*2.,0,1);}`;
const flatFS=`#version 300 es\nprecision mediump float;uniform vec4 u_color;out vec4 outColor;void main(){outColor=u_color;}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const roadProgram=prog(roadVS,flatFS),roadVAO=gl.createVertexArray();gl.bindVertexArray(roadVAO);gl.bindBuffer(gl.ARRAY_BUFFER,roadCasingBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function mapSize(){return{w:Math.max(1,map.clientWidth),h:Math.max(1,map.clientHeight)}}
function resize(){const s=mapSize(),w=Math.floor(s.w*dpr),h=Math.floor(s.h*dpr);for(const c of [glCanvas,labelCanvas,gridCanvas]){c.width=w;c.height=h;c.style.width=s.w+'px';c.style.height=s.h+'px'}labelCtx.setTransform(dpr,0,0,dpr,0,0);gridCtx.setTransform(dpr,0,0,dpr,0,0);dirty=true;requestFrame()}addEventListener('resize',resize);resize();
function resetBounds(){bounds.minX=Infinity;bounds.maxX=-Infinity;bounds.minZ=Infinity;bounds.maxZ=-Infinity}function addBounds(x,z){if(x<bounds.minX)bounds.minX=x;if(x>bounds.maxX)bounds.maxX=x;if(z<bounds.minZ)bounds.minZ=z;if(z>bounds.maxZ)bounds.maxZ=z}
function pushLine(coords,seg){if(!Array.isArray(coords)||coords.length<2)return;for(let i=1;i<coords.length;i++){const a=coords[i-1],b=coords[i];if(!Array.isArray(a)||!Array.isArray(b)||a.length<2||b.length<2)continue;const ax=Number(a[0]),az=Number(a[1]),bx=Number(b[0]),bz=Number(b[1]);if(!Number.isFinite(ax)||!Number.isFinite(az)||!Number.isFinite(bx)||!Number.isFinite(bz))continue;seg.push(ax,az,bx,bz);addBounds(ax,az);addBounds(bx,bz)}}
function buildMesh(seg,width){const out=[],hw=width*.5;for(let i=0;i<seg.length;i+=4){const ax=seg[i],az=seg[i+1],bx=seg[i+2],bz=seg[i+3],dx0=bx-ax,dz0=bz-az,len=Math.hypot(dx0,dz0);if(len<1e-6)continue;const dx=dx0/len,dz=dz0/len,px=-dz*hw,pz=dx*hw,x1=ax+px,z1=az+pz,x2=ax-px,z2=az-pz,x3=bx-px,z3=bz-pz,x4=bx+px,z4=bz+pz;out.push(x1,z1,x2,z2,x3,z3,x1,z1,x3,z3,x4,z4)}return new Float32Array(out)}
function fitRoads(){if(!Number.isFinite(bounds.minX))return;const s=mapSize(),dx=Math.max(1,bounds.maxX-bounds.minX),dz=Math.max(1,bounds.maxZ-bounds.minZ);camera.x=(bounds.minX+bounds.maxX)*.5;camera.z=(bounds.minZ+bounds.maxZ)*.5;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.82),dz/(s.h*.82))));dirty=true;requestFrame()}
function loadRoads(){fetch('../GeoJson/roads.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(geo=>{resetBounds();const seg=[];for(const f of geo.features||[]){const g=f&&f.geometry;if(!g)continue;if(g.type==='LineString')pushLine(g.coordinates,seg);else if(g.type==='MultiLineString')for(const l of g.coordinates||[])pushLine(l,seg)}roadsCount=seg.length/4;roadCasing=buildMesh(seg,55);roadInner=buildMesh(seg,31);gl.bindBuffer(gl.ARRAY_BUFFER,roadCasingBuffer);gl.bufferData(gl.ARRAY_BUFFER,roadCasing,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,roadInnerBuffer);gl.bufferData(gl.ARRAY_BUFFER,roadInner,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,null);fitRoads();updateStatus()}).catch(e=>{status.textContent='Road load failed: '+e.message;console.error(e)})}
function parseColor(s){if(typeof s!=='string'||!s)return[.65,.65,.65];let t=s.trim().toLowerCase();const n={red:[1,.2,.2],green:[.35,.9,.4],blue:[.3,.6,1],yellow:[1,.9,.2],orange:[1,.55,.2],gray:[.65,.65,.65],grey:[.65,.65,.65],white:[.95,.95,.95]};if(n[t])return n[t];if(t[0]==='#')t=t.slice(1);if(/^[0-9a-f]{6}$/.test(t))return[parseInt(t.slice(0,2),16)/255,parseInt(t.slice(2,4),16)/255,parseInt(t.slice(4,6),16)/255];if(/^[0-9a-f]{3}$/.test(t))return[parseInt(t[0]+t[0],16)/255,parseInt(t[1]+t[1],16)/255,parseInt(t[2]+t[2],16)/255];return[.65,.65,.65]}
function categoryVisible(key){const c=categories.find(x=>x.key===key);return c?c.visible!==false:true}function getVisiblePoints(){return allPoints.filter(p=>categoryVisible(p.category)&&(!onlySelected||(selectedIds.has(p.id)||selectedPoint?.id===p.id)))}
function rebuildPoints(){allPoints=externalPoints.concat(categories.filter(c=>c.key!=='__custom').flatMap(c=>(c.points||[]).map(p=>({...p,category:p.category||c.key,color:p.color||c.color}))));const cc=categories.find(c=>c.key==='__custom');if(cc)allPoints=allPoints.concat(cc.points||[]);dirty=true;requestFrame();updateStatus()}
window.MapEditor2SetTargets=items=>{externalPoints=Array.isArray(items)?items.map((p,i)=>({...p,source:'custom',category:'__custom',name:p.name||p.id||('Цель '+(i+1)),color:p.color||'#ffd45c'})):[];const c=categories.find(x=>x.key==='__custom');if(c)c.points=externalPoints;else categories.push({key:'__custom',label:'Цели',color:'#a78945',files:[],points:externalPoints,loaded:true,visible:true});rebuildPoints();renderCategories()};
function getCandidates(data){if(Array.isArray(data))return data;for(const k of ['objects','points','items'])if(Array.isArray(data?.[k]))return data[k];if(data?.type==='FeatureCollection'&&Array.isArray(data.features))return data.features;return[]}
function categoryFromFile(path){const base=path.split('/').pop().replace(/\.json$/i,'');if(base==='meta')return null;let key=base,isEaster=base.startsWith('easter_');if(base.startsWith('model_'))key=base.slice(6);else if(base.startsWith('overlay_'))key=base.slice(8);else if(isEaster)key='Easter eggs';const meta=metaCategories[key]||{};return{key,label:meta.name||key,color:meta.color||'#6f7f8f',files:[path],points:[],loaded:false,visible:true}}
function groupFiles(){const by=new Map();for(const path of staticFiles){const c=categoryFromFile(path);if(!c)continue;let target=by.get(c.key);if(!target){target={...c,files:[],points:[],loaded:false,visible:true};by.set(c.key,target)}target.files.push(path)}categories=[...by.values()].sort((a,b)=>a.label.localeCompare(b.label,'ru'))}
function renderCategoryBody(cat,head,body){head.querySelector('.catCount').textContent=cat.points.length.toLocaleString();body.innerHTML='';if(!cat.points.length){body.innerHTML='<div class="empty">Точек с координатами X/Z не найдено</div>';return}const frag=document.createDocumentFragment();for(const p of cat.points){const b=document.createElement('button');b.className='pointButton'+(selectedIds.has(p.id)||(selectedPoint&&selectedPoint.id===p.id)?' selected':'')+(multiMode?' multi':'');b.innerHTML=`<input class="pointCheck" type="checkbox" ${selectedIds.has(p.id)?'checked':''} aria-label="Выбрать"><span class="pointName">${esc(p.name)}</span>`;const cb=b.querySelector('.pointCheck');cb.addEventListener('click',e=>{e.stopPropagation();togglePointMulti(cat,p,cb.checked)});b.addEventListener('click',()=>{if(multiMode)togglePointMulti(cat,p,!selectedIds.has(p.id));else selectPoint(p,b,true)});frag.appendChild(b)}body.appendChild(frag)}
async function readCategory(cat){if(cat.loaded)return;const all=[];for(const file of cat.files){try{const r=await fetch('../'+file,{cache:'no-store'});if(!r.ok)continue;const data=await r.json();const raw=getCandidates(data);const isEaster=Boolean(data?.easter)||file.toLowerCase().split('/').pop().startsWith('easter_');const displayCategory=cat.label;raw.forEach((o,i)=>{if(!o||typeof o!=='object')return;let x=Number(o.x),z=Number(o.z);if((!Number.isFinite(x)||!Number.isFinite(z))&&o.position){x=Number(o.position.x);z=Number(o.position.z)}if((!Number.isFinite(x)||!Number.isFinite(z))&&o.geometry?.type==='Point'&&Array.isArray(o.geometry.coordinates)){x=Number(o.geometry.coordinates[0]);z=Number(o.geometry.coordinates[1])}if(!Number.isFinite(x)||!Number.isFinite(z))return;const uid=String(o.uid??o.id??o.name??(i+1));const name=isEaster?String(o.name??uid):String(displayCategory);all.push({id:`${file}:${uid}:${i}`,file,name,x,z,color:cat.color,category:cat.key})})}catch(err){console.warn('Point file failed',file,err)}}cat.points=all;cat.loaded=true;loadedPointFileCount+=cat.files.length}
async function loadCategory(cat,head,body){body.innerHTML='<div class="loading">Загрузка…</div>';await readCategory(cat);rebuildPoints();renderCategoryBody(cat,head,body)}
function renderCategories(){categoryList.innerHTML='';categories.forEach(cat=>{const el=document.createElement('div');el.className='category'+(cat.key==='wild_animals'?' open':'')+(multiMode?' multi':'');el.style.setProperty('--catbg',cat.color+'aa');const head=document.createElement('div');head.className='categoryHead';head.innerHTML=`<span class="caret">${el.classList.contains('open')?'▾':'▸'}</span>${multiMode?`<input class="catCheck" type="checkbox" ${selectedCategories.has(cat.key)?'checked':''}>`:''}<span class="catName">${esc(cat.label)}</span><span class="catCount">${cat.points.length?cat.points.length.toLocaleString():cat.files.length+' file'}</span><button class="eye ${cat.visible===false?'off':''}" title="${cat.visible===false?'Показать':'Скрыть'} категорию">◉</button>`;const body=document.createElement('div');body.className='categoryBody';body.innerHTML='<div class="loading">Загрузка…</div>';const cb=head.querySelector('.catCheck');if(cb)cb.addEventListener('click',e=>{e.stopPropagation();toggleCategoryMulti(cat,cb.checked)});head.addEventListener('click',async e=>{if(e.target.closest('.eye')||e.target.closest('.catCheck'))return;el.classList.toggle('open');head.querySelector('.caret').textContent=el.classList.contains('open')?'▾':'▸';if(el.classList.contains('open')){if(!cat.loaded&&cat.files.length)await loadCategory(cat,head,body);else renderCategoryBody(cat,head,body)}});head.querySelector('.eye').addEventListener('click',e=>{e.stopPropagation();cat.visible=cat.visible===false;renderCategories();dirty=true;requestFrame()});el.append(head,body);categoryList.appendChild(el);if(cat.key==='wild_animals'&&!cat.loaded)loadCategory(cat,head,body)})}
function toggleCategoryMulti(cat,checked){if(!multiMode)return;if(selectedIds.size)selectedIds.clear();if(checked){selectedCategories.clear();selectedCategories.add(cat.key);for(const p of cat.points)selectedIds.add(p.id)}else selectedCategories.delete(cat.key);syncSidebarSelection();fitSelection()}
function togglePointMulti(cat,p,checked){if(!multiMode)return;if(selectedCategories.size)selectedCategories.clear();if(checked)selectedIds.add(p.id);else selectedIds.delete(p.id);selectedPoint=null;syncSidebarSelection();fitSelection()}
function syncSidebarSelection(){categories.forEach((cat,i)=>{const el=categoryList.children[i];if(!el)return;const cb=el.querySelector('.catCheck');if(cb)cb.checked=selectedCategories.has(cat.key);el.querySelectorAll('.pointButton').forEach(b=>{const name=b.querySelector('.pointName')?.textContent;const p=cat.points.find(x=>x.name===name);if(!p)return;b.classList.toggle('selected',selectedIds.has(p.id)||(selectedPoint?.id===p.id));const pc=b.querySelector('.pointCheck');if(pc)pc.checked=selectedIds.has(p.id)})})}
async function openSidebarPoint(p){const idx=categories.findIndex(c=>c.key===p.category);if(idx<0)return;const el=categoryList.children[idx];const cat=categories[idx];if(!el)return;el.classList.add('open');const caret=el.querySelector('.caret');if(caret)caret.textContent='▾';const body=el.querySelector('.categoryBody'),head=el.querySelector('.categoryHead');if(!cat.loaded&&cat.files.length)await loadCategory(cat,head,body);else renderCategoryBody(cat,head,body);requestAnimationFrame(()=>{const btn=[...el.querySelectorAll('.pointButton')].find(x=>x.querySelector('.pointName')?.textContent===p.name);btn?.scrollIntoView({block:'nearest'})})}
async function selectPoint(p,button,zoom){selectedIds.clear();selectedCategories.clear();selectedPoint=p;multiMode=false;document.querySelector('.tool[data-tool="select"]')?.classList.add('active');document.querySelectorAll('.pointButton.selected').forEach(x=>x.classList.remove('selected'));if(button)button.classList.add('selected');await openSidebarPoint(p);if(zoom!==false){camera.x=p.x;camera.z=p.z;camera.mpp=.5}showPointInfo(p);dirty=true;requestFrame()}
function showPointInfo(p){rightBody.innerHTML=`<div class="field"><div class="label">Категория</div><div class="value">${esc(p.category||p.source||'')}</div></div><div class="field"><div class="label">Название</div><div class="value">${esc(p.name)}</div></div><div class="field"><div class="label">X</div><div class="value">${p.x.toFixed(3)}</div></div><div class="field"><div class="label">Z</div><div class="value">${p.z.toFixed(3)}</div></div><div class="field"><div class="label">Файл</div><div class="value">${esc(p.file||'')}</div></div>`}
function clearSelections(){selectedPoint=null;selectedIds.clear();selectedCategories.clear();multiMode=false;document.querySelector('.tool[data-tool="select"]')?.classList.add('active');renderCategories();syncSidebarSelection();dirty=true;requestFrame();rightBody.innerHTML='<div class="hint">Выделение сброшено.</div>'}
function fitSelection(){const pts=allPoints.filter(p=>selectedIds.has(p.id)&&categoryVisible(p.category));if(!pts.length)return;let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)}const s=mapSize(),dx=Math.max(50,maxX-minX),dz=Math.max(50,maxZ-minZ);camera.x=(minX+maxX)/2;camera.z=(minZ+maxZ)/2;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.72),dz/(s.h*.72))));dirty=true;requestFrame()}
function niceWorldStep(target){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,target))));const n=target/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p}
function updateGrid(){const s=mapSize(),target=camera.mpp*80;gridWorldStep=niceWorldStep(target);const px=gridWorldStep/camera.mpp;gridCtx.setTransform(dpr,0,0,dpr,0,0);gridCtx.clearRect(0,0,s.w,s.h);if(!Number.isFinite(px)||px<22||px>260)return;const left=camera.x-s.w*.5*camera.mpp,top=camera.z-s.h*.5*camera.mpp,sx=(-((left%gridWorldStep)+gridWorldStep)%gridWorldStep)/camera.mpp,sy=(-((top%gridWorldStep)+gridWorldStep)%gridWorldStep)/camera.mpp;gridCtx.lineWidth=1;gridCtx.strokeStyle='rgba(125,140,160,.22)';gridCtx.beginPath();for(let x=sx;x<s.w;x+=px){gridCtx.moveTo(Math.round(x)+.5,0);gridCtx.lineTo(Math.round(x)+.5,s.h)}for(let y=sy;y<s.h;y+=px){gridCtx.moveTo(0,Math.round(y)+.5);gridCtx.lineTo(s.w,Math.round(y)+.5)}gridCtx.stroke();const major=px*5;gridCtx.strokeStyle='rgba(170,185,205,.36)';gridCtx.beginPath();for(let x=sx;x<s.w;x+=major){gridCtx.moveTo(Math.round(x)+.5,0);gridCtx.lineTo(Math.round(x)+.5,s.h)}for(let y=sy;y<s.h;y+=major){gridCtx.moveTo(0,Math.round(y)+.5);gridCtx.lineTo(s.w,Math.round(y)+.5)}gridCtx.stroke()}
function drawRoadBuffer(obj,count,color){gl.bindBuffer(gl.ARRAY_BUFFER,obj);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.useProgram(roadProgram);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_center'),camera.x,camera.z);gl.uniform1f(gl.getUniformLocation(roadProgram,'u_mpp'),camera.mpp);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_viewport'),glCanvas.width,glCanvas.height);gl.uniform4f(gl.getUniformLocation(roadProgram,'u_color'),color[0],color[1],color[2],1);gl.drawArrays(gl.TRIANGLES,0,count)}
function drawRoads(){if(!roadCasing||!roadInner)return;gl.bindVertexArray(roadVAO);drawRoadBuffer(roadCasingBuffer,roadCasing.length/2,[.055,.065,.08]);gl.bindBuffer(gl.ARRAY_BUFFER,roadInnerBuffer);drawRoadBuffer(roadInnerBuffer,roadInner.length/2,[.46,.51,.58]);gl.bindVertexArray(null)}
function worldToScreen(p){const s=mapSize();return{x:s.w*.5+(p.x-camera.x)/camera.mpp,y:s.h*.5+(p.z-camera.z)/camera.mpp}}
function drawPointsAndLabels(){const s=mapSize();labelCtx.setTransform(dpr,0,0,dpr,0,0);labelCtx.clearRect(0,0,s.w,s.h);if(camera.mpp>800)return;const fontBase=10*fontScale;labelCtx.textAlign='center';labelCtx.textBaseline='bottom';labelCtx.lineJoin='round';let drawn=0;for(const p of getVisiblePoints()){const q=worldToScreen(p);if(q.x<-80||q.x>s.w+80||q.y<-45||q.y>s.h+25)continue;const selected=selectedIds.has(p.id)||selectedPoint?.id===p.id;const radius=selected?8:6;const c=parseColor(p.color);labelCtx.beginPath();labelCtx.arc(q.x,q.y,radius,0,Math.PI*2);labelCtx.fillStyle=`rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;labelCtx.fill();labelCtx.lineWidth=selected?5:3;labelCtx.strokeStyle=selected?'lime':'black';labelCtx.stroke();labelCtx.font=`${(selected?fontBase*1.05:fontBase).toFixed(2)}px Segoe UI,Arial,sans-serif`;labelCtx.fontWeight=selected?'700':'600';labelCtx.fillStyle=selected?'#ffffff':'#e7ebf0';labelCtx.lineWidth=3;labelCtx.strokeStyle='rgba(0,0,0,.95)';const labelY=q.y-radius-4;labelCtx.strokeText(p.name,q.x,labelY);labelCtx.fillText(p.name,q.x,labelY);if(++drawn>1800)break}}
function findPointAt(px,py){let best=null,bestD=Infinity;for(const p of getVisiblePoints()){const q=worldToScreen(p),d=Math.hypot(q.x-px,q.y-py);if(d<=12&&d<bestD){best=p;bestD=d}}return best}
function render(){if(!dirty)return;dirty=false;gl.viewport(0,0,glCanvas.width,glCanvas.height);gl.clearColor(15/255,18/255,23/255,1);gl.clear(gl.COLOR_BUFFER_BIT);updateGrid();drawRoads();drawPointsAndLabels();mapInfo.textContent=`Zoom ${camera.mpp.toFixed(3)} m/px · клетка ${gridWorldStep.toFixed(3)} м · roads ${roadsCount.toLocaleString()} · points ${allPoints.length.toLocaleString()}`}
function requestFrame(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function updateStatus(){onlySelectedChk.checked=onlySelected}
function screenToWorld(px,py){const r=map.getBoundingClientRect();return{x:camera.x+(px-r.left-r.width*.5)*camera.mpp,z:camera.z+(py-r.top-r.height*.5)*camera.mpp}}
function setCursor(e){const r=map.getBoundingClientRect(),p=findPointAt(e.clientX-r.left,e.clientY-r.top);glCanvas.style.cursor=rightPanning?'grabbing':(p?'pointer':'default')}
function createAtScreen(e){const w=screenToWorld(e.clientX,e.clientY);rightBody.innerHTML=`<div class="field"><div class="label">Режим</div><div class="value">Новая точка</div></div><div class="field"><div class="label">X</div><div class="value">${w.x.toFixed(2)}</div></div><div class="field"><div class="label">Y</div><div class="value">0.00</div></div><div class="field"><div class="label">Z</div><div class="value">${w.z.toFixed(2)}</div></div><button class="createBtn" id="copyCreateBtn">Скопировать координаты</button>`;document.getElementById('copyCreateBtn').onclick=()=>{navigator.clipboard?.writeText(`${w.x.toFixed(2)}, 0, ${w.z.toFixed(2)}`)};window.chrome?.webview?.postMessage(JSON.stringify({type:'map2-create-point',x:w.x,y:0,z:w.z}))}
function setMultiMode(on){multiMode=on;selectedPoint=null;if(on){selectedIds.clear();selectedCategories.clear()}syncSidebarSelection();renderCategories()}
glCanvas.addEventListener('pointermove',e=>{if(rightPanning){camera.x-=(e.clientX-lastX)*camera.mpp;camera.z-=(e.clientY-lastY)*camera.mpp;lastX=e.clientX;lastY=e.clientY;dirty=true;requestFrame();return}setCursor(e)});
glCanvas.addEventListener('pointerleave',()=>{if(!rightPanning)glCanvas.style.cursor='default'});
glCanvas.addEventListener('pointerdown',e=>{if(e.button!==2)return;e.preventDefault();rightPanning=true;lastX=e.clientX;lastY=e.clientY;glCanvas.setPointerCapture(e.pointerId);glCanvas.style.cursor='grabbing'});
glCanvas.addEventListener('pointerup',e=>{if(e.button!==2)return;rightPanning=false;try{glCanvas.releasePointerCapture(e.pointerId)}catch{}setCursor(e)});
glCanvas.addEventListener('contextmenu',e=>e.preventDefault());
glCanvas.addEventListener('click',e=>{if(e.button!==0)return;const r=map.getBoundingClientRect(),p=findPointAt(e.clientX-r.left,e.clientY-r.top);if(p){if(multiMode)togglePointMulti(p.category,p,!selectedIds.has(p.id));else selectPoint(p,null,true);return}if(!multiMode)createAtScreen(e)});
glCanvas.addEventListener('wheel',e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),factor=Math.pow(1.13,e.deltaY/100);camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,camera.mpp*factor));const after=screenToWorld(e.clientX,e.clientY);camera.x+=before.x-after.x;camera.z+=before.z-after.z;dirty=true;requestFrame()},{passive:false});
onlySelectedChk.addEventListener('change',()=>{onlySelected=onlySelectedChk.checked;dirty=true;requestFrame()});
document.querySelectorAll('.tool[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.tool==='select'){document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');setMultiMode(!multiMode);return}document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeTool=btn.dataset.tool}));
document.getElementById('showAllBtn').addEventListener('click',()=>{categories.forEach(c=>c.visible=true);renderCategories();dirty=true;requestFrame()});document.getElementById('hideAllBtn').addEventListener('click',()=>{categories.forEach(c=>c.visible=false);renderCategories();dirty=true;requestFrame()});document.getElementById('invertBtn').addEventListener('click',()=>{categories.forEach(c=>c.visible=c.visible===false);renderCategories();dirty=true;requestFrame()});document.getElementById('resetBtn').addEventListener('click',clearSelections);document.getElementById('fitBtn').addEventListener('click',()=>{if(selectedIds.size)fitSelection();else fitRoads()});
const viewPopup=document.getElementById('viewPopup');document.querySelector('[data-menu="view"]').addEventListener('click',e=>{e.stopPropagation();viewPopup.classList.toggle('open')});document.addEventListener('click',()=>viewPopup.classList.remove('open'));document.getElementById('fontPlus').addEventListener('click',()=>{fontScale=Math.min(2,fontScale+.01);document.documentElement.style.setProperty('--font-scale',fontScale.toFixed(2));dirty=true;requestFrame()});document.getElementById('fontMinus').addEventListener('click',()=>{fontScale=Math.max(.75,fontScale-.01);document.documentElement.style.setProperty('--font-scale',fontScale.toFixed(2));dirty=true;requestFrame()});
window.MapEditor2SetStaticPointFiles=files=>{staticFiles=Array.isArray(files)?files.filter(x=>typeof x==='string'&&/\.json$/i.test(x)):[];loadStaticPointData()};
async function loadStaticPointData(){try{const meta=await fetch('../editor_static_data/meta.json',{cache:'no-store'}).then(r=>r.json());metaCategories=meta?.categories&&typeof meta.categories==='object'?meta.categories:{}}catch(err){console.warn('meta.json failed',err)}groupFiles();renderCategories();loadRoads();await Promise.all(categories.map(c=>readCategory(c).catch(()=>{})));rebuildPoints();renderCategories();window.chrome?.webview?.postMessage('map2-data-ready')}
window.MapEditor2ShowNewPoint=(x,y,z)=>{rightBody.innerHTML=`<div class="field"><div class="label">Режим</div><div class="value">Новая точка</div></div><div class="field"><div class="label">X</div><div class="value">${Number(x).toFixed(2)}</div></div><div class="field"><div class="label">Y</div><div class="value">${Number(y).toFixed(2)}</div></div><div class="field"><div class="label">Z</div><div class="value">${Number(z).toFixed(2)}</div></div>`};
window.chrome?.webview?.postMessage('map2-ready');
})();
</script>
</body>
</html>
