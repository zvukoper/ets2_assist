<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ETS2 Map Editor 2</title>
<style>
html,body,#map,#gl,#labels{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1217}
body{touch-action:none;user-select:none}
#map{position:relative}
canvas{position:absolute;inset:0;display:block}
#labels{pointer-events:none}
#status{position:absolute;left:12px;top:10px;z-index:5;color:#d2d8e0;font:11px "Segoe UI",sans-serif;background:rgba(15,18,23,.86);padding:6px 9px;border-radius:3px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="map">
  <canvas id="gl"></canvas>
  <canvas id="labels"></canvas>
  <div id="status">Map Editor 2 · loading…</div>
</div>
<script>
(() => {
'use strict';
const glCanvas=document.getElementById('gl');
const labelCanvas=document.getElementById('labels');
const labelCtx=labelCanvas.getContext('2d');
const status=document.getElementById('status');
const gl=glCanvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
if(!gl){status.textContent='Map Editor 2 · WebGL2 unavailable';return;}
const dpr=Math.min(devicePixelRatio||1,1.5);
const camera={x:0,z:0,mpp:100};
const limits={minMpp:.02,maxMpp:10000};
const bounds={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};
let roadsCount=0,roadsVertices=0,roadCasing=null,roadInner=null;
let pointsCount=0,pointsLabel=[];
let dragging=false,lastX=0,lastY=0,dirty=true,raf=0;

const roadVS=`#version 300 es
precision highp float;
layout(location=0) in vec2 a_pos;
uniform vec2 u_center;
uniform float u_mpp;
uniform vec2 u_viewport;
uniform float u_widthWorld;
void main(){
  vec2 p=a_pos;
  float sx=u_viewport.x*.5+(p.x-u_center.x)/u_mpp*${dpr.toFixed(3)};
  float sy=u_viewport.y*.5+(p.y-u_center.y)/u_mpp*${dpr.toFixed(3)};
  gl_Position=vec4(sx/u_viewport.x*2.0-1.0,1.0-sy/u_viewport.y*2.0,0,1);
}`;
const flatFS=`#version 300 es
precision mediump float;
uniform vec4 u_color;
out vec4 outColor;
void main(){outColor=u_color;}`;
const pointVS=`#version 300 es
precision highp float;
layout(location=0) in vec2 a_pos;
layout(location=1) in vec4 a_color;
uniform vec2 u_center;
uniform float u_mpp;
uniform vec2 u_viewport;
out vec4 v_color;
void main(){
 float sx=u_viewport.x*.5+(a_pos.x-u_center.x)/u_mpp*${dpr.toFixed(3)};
 float sy=u_viewport.y*.5+(a_pos.y-u_center.y)/u_mpp*${dpr.toFixed(3)};
 gl_Position=vec4(sx/u_viewport.x*2.0-1.0,1.0-sy/u_viewport.y*2.0,0,1);
 gl_PointSize=11.0*${dpr.toFixed(3)};
 v_color=a_color;
}`;
const pointFS=`#version 300 es
precision mediump float;
in vec4 v_color;
out vec4 outColor;
void main(){vec2 p=gl_PointCoord*2.0-1.0;float d=dot(p,p);if(d>1.0)discard;float e=smoothstep(1.0,.78,d);outColor=vec4(mix(vec3(.02,.025,.03),v_color.rgb,e),1.0);}`;
function makeShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function makeProgram(vs,fs){const p=gl.createProgram();gl.attachShader(p,makeShader(gl.VERTEX_SHADER,vs));gl.attachShader(p,makeShader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
const roadProgram=makeProgram(roadVS,flatFS),pointProgram=makeProgram(pointVS,pointFS);
const roadBuffer=gl.createBuffer();
const roadVAO=gl.createVertexArray();
gl.bindVertexArray(roadVAO);gl.bindBuffer(gl.ARRAY_BUFFER,roadBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
const pointPosBuffer=gl.createBuffer(),pointColorBuffer=gl.createBuffer();
const pointVAO=gl.createVertexArray();
gl.bindVertexArray(pointVAO);gl.bindBuffer(gl.ARRAY_BUFFER,pointPosBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,pointColorBuffer);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function addBounds(x,z){bounds.minX=Math.min(bounds.minX,x);bounds.maxX=Math.max(bounds.maxX,x);bounds.minZ=Math.min(bounds.minZ,z);bounds.maxZ=Math.max(bounds.maxZ,z);}
function resetBounds(){bounds.minX=Infinity;bounds.maxX=-Infinity;bounds.minZ=Infinity;bounds.maxZ=-Infinity;}
function resize(){const w=Math.max(1,Math.floor(innerWidth*dpr)),h=Math.max(1,Math.floor(innerHeight*dpr));glCanvas.width=w;glCanvas.height=h;labelCanvas.width=w;labelCanvas.height=h;glCanvas.style.width=innerWidth+'px';glCanvas.style.height=innerHeight+'px';labelCanvas.style.width=innerWidth+'px';labelCanvas.style.height=innerHeight+'px';labelCtx.setTransform(dpr,0,0,dpr,0,0);dirty=true;requestFrame();}
addEventListener('resize',resize);resize();
function buildRoadMesh(segments,width){const out=[];const hw=width*.5;for(let i=0;i<segments.length;i+=4){const ax=segments[i],az=segments[i+1],bx=segments[i+2],bz=segments[i+3];let dx=bx-ax,dz=bz-az,len=Math.hypot(dx,dz);if(!(len>1e-6))continue;dx/=len;dz/=len;const px=-dz*hw,pz=dx*hw;const x1=ax+px,z1=az+pz,x2=ax-px,z2=az-pz,x3=bx-px,z3=bz-pz,x4=bx+px,z4=bz+pz;out.push(x1,z1,x2,z2,x3,z3,x1,z1,x3,z3,x4,z4); }return new Float32Array(out);}
function parseLine(coords,segments){if(!Array.isArray(coords)||coords.length<2)return;for(let i=1;i<coords.length;i++){const a=coords[i-1],b=coords[i];if(!Array.isArray(a)||!Array.isArray(b)||a.length<2||b.length<2)continue;const ax=Number(a[0]),az=Number(a[1]),bx=Number(b[0]),bz=Number(b[1]);if(!Number.isFinite(ax)||!Number.isFinite(az)||!Number.isFinite(bx)||!Number.isFinite(bz))continue;segments.push(ax,az,bx,bz);addBounds(ax,az);addBounds(bx,bz);}}
function loadRoads(){status.textContent='Map Editor 2 · loading roads…';fetch('../GeoJson/roads.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(geo=>{resetBounds();const seg=[];for(const f of (geo.features||[])){const g=f&&f.geometry;if(!g)continue;if(g.type==='LineString')parseLine(g.coordinates,seg);else if(g.type==='MultiLineString')for(const l of (g.coordinates||[]))parseLine(l,seg);}roadsCount=seg.length/4;roadCasing=buildRoadMesh(seg,55);roadInner=buildRoadMesh(seg,31);roadsVertices=roadInner.length/2;gl.bindBuffer(gl.ARRAY_BUFFER,roadBuffer);gl.bufferData(gl.ARRAY_BUFFER,roadCasing,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,null);fitRoads();status.textContent='Map Editor 2 · roads '+roadsCount.toLocaleString()+' · full fit';dirty=true;requestFrame();}).catch(err=>{status.textContent='Road load failed: '+err.message;console.error(err);});}
function fitRoads(){if(!Number.isFinite(bounds.minX))return;const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);camera.x=(bounds.minX+bounds.maxX)*.5;camera.z=(bounds.minZ+bounds.maxZ)*.5;const dx=Math.max(1,bounds.maxX-bounds.minX),dz=Math.max(1,bounds.maxZ-bounds.minZ);camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(w*.88),dz/(h*.88))));dirty=true;requestFrame();}
function screenToWorld(px,py){return{x:camera.x+(px-innerWidth*.5)*camera.mpp,z:camera.z+(py-innerHeight*.5)*camera.mpp};}
function requestFrame(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render();});}
function drawRoads(){if(!roadsCount)return;gl.bindVertexArray(roadVAO);gl.useProgram(roadProgram);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_center'),camera.x,camera.z);gl.uniform1f(gl.getUniformLocation(roadProgram,'u_mpp'),camera.mpp);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_viewport'),glCanvas.width,glCanvas.height);const color=gl.getUniformLocation(roadProgram,'u_color');const width=gl.getUniformLocation(roadProgram,'u_widthWorld');gl.bindBuffer(gl.ARRAY_BUFFER,roadBuffer);gl.bufferData(gl.ARRAY_BUFFER,roadCasing,gl.STATIC_DRAW);gl.uniform1f(width,1);gl.uniform4f(color,.055,.065,.08,1);gl.drawArrays(gl.TRIANGLES,0,roadCasing.length/2);gl.bufferData(gl.ARRAY_BUFFER,roadInner,gl.STATIC_DRAW);gl.uniform4f(color,.42,.46,.52,1);gl.drawArrays(gl.TRIANGLES,0,roadInner.length/2);gl.bindBuffer(gl.ARRAY_BUFFER,null);gl.bindVertexArray(null);}
function drawPoints(){if(!pointsCount)return;gl.bindVertexArray(pointVAO);gl.useProgram(pointProgram);gl.uniform2f(gl.getUniformLocation(pointProgram,'u_center'),camera.x,camera.z);gl.uniform1f(gl.getUniformLocation(pointProgram,'u_mpp'),camera.mpp);gl.uniform2f(gl.getUniformLocation(pointProgram,'u_viewport'),glCanvas.width,glCanvas.height);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.POINTS,0,pointsCount);gl.disable(gl.BLEND);gl.bindVertexArray(null);}
function drawLabels(){const w=innerWidth,h=innerHeight;labelCtx.clearRect(0,0,w,h);labelCtx.font='12px Segoe UI, Arial, sans-serif';labelCtx.textAlign='center';labelCtx.textBaseline='bottom';labelCtx.lineJoin='round';labelCtx.lineWidth=3;labelCtx.strokeStyle='rgba(0,0,0,.94)';labelCtx.fillStyle='#e0e4ea';for(const p of pointsLabel){const sx=w*.5+(p.x-camera.x)/camera.mpp,sy=h*.5+(p.z-camera.z)/camera.mpp;if(sx<-40||sx>w+40||sy<-30||sy>h+30)continue;labelCtx.strokeText(p.name,sx,sy-9);labelCtx.fillText(p.name,sx,sy-9);}}
function render(){if(!dirty)return;dirty=false;gl.viewport(0,0,glCanvas.width,glCanvas.height);gl.clearColor(15/255,18/255,23/255,1);gl.clear(gl.COLOR_BUFFER_BIT);drawRoads();drawPoints();drawLabels();}
glCanvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;lastX=e.clientX;lastY=e.clientY;glCanvas.setPointerCapture(e.pointerId);glCanvas.style.cursor='grabbing';});
glCanvas.addEventListener('pointermove',e=>{if(!dragging)return;camera.x-=(e.clientX-lastX)*camera.mpp;camera.z-=(e.clientY-lastY)*camera.mpp;lastX=e.clientX;lastY=e.clientY;dirty=true;requestFrame();});
function stopDrag(e){if(!dragging)return;dragging=false;try{glCanvas.releasePointerCapture(e.pointerId);}catch{}glCanvas.style.cursor='grab';}
glCanvas.addEventListener('pointerup',stopDrag);glCanvas.addEventListener('pointercancel',stopDrag);glCanvas.style.cursor='grab';
glCanvas.addEventListener('wheel',e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY);const factor=Math.pow(1.13,e.deltaY/100);camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,camera.mpp*factor));const after=screenToWorld(e.clientX,e.clientY);camera.x+=before.x-after.x;camera.z+=before.z-after.z;dirty=true;requestFrame();},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Home')fitRoads();});
window.MapEditor2SetTargets=function(items){const safe=Array.isArray(items)?items:[],pos=[],col=[],labels=[];for(const item of safe){const x=Number(item&&item.x),z=Number(item&&item.z);if(!Number.isFinite(x)||!Number.isFinite(z))continue;pos.push(x,z);const c=parseColor(item&&item.color);col.push(c[0],c[1],c[2],1);labels.push({x,z,name:String(item&&item.name||item&&item.id||'')});}pointsCount=pos.length/2;pointsLabel=labels;gl.bindBuffer(gl.ARRAY_BUFFER,pointPosBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,pointColorBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,null);dirty=true;requestFrame();};
function parseColor(s){if(typeof s!=='string'||!s)return[.65,.65,.65];let t=s.trim().toLowerCase();const named={red:[1,.2,.2],green:[.35,.9,.4],blue:[.3,.6,1],yellow:[1,.9,.2],orange:[1,.55,.2],gray:[.65,.65,.65],grey:[.65,.65,.65],white:[.95,.95,.95]};if(named[t])return named[t];if(t[0]==='#')t=t.slice(1);if(/^[0-9a-f]{6}$/.test(t))return[parseInt(t.slice(0,2),16)/255,parseInt(t.slice(2,4),16)/255,parseInt(t.slice(4,6),16)/255];if(/^[0-9a-f]{3}$/.test(t))return[parseInt(t[0]+t[0],16)/255,parseInt(t[1]+t[1],16)/255,parseInt(t[2]+t[2],16)/255];return[.65,.65,.65];}
loadRoads();
window.chrome?.webview?.postMessage?.('map2-ready');
})();
</script>
</body>
</html>
