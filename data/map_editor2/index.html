<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ETS2 Map Editor 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap');
:root{--top:40px;--footer:26px;--status:30px;--left:290px;--right:330px;--panel:#171c23;--line:rgba(150,165,185,.2);--font-scale:1.15;--point-label-size:11px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1217;color:#e7ebf0;font:calc(12px*var(--font-scale)) "Segoe UI",Arial,sans-serif}body{user-select:none}
#app{width:100%;height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--footer)}
#topMenu{display:flex;align-items:center;gap:18px;padding:0 14px;background:#151a21;border-bottom:1px solid var(--line);position:relative}.brand{font-weight:700;font-size:calc(13px*var(--font-scale));margin-right:8px}.menuItem{color:#b8c0cb;cursor:pointer;padding:5px 2px}.menuItem:hover{color:#fff}.menuPopup{position:absolute;top:35px;left:92px;display:none;min-width:180px;background:#202732;border:1px solid rgba(180,195,215,.22);border-radius:4px;box-shadow:0 10px 22px rgba(0,0,0,.35);z-index:20;padding:4px}.menuPopup.open{display:block}.menuBtn{display:block;width:100%;border:0;background:transparent;color:#b8c0cb;text-align:left;padding:7px 9px;font-size:calc(11px*var(--font-scale));cursor:pointer;border-radius:3px}.menuBtn:hover{background:#2b3440;color:#fff}
#workspace{min-height:0;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right)}#leftPane,#rightPane{min-width:0;min-height:0;background:var(--panel);display:grid}#leftPane{grid-template-rows:auto 1fr;border-right:1px solid var(--line)}#rightPane{grid-template-rows:auto 36px 1fr;border-left:1px solid var(--line)}
#pointTools{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:5px 6px;background:#151a21;border-bottom:1px solid var(--line)}.tool{border:1px solid rgba(150,165,185,.18);background:#202732;color:#b8c0cb;border-radius:3px;padding:5px 7px;font-size:calc(10px*var(--font-scale));cursor:pointer}.tool:hover{background:#293240;color:#fff}.tool.active{background:#334052;border-color:rgba(170,190,215,.4)}
#categoryList{overflow:auto;padding:5px}.category{border:1px solid rgba(150,165,185,.14);border-radius:4px;background:#1a2028;margin-bottom:3px;overflow:hidden;height:auto;margin:0px}.categoryHead{width:100%;display:flex;align-items:center;gap:4px;/*padding:5px 6px;*/background:var(--catbg,#27303a);color:#b8c0cb;border:1px;text-align:left;cursor:pointer;font:600 calc(11px*var(--font-scale)) "Segoe UI",Arial,sans-serif;text-shadow:-0.5px 0.5px 2px rgba(0, 0, 0, 1), 0.5px -0.5px 2px rgba(0, 0, 0, 1), -1px 1.3px 1px rgba(0, 0, 0, 1);}.categoryHead:hover{filter:brightness(1.12)}.caret{width:9px;color:#9ca7b5}.catCheck,.pointCheck{accent-color:#b7ff46}.catName{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catCount{color:#b8c0cb;font-weight:400;font-size:calc(9px*var(--font-scale));margin-left:2px;text-shadow:0 0 4px rgba(0,0,0,.9)}.eye{width:24px;height:22px;border:0;background:transparent;color:#b8c0cb;cursor:pointer;border-radius:3px;font-size:calc(13px*var(--font-scale));padding:0;text-shadow:0 0 5px #000}.eye.off{opacity:.35}.categoryBody{display:none;padding:3px;border-top:1px solid rgba(255,255,255,.1)}.category.open .categoryBody{display:block}
.pointButton{display:flex;align-items:center;gap:5px;width:100%;border:0;background:#20262f;color:#b8c0cb;border-radius:3px;padding:4px 6px;margin:0 0 2px;text-align:left;cursor:pointer;font:calc(11px*var(--font-scale)) "Segoe UI",Arial,sans-serif}.pointButton:hover{background:#29313d}.pointButton.selected{background:#2b3542}.pointCheck{display:none}.pointButton.multi .pointCheck,.category.multi .catCheck{display:block}.pointName{display:block;font-weight:600;color:#b8c0cb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pointButton.selected .pointName{color:#fff}.loading,.empty{padding:7px;color:#8995a4;font-size:calc(9px*var(--font-scale))}
#mapPane{position:relative;min-width:0;min-height:0;background:#0f1217;display:grid;grid-template-rows:minmax(0,1fr) var(--status)}#map{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0f1217;touch-action:none}canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#roads{z-index:1;pointer-events:none}#grid{z-index:2;pointer-events:none}#labels{z-index:3;pointer-events:none}#interaction{position:absolute;inset:0;z-index:4;background:transparent;cursor:default}
#status{display:flex;align-items:center;gap:0;padding:0 8px;background:#151a21;border-top:1px solid var(--line);color:#b8c0cb;font-size:calc(10px*var(--font-scale));white-space:nowrap}.statusToggle{display:flex;align-items:center;gap:6px;cursor:pointer}.statusToggle input{width:15px;height:15px}.statusToggle+.statusToggle{margin-left:14px}#cursorInfo{margin-left:auto;overflow:hidden;text-overflow:ellipsis;color:#d2d8e0;font-variant-numeric:tabular-nums}
#mapInfo{position:absolute;right:8px;bottom:6px;z-index:5;pointer-events:none;text-align:right;color:#b8c0cb;text-shadow:0 1px 3px #000;background:rgba(10,13,17,.48);padding:4px 7px;border-radius:3px;font-size:calc(9px*var(--font-scale));white-space:nowrap}
#tooltip{position:absolute;display:none;z-index:50;pointer-events:none;max-width:320px;padding:6px 8px;border:1px solid rgba(180,195,215,.28);border-radius:4px;background:rgba(18,23,30,.96);box-shadow:0 4px 14px rgba(0,0,0,.55);color:#d7dde5;font:12px "Segoe UI",Arial,sans-serif;line-height:1.35}
#rightTitle{display:flex;align-items:center;padding:0 10px;background:#151a21;border-bottom:1px solid var(--line);font-weight:600;font-size:calc(11px*var(--font-scale));color:#b8c0cb}#rightBody{min-height:0;overflow-y:auto;overflow-x:hidden}.editPanel{padding:8px 9px 12px}.editToolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.editBtn{border:1px solid rgba(150,165,185,.22);background:#202732;color:#b8c0cb;border-radius:3px;padding:5px 7px;font-size:calc(10px*var(--font-scale));cursor:pointer}.editBtn:hover{background:#2b3440;color:#fff}.editBtn.primary{border-color:rgba(170,220,120,.35)}.editGroup{border:1px solid rgba(150,165,185,.13);border-radius:4px;margin:0 0 7px;background:#1a2028;overflow:hidden}.editGroupTitle{padding:5px 7px;background:#202732;color:#b8c0cb;font-weight:600;font-size:calc(10px*var(--font-scale));text-shadow:0 0 4px rgba(0,0,0,.9)}.editRow{padding:6px 7px;border-top:1px solid rgba(255,255,255,.06)}.editLabel{display:block;margin-bottom:3px;color:#8995a4;font-size:calc(9px*var(--font-scale))}.editRequired{color:#d9b36c}.editInput,.editSelect,.editText{width:100%;border:1px solid rgba(150,165,185,.18);background:#202732;color:#e5e9ee;border-radius:3px;padding:5px 6px;font:calc(10px*var(--font-scale)) "Segoe UI",Arial,sans-serif}.editText{min-height:62px;resize:vertical}.editInput:focus,.editSelect:focus,.editText:focus{outline:1px solid rgba(180,205,235,.45)}.editCheck{display:flex;align-items:center;gap:7px;color:#b8c0cb}.editCheck input{accent-color:#b7ff46}.editHint{padding:8px;color:#85909e;line-height:1.45}.editDirty{background:#78400d}.editMeta{padding:6px 7px;color:#6f7b89;font-size:calc(8.5px*var(--font-scale))}
/* Секция «Сохранение точек» (overrides) в правом сайдбаре */
#savePanel{border-bottom:1px solid var(--line);background:#171c23;overflow-x:hidden}.savePanelTitle{display:flex;align-items:center;padding:5px 10px;background:#151a21;font-weight:600;font-size:calc(10px*var(--font-scale));color:#b8c0cb}.savePanelBody{padding:6px 8px 8px;display:flex;flex-direction:column;gap:5px}.saveFileRow{display:flex;align-items:center;gap:4px}.saveFileSel{flex:1;min-width:0;border:1px solid rgba(150,165,185,.18);background:#202732;color:#e5e9ee;border-radius:3px;padding:4px 5px;font:calc(10px*var(--font-scale)) "Segoe UI",Arial,sans-serif}.savePosInput{width:44px;border:1px solid rgba(150,165,185,.18);background:#202732;color:#e5e9ee;border-radius:3px;padding:4px 5px;font:calc(10px*var(--font-scale)) "Segoe UI",Arial,sans-serif;text-align:center}.saveBtn{border:1px solid rgba(150,165,185,.22);background:#202732;color:#b8c0cb;border-radius:3px;padding:4px 8px;font-size:calc(10px*var(--font-scale));cursor:pointer}.saveBtn:hover{background:#2b3440;color:#fff}.saveRow{display:flex;gap:4px}.saveRow .saveBtn{flex:1}.saveStatus{color:#6f7b89;font-size:calc(9px*var(--font-scale));min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saveStatus.ok{color:#8fe36f}.saveStatus.err{color:#ff8f7a}
/* Подсветка override-полей: обводка инпута + имя файла справа от label */
.editLabel .ovrFile{color:#4787d1;font-weight:400;font-size:calc(8.5px*var(--font-scale));margin-left:4px}tr.ovrRow>td,td.ovrField{border:1px solid #4787d1}.editRow.ovrRow{border:1px solid #4787d1;border-radius:3px}.editInput.ovrInput,.editText.ovrInput,.editCheck.ovrInput input{border:1px solid #4787d1;outline:1px solid rgba(71,135,209,.35)}
#footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#12171d;border-top:1px solid var(--line);color:#7f8a98;font-size:calc(9px*var(--font-scale))}
</style>
</head>
<body><div id="app">
<div id="topMenu"><div class="brand">Редактор карты 2</div><div class="menuItem" data-menu="file">Файл</div><div class="menuItem" data-menu="view">Вид</div><div class="menuItem" data-menu="points">Точки</div><div class="menuItem" data-menu="service">Сервис</div><div class="menuItem" data-menu="tools">Инструменты</div><div id="viewPopup" class="menuPopup"><button class="menuBtn" id="fontPlus">Шрифт+</button><button class="menuBtn" id="fontMinus">Шрифт-</button></div><div id="toolsPopup" class="menuPopup"><button class="menuBtn" id="generateTerrain">Генерировать карту высот</button></div></div>
<div id="workspace"><aside id="leftPane"><div id="pointTools"><button class="tool" id="showAllBtn">Показать все</button><button class="tool" id="hideAllBtn">Скрыть все</button><button class="tool" id="invertBtn">Инверсия</button><button class="tool" id="resetBtn">Сброс</button><button class="tool active" data-tool="select">Выбор</button><button class="tool" data-tool="add">Добавить</button><button class="tool" data-tool="delete">Удалить</button><button class="tool" id="fitBtn">Fit</button></div><div id="categoryList"><div class="loading">Загрузка категорий…</div></div></aside>
<section id="mapPane"><div id="map"><canvas id="roads"></canvas><canvas id="grid"></canvas><canvas id="labels"></canvas><div id="interaction"></div><div id="tooltip"></div><div id="mapInfo"></div></div><div id="status"><label class="statusToggle"><input id="onlySelectedChk" type="checkbox">только выделенные<span id="selectedCount"></span></label><label class="statusToggle"><input id="showNamesChk" type="checkbox" checked>названия</label><label class="statusToggle"><input id="showCitiesChk" type="checkbox" checked>города</label><span id="cursorInfo">X=— Y=— Z=—</span><span id="editorRunning" style="display:none;color:lime;margin-left:12px;font-weight:600">Редактор запущен</span></div></section>
<aside id="rightPane"><div id="savePanel"><div class="savePanelTitle">Сохранение точек</div><div class="savePanelBody"><div class="saveFileRow"><select id="saveFileSel" class="saveFileSel"></select><input id="savePosInput" class="savePosInput" type="number" min="0" step="1" value="0" title="Позиция файла в load_order (0 = файл исключён из load_order)"><button id="savePosBtn" class="saveBtn" title="Применить позицию файла">&#9664;</button><button id="saveFolderBtn" class="saveBtn" title="Открыть папку overrides">Папка</button></div><div class="saveRow"><button id="savePointBtn" class="saveBtn" title="Сохранить грязные поля текущей точки в выбранный файл">Сохранить</button></div><div id="saveStatus" class="saveStatus"></div></div></div><div id="rightTitle">Редактирование точки</div><div id="rightBody"><div class="editHint">Выберите точку в левом сайдбаре или на карте.</div></div></aside></div>
<footer id="footer"><div><span>ETS2 Assist</span><span style="margin-left:14px">Map Editor 2</span></div><span>Canvas</span></footer></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),map=$("map"),interaction=$("interaction"),roads=$("roads"),grid=$("grid"),labels=$("labels"),roadsCtx=roads.getContext('2d'),gridCtx=grid.getContext('2d'),labelCtx=labels.getContext('2d'),categoryList=$("categoryList"),rightBody=$("rightBody"),mapInfo=$("mapInfo"),tooltip=$("tooltip"),onlySelectedChk=$("onlySelectedChk"),showNamesChk=$("showNamesChk"),showCitiesChk=$("showCitiesChk"),selectedCount=$("selectedCount"),cursorInfo=$("cursorInfo");
const dpr=Math.min(devicePixelRatio||1,1.5),camera={x:0,z:0,mpp:100},limits={minMpp:.02,maxMpp:10000};
const state={roads:[],externalPoints:[],allPoints:[],categories:[],staticFiles:[],meta:{},selectedIds:new Set(),selectedPoint:null,multi:false,onlySelected:false,showNames:true,showCities:true,fontScale:1.15,gridStep:100,activeTool:'select',renderQueued:false,createMarker:null,lastCursor:null,ovrFiles:[],selectedOvrFile:'',ovrMap:new Map(),dirtyKeys:new Set()};
const FIELD_DEFS=[
['Основное','GameName','Системное имя (id)','string',true],['Основное','RealName','Отображаемое имя','string',true],['Основное','Description','Описание','text',false],['Основное','Category','Категория','string',false],['Основное','Enabled','Статус: включена','bool',false],
['Координаты','X','Координата X','number',true],['Координаты','Y','Координата Y','number',true],['Координаты','Z','Координата Z','number',true],
['Внешний вид','Color','Цвет (#rrggbb)','string',false],['Внешний вид','Icon','Иконка','string',false],['Внешний вид','LabelStroke','Толщина обводки названия (px)','number',false],
['Триггер','TriggerRadius','Радиус триггера (м)','number',false],['Триггер','CooldownMinutes','Кулдаун (мин, 0=нет)','int',false],['Триггер','Hidden','Скрытая (1/0)','int',false],['Триггер','DeleteOnComplete','Удалить при выполнении (0/1/2)','int',false],
['Диалог','DialogId','Диалог (id)','string',false],['Диалог','Action','Действие','string',false],['Диалог','Caption','Подпись','string',false],['Диалог','EnterReward','Награда при входе (р)','int',false],['Диалог','AfterReward','Награда после (р)','int',false],['Диалог','EnterXp','Опыт при входе','int',false],['Диалог','AfterXp','Опыт после','int',false]
];
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function size(){return{w:Math.max(1,map.clientWidth),h:Math.max(1,map.clientHeight)}}
function setupCanvas(c,ctx){const s=size();c.width=Math.floor(s.w*dpr);c.height=Math.floor(s.h*dpr);c.style.width=s.w+'px';c.style.height=s.h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function requestRender(){if(state.renderQueued)return;state.renderQueued=true;requestAnimationFrame(()=>{state.renderQueued=false;render()})}
function resize(){for(const [c,ctx] of [[roads,roadsCtx],[grid,gridCtx],[labels,labelCtx]])setupCanvas(c,ctx);requestRender()}addEventListener('resize',resize);
function addBounds(b,x,z){b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minZ=Math.min(b.minZ,z);b.maxZ=Math.max(b.maxZ,z)}
function fitPoints(){const pts=state.allPoints.filter(isPointVisible);if(!pts.length)return;let b={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};for(const p of pts)addBounds(b,p.x,p.z);if(!Number.isFinite(b.minX))return;const s=size(),dx=Math.max(50,b.maxX-b.minX),dz=Math.max(50,b.maxZ-b.minZ);camera.x=(b.minX+b.maxX)/2;camera.z=(b.minZ+b.maxZ)/2;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.78),dz/(s.h*.78))));requestRender()}
function fitSelection(){const pts=state.allPoints.filter(p=>isSelected(p));if(!pts.length)return;let b={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};for(const p of pts)addBounds(b,p.x,p.z);const s=size(),dx=Math.max(50,b.maxX-b.minX),dz=Math.max(50,b.maxZ-b.minZ);camera.x=(b.minX+b.maxX)/2;camera.z=(b.minZ+b.maxZ)/2;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.72),dz/(s.h*.72))));requestRender()}
function niceStep(target){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,target)))),n=target/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p}
function worldToScreen(p){const s=size();return{x:s.w/2+(p.x-camera.x)/camera.mpp,y:s.h/2+(p.z-camera.z)/camera.mpp}}
function screenToWorld(x,y){const s=size();return{x:camera.x+(x-s.w/2)*camera.mpp,z:camera.z+(y-s.h/2)*camera.mpp}}
function parseColor(s){if(typeof s!=='string'||!s)return[.65,.65,.65];let t=s.trim().toLowerCase();const n={red:[1,.2,.2],green:[.35,.9,.4],blue:[.3,.6,1],yellow:[1,.9,.2],orange:[1,.55,.2],gray:[.65,.65,.65],grey:[.65,.65,.65],white:[.95,.95,.95]};if(n[t])return n[t];if(t[0]==='#')t=t.slice(1);if(/^[0-9a-f]{6}$/.test(t))return[parseInt(t.slice(0,2),16)/255,parseInt(t.slice(2,4),16)/255,parseInt(t.slice(4,6),16)/255];if(/^[0-9a-f]{3}$/.test(t))return[parseInt(t[0]+t[0],16)/255,parseInt(t[1]+t[1],16)/255,parseInt(t[2]+t[2],16)/255];return[.65,.65,.65]}
function isSelected(p){return state.selectedIds.has(p.id)||(state.selectedPoint&&state.selectedPoint.id===p.id)}
function categoryVisible(key){const c=state.categories.find(x=>x.key===key);return c?c.visible!==false:true}
function isPointVisible(p){if(isSelected(p))return true;if(p.isCity)return state.showCities;return!state.onlySelected&&categoryVisible(p.category)}
function getVisiblePoints(){return state.allPoints.filter(isPointVisible)}
function getCandidates(data){if(Array.isArray(data))return data;for(const k of ['objects','points','items'])if(Array.isArray(data?.[k]))return data[k];if(data?.type==='FeatureCollection'&&Array.isArray(data.features))return data.features;return[]}
function categoryFromFile(path){const base=path.split('/').pop().replace(/\.json$/i,'');if(base==='meta')return null;let key=base;if(base.startsWith('model_'))key=base.slice(6);else if(base.startsWith('overlay_'))key=base.slice(8);const meta=state.meta[key]||{};return{key,label:meta.name||key,color:meta.color||'#6f7f8f',files:[],points:[],loaded:false,visible:true}}

function makeOverridePoint(gn,e){const c=parseCoords(e)||[0,0,0];const nm=String(e.realName??gn);const p={id:'ovr:'+gn,uid:gn,GameName:gn,RealName:nm,name:nm+(e.realName?'*':'*'),Category:String(e.category??'Пользовательское'),category:String(e.category??'Пользовательское'),Description:String(e.description??''),Enabled:e.enabled!=null?Boolean(e.enabled):(String(e.status??'active')!=='inactive'),X:c[0],Y:c[1],Z:c[2],x:c[0],y:c[1],z:c[2],Color:String(e.color??'#4787d1'),color:String(e.color??'#4787d1'),Icon:String(e.icon??'default'),LabelStroke:Number(e.labelStroke??1),TriggerRadius:Number(e.radius??e.triggerRadius??200),CooldownMinutes:parseInt(e.cooldown??e.cooldownMinutes??0,10)||0,Hidden:parseInt(e.hidden??0,10)||0,DeleteOnComplete:parseInt(e.delete_on_complete??0,10)||0,DialogId:String(e.dialogId??''),Action:String(e.action??''),Caption:String(e.caption??''),EnterReward:parseInt(e.enterReward??0,10)||0,AfterReward:parseInt(e.afterReward??0,10)||0,EnterXp:parseInt(e.enterXp??0,10)||0,AfterXp:parseInt(e.afterXp??0,10)||0,file:'overrides',source:'override',isOverride:true};p.__ovr={};p.__ovrFiles=e.__ovrFiles||[];for(const k of ['RealName','Category','Description','Enabled','X','Y','Z','Color','Icon','LabelStroke','TriggerRadius','CooldownMinutes','Hidden','DeleteOnComplete','DialogId','Action','Caption','EnterReward','AfterReward','EnterXp','AfterXp'])p.__ovr[k]=(e.__ovrFiles||[]).join(', ');return p}
