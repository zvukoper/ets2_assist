<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ETS2 Map Editor 2</title>
<style>
:root{--top:42px;--footer:28px;--left:290px;--right:310px;--status:24px;--panel:#171c23;--line:rgba(150,165,185,.20)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1217;color:#e7ebf0;font:12px "Segoe UI",Arial,sans-serif}body{user-select:none}
#app{width:100%;height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--footer)}
#topMenu{display:flex;align-items:center;gap:18px;padding:0 14px;background:#151a21;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:13px;margin-right:8px}.menuItem{color:#b8c0cb}
#workspace{min-height:0;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right)}
#leftPane,#rightPane{min-width:0;min-height:0;background:var(--panel);display:grid}#leftPane{grid-template-rows:40px 1fr;border-right:1px solid var(--line)}#rightPane{grid-template-rows:40px 1fr;border-left:1px solid var(--line)}
#pointTools{display:flex;align-items:center;gap:5px;padding:6px 8px;background:#151a21;border-bottom:1px solid var(--line)}
.tool{border:1px solid rgba(150,165,185,.18);background:#202732;color:#dce3eb;border-radius:4px;padding:6px 8px;font-size:11px;cursor:pointer}.tool:hover{background:#293240}.tool.active{background:#334052;border-color:rgba(170,190,215,.4)}
#categoryList{overflow:auto;padding:8px}.category{border:1px solid rgba(150,165,185,.14);border-radius:5px;background:#1a2028;margin-bottom:6px;overflow:hidden}.categoryHead{width:100%;display:flex;align-items:center;gap:7px;padding:8px 9px;background:#1d242d;color:#edf1f5;border:0;text-align:left;cursor:pointer;font:600 12px "Segoe UI",Arial,sans-serif}.categoryHead:hover{background:#242c36}.caret{width:10px;color:#9aa6b5}.catName{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catCount{color:#8e9aaa;font-weight:400;font-size:10px}.categoryBody{display:none;padding:5px;border-top:1px solid rgba(150,165,185,.10)}.category.open .categoryBody{display:block}
.pointButton{display:block;width:100%;border:1px solid rgba(150,165,185,.12);background:#20262f;color:#dce2ea;border-radius:4px;padding:7px 8px;margin:0 0 4px;text-align:left;cursor:pointer;font:10px "Segoe UI",Arial,sans-serif}.pointButton:hover{background:#29313d}.pointButton.selected{outline:1px solid rgba(190,210,235,.55);background:#2a3544}.pointName{display:block;font-weight:600;color:#f0f3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pointCoords{display:block;color:#8995a4;margin-top:2px;font-size:9px}
.loading,.empty{padding:8px;color:#8995a4;font-size:10px}
#mapPane{position:relative;min-width:0;min-height:0;background:#0f1217;display:grid;grid-template-rows:minmax(0,1fr) var(--status)}#map{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0f1217}canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#labels,#diagnostic-grid{pointer-events:none}
#status{display:flex;align-items:center;padding:0 10px;background:#151a21;border-top:1px solid var(--line);color:#a9b3c0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rightTitle{display:flex;align-items:center;padding:0 11px;background:#151a21;border-bottom:1px solid var(--line);font-weight:600}#rightBody{padding:10px;overflow:auto}.hint{color:#85909e;line-height:1.45}.field{margin:0 0 9px}.label{color:#7f8a99;font-size:10px;margin-bottom:3px}.value{color:#e8edf3;font-size:11px;word-break:break-word}
#footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#12171d;border-top:1px solid var(--line);color:#7f8a98;font-size:10px}.footerLeft{display:flex;gap:14px}
</style>
</head>
<body>
<div id="app">
  <div id="topMenu"><div class="brand">Редактор карты 2</div><div class="menuItem">Файл</div><div class="menuItem">Вид</div><div class="menuItem">Точки</div><div class="menuItem">Сервис</div></div>
  <div id="workspace">
    <aside id="leftPane"><div id="pointTools"><button class="tool active" data-tool="select">Выбор</button><button class="tool" data-tool="add">Добавить</button><button class="tool" data-tool="delete">Удалить</button><button class="tool" id="fitBtn">Fit</button></div><div id="categoryList"><div class="loading">Загрузка категорий…</div></div></aside>
    <section id="mapPane"><div id="map"><canvas id="gl"></canvas><canvas id="labels"></canvas></div><div id="status">Map Editor 2 · loading…</div></section>
    <aside id="rightPane"><div id="rightTitle">Редактирование точки</div><div id="rightBody"><div class="hint">Выберите точку в левом сайдбаре. Здесь будет размещена панель редактирования её свойств.</div></div></aside>
  </div>
  <footer id="footer"><div class="footerLeft"><span>ETS2 Assist</span><span>Map Editor 2</span></div><span>WebGL2 prototype</span></footer>
</div>
<script>
(()=>{
'use strict';
const map=document.getElementById('map'),glCanvas=document.getElementById('gl'),labelCanvas=document.getElementById('labels'),labelCtx=labelCanvas.getContext('2d'),status=document.getElementById('status'),categoryList=document.getElementById('categoryList'),rightBody=document.getElementById('rightBody');
const gl=glCanvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false});if(!gl){status.textContent='Map Editor 2 · WebGL2 unavailable';return;}
const dpr=Math.min(devicePixelRatio||1,1.5),camera={x:0,z:0,mpp:100},limits={minMpp:.02,maxMpp:10000},bounds={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};
let roadsCount=0,roadCasing=null,roadInner=null,roadCasingBufferObj=gl.createBuffer(),roadInnerBufferObj=gl.createBuffer(),allPoints=[],externalPoints=[],selectedPoint=null,dragging=false,lastX=0,lastY=0,dirty=true,raf=0,activeTool='select';let staticFiles=[],metaCategories={},categories=[],loadedPointFileCount=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roadVS=`#version 300 es\nprecision highp float;layout(location=0) in vec2 a_pos;uniform vec2 u_center;uniform float u_mpp;uniform vec2 u_viewport;void main(){float sx=u_viewport.x*.5+(a_pos.x-u_center.x)/u_mpp*${dpr.toFixed(3)};float sy=u_viewport.y*.5+(a_pos.y-u_center.y)/u_mpp*${dpr.toFixed(3)};gl_Position=vec4(sx/u_viewport.x*2.-1.,1.-sy/u_viewport.y*2.,0,1);}`;
const flatFS=`#version 300 es\nprecision mediump float;uniform vec4 u_color;out vec4 outColor;void main(){outColor=u_color;}`;
const pointVS=`#version 300 es\nprecision highp float;layout(location=0) in vec2 a_pos;layout(location=1) in vec4 a_color;uniform vec2 u_center;uniform float u_mpp;uniform vec2 u_viewport;out vec4 v_color;void main(){float sx=u_viewport.x*.5+(a_pos.x-u_center.x)/u_mpp*${dpr.toFixed(3)};float sy=u_viewport.y*.5+(a_pos.y-u_center.y)/u_mpp*${dpr.toFixed(3)};gl_Position=vec4(sx/u_viewport.x*2.-1.,1.-sy/u_viewport.y*2.,0,1);gl_PointSize=12.*${dpr.toFixed(3)};v_color=a_color;}`;
const pointFS=`#version 300 es\nprecision mediump float;in vec4 v_color;out vec4 outColor;void main(){vec2 p=gl_PointCoord*2.-1.;float d=dot(p,p);if(d>1.)discard;float e=smoothstep(1.,.72,d);outColor=vec4(mix(vec3(.02,.025,.03),v_color.rgb,e),1.);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const roadProgram=prog(roadVS,flatFS),pointProgram=prog(pointVS,pointFS),roadVAO=gl.createVertexArray(),pointVAO=gl.createVertexArray(),pointPosBuffer=gl.createBuffer(),pointColorBuffer=gl.createBuffer();gl.bindVertexArray(roadVAO);gl.bindBuffer(gl.ARRAY_BUFFER,roadCasingBufferObj);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindVertexArray(null);gl.bindVertexArray(pointVAO);gl.bindBuffer(gl.ARRAY_BUFFER,pointPosBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,pointColorBuffer);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function mapSize(){return{w:Math.max(1,map.clientWidth),h:Math.max(1,map.clientHeight)}}function resize(){const s=mapSize(),w=Math.floor(s.w*dpr),h=Math.floor(s.h*dpr);glCanvas.width=w;glCanvas.height=h;labelCanvas.width=w;labelCanvas.height=h;labelCanvas.style.width=s.w+'px';labelCanvas.style.height=s.h+'px';glCanvas.style.width=s.w+'px';glCanvas.style.height=s.h+'px';labelCtx.setTransform(dpr,0,0,dpr,0,0);dirty=true;requestFrame()}addEventListener('resize',resize);resize();
function resetBounds(){bounds.minX=Infinity;bounds.maxX=-Infinity;bounds.minZ=Infinity;bounds.maxZ=-Infinity}function addBounds(x,z){if(x<bounds.minX)bounds.minX=x;if(x>bounds.maxX)bounds.maxX=x;if(z<bounds.minZ)bounds.minZ=z;if(z>bounds.maxZ)bounds.maxZ=z}
function pushLine(coords,seg){if(!Array.isArray(coords)||coords.length<2)return;for(let i=1;i<coords.length;i++){const a=coords[i-1],b=coords[i];if(!Array.isArray(a)||!Array.isArray(b)||a.length<2||b.length<2)continue;const ax=Number(a[0]),az=Number(a[1]),bx=Number(b[0]),bz=Number(b[1]);if(!Number.isFinite(ax)||!Number.isFinite(az)||!Number.isFinite(bx)||!Number.isFinite(bz))continue;seg.push(ax,az,bx,bz);addBounds(ax,az);addBounds(bx,bz)}}
function buildMesh(seg,width){const out=[],hw=width*.5;for(let i=0;i<seg.length;i+=4){const ax=seg[i],az=seg[i+1],bx=seg[i+2],bz=seg[i+3],dx0=bx-ax,dz0=bz-az,len=Math.hypot(dx0,dz0);if(len<1e-6)continue;const dx=dx0/len,dz=dz0/len,px=-dz*hw,pz=dx*hw,x1=ax+px,z1=az+pz,x2=ax-px,z2=az-pz,x3=bx-px,z3=bz-pz,x4=bx+px,z4=bz+pz;out.push(x1,z1,x2,z2,x3,z3,x1,z1,x3,z3,x4,z4)}return new Float32Array(out)}
function fitRoads(){if(!Number.isFinite(bounds.minX))return;const s=mapSize(),dx=Math.max(1,bounds.maxX-bounds.minX),dz=Math.max(1,bounds.maxZ-bounds.minZ);camera.x=(bounds.minX+bounds.maxX)*.5;camera.z=(bounds.minZ+bounds.maxZ)*.5;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.82),dz/(s.h*.82))));dirty=true;requestFrame()}
function loadRoads(){fetch('../GeoJson/roads.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(geo=>{resetBounds();const seg=[];for(const f of geo.features||[]){const g=f&&f.geometry;if(!g)continue;if(g.type==='LineString')pushLine(g.coordinates,seg);else if(g.type==='MultiLineString')for(const l of g.coordinates||[])pushLine(l,seg)}roadsCount=seg.length/4;roadCasing=buildMesh(seg,55);roadInner=buildMesh(seg,31);gl.bindBuffer(gl.ARRAY_BUFFER,roadCasingBufferObj);gl.bufferData(gl.ARRAY_BUFFER,roadCasing,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,roadInnerBufferObj);gl.bufferData(gl.ARRAY_BUFFER,roadInner,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,null);fitRoads();updateStatus()}).catch(e=>{status.textContent='Road load failed: '+e.message;console.error(e)})}
function parseColor(s){if(typeof s!=='string'||!s)return[.65,.65,.65];let t=s.trim().toLowerCase();const n={red:[1,.2,.2],green:[.35,.9,.4],blue:[.3,.6,1],yellow:[1,.9,.2],orange:[1,.55,.2],gray:[.65,.65,.65],grey:[.65,.65,.65],white:[.95,.95,.95]};if(n[t])return n[t];if(t[0]==='#')t=t.slice(1);if(/^[0-9a-f]{6}$/.test(t))return[parseInt(t.slice(0,2),16)/255,parseInt(t.slice(2,4),16)/255,parseInt(t.slice(4,6),16)/255];if(/^[0-9a-f]{3}$/.test(t))return[parseInt(t[0]+t[0],16)/255,parseInt(t[1]+t[1],16)/255,parseInt(t[2]+t[2],16)/255];return[.65,.65,.65]}
function writePoints(items){const pos=[],col=[];for(const p of items){const x=Number(p.x),z=Number(p.z);if(!Number.isFinite(x)||!Number.isFinite(z))continue;pos.push(x,z);const c=parseColor(p.color);col.push(c[0],c[1],c[2],1)}gl.bindBuffer(gl.ARRAY_BUFFER,pointPosBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,pointColorBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,null);dirty=true;requestFrame()}
function rebuildPoints(){allPoints=externalPoints.concat(categories.flatMap(c=>c.points||[]));writePoints(allPoints);updateStatus()}window.MapEditor2SetTargets=items=>{externalPoints=Array.isArray(items)?items.map((p,i)=>({...p,source:'custom',name:p.name||p.id||('Цель '+(i+1)),color:p.color||'#ffd45c'})):[];rebuildPoints()};
function getCandidates(data){if(Array.isArray(data))return data;for(const k of ['objects','points','items','features'])if(Array.isArray(data?.[k]))return data[k];return[]}
function pointFromObject(o,index,cat,file){if(!o||typeof o!=='object')return null;let x=Number(o.x),z=Number(o.z);if((!Number.isFinite(x)||!Number.isFinite(z))&&o.position){x=Number(o.position.x);z=Number(o.position.z)}if((!Number.isFinite(x)||!Number.isFinite(z))&&o.pos){x=Number(o.pos.x);z=Number(o.pos.z)}if((!Number.isFinite(x)||!Number.isFinite(z))&&o.geometry?.type==='Point'&&Array.isArray(o.geometry.coordinates)){x=Number(o.geometry.coordinates[0]);z=Number(o.geometry.coordinates[1])}if(!Number.isFinite(x)||!Number.isFinite(z))return null;const id=String(o.uid??o.id??o.name??index+1),name=String(o.realName??o.name??o.model??o.uid??(cat.label+' '+(index+1)));return{id:`${file}:${id}:${index}`,file,name,x,z,color:cat.color||'#b0b8c2',category:cat.key}}
function categoryFromFile(path){const base=path.split('/').pop().replace(/\.json$/i,'');if(base==='meta')return null;let key;if(base.startsWith('model_'))key=base.slice(6);else if(base.startsWith('overlay_'))key=base.slice(8);else if(base.startsWith('easter_'))key='Easter eggs';else key=base;const meta=metaCategories[key]||{};return{key,label:meta.name||key,color:meta.color||'#b0b8c2',files:[path],points:[],loaded:false}}
function groupFiles(){const by=new Map();for(const path of staticFiles){const c=categoryFromFile(path);if(!c)continue;let target=by.get(c.key);if(!target){target={key:c.key,label:c.label,color:c.color,files:[],points:[],loaded:false};by.set(c.key,target)}target.files.push(path)}categories=[...by.values()].sort((a,b)=>a.label.localeCompare(b.label,'ru'))}
function renderCategoryBody(cat,head,body){if(!body)return;head.querySelector('.catCount').textContent=cat.points.length.toLocaleString();body.innerHTML='';if(!cat.points.length){body.innerHTML='<div class="empty">Точек с координатами X/Z не найдено</div>';return}const frag=document.createDocumentFragment();for(const p of cat.points){const b=document.createElement('button');b.className='pointButton'+(selectedPoint&&selectedPoint.id===p.id?' selected':'');b.innerHTML=`<span class="pointName">${esc(p.name)}</span><span class="pointCoords">X ${p.x.toFixed(1)} · Z ${p.z.toFixed(1)}</span>`;b.addEventListener('click',()=>selectPoint(p,b));frag.appendChild(b)}body.appendChild(frag)}
function renderCategories(){categoryList.innerHTML='';for(const cat of categories){const el=document.createElement('div');el.className='category'+(cat.key==='wild_animals'?' open':'');const head=document.createElement('button');head.className='categoryHead';head.innerHTML=`<span class="caret">${cat.key==='wild_animals'?'▾':'▸'}</span><span class="catName">${esc(cat.label)}</span><span class="catCount">${cat.points.length?cat.points.length.toLocaleString():cat.files.length+' file'}</span>`;const body=document.createElement('div');body.className='categoryBody';body.innerHTML='<div class="loading">Загрузка…</div>';head.addEventListener('click',()=>toggleCategory(cat,el,head,body));el.append(head,body);categoryList.appendChild(el);if(cat.key==='wild_animals')loadCategory(cat,head,body)}}
async function readCategory(cat){if(cat.loaded)return;const all=[];for(const file of cat.files){try{const r=await fetch('../'+file,{cache:'no-store'});if(!r.ok)continue;const raw=getCandidates(await r.json());raw.forEach((o,i)=>{const p=pointFromObject(o,i,cat,file);if(p)all.push(p)})}catch(err){console.warn('Point file failed',file,err)}}cat.points=all;cat.loaded=true;loadedPointFileCount+=cat.files.length}
async function loadCategory(cat,head,body){if(body)body.innerHTML='<div class="loading">Загрузка…</div>';await readCategory(cat);rebuildPoints();renderCategoryBody(cat,head,body)}
async function toggleCategory(cat,el,head,body){el.classList.toggle('open');head.querySelector('.caret').textContent=el.classList.contains('open')?'▾':'▸';if(!el.classList.contains('open'))return;if(!cat.loaded)await loadCategory(cat,head,body);else renderCategoryBody(cat,head,body)}
function selectPoint(p,button){document.querySelectorAll('.pointButton.selected').forEach(x=>x.classList.remove('selected'));if(button)button.classList.add('selected');selectedPoint=p;flyTo(p.x,p.z);rightBody.innerHTML=`<div class="field"><div class="label">Категория</div><div class="value">${esc(p.category||p.source||'')}</div></div><div class="field"><div class="label">Название</div><div class="value">${esc(p.name)}</div></div><div class="field"><div class="label">X</div><div class="value">${p.x.toFixed(3)}</div></div><div class="field"><div class="label">Z</div><div class="value">${p.z.toFixed(3)}</div></div><div class="field"><div class="label">Файл</div><div class="value">${esc(p.file||'')}</div></div>`;dirty=true;requestFrame()}
function flyTo(x,z){camera.x=x;camera.z=z;camera.mpp=8;dirty=true;requestFrame()}
function drawRoadBuffer(obj,count,color){gl.bindBuffer(gl.ARRAY_BUFFER,obj);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.useProgram(roadProgram);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_center'),camera.x,camera.z);gl.uniform1f(gl.getUniformLocation(roadProgram,'u_mpp'),camera.mpp);gl.uniform2f(gl.getUniformLocation(roadProgram,'u_viewport'),glCanvas.width,glCanvas.height);gl.uniform4f(gl.getUniformLocation(roadProgram,'u_color'),color[0],color[1],color[2],1);gl.drawArrays(gl.TRIANGLES,0,count)}
function drawRoads(){if(!roadCasing||!roadInner)return;gl.bindVertexArray(roadVAO);drawRoadBuffer(roadCasingBufferObj,roadCasing.length/2,[.055,.065,.08]);drawRoadBuffer(roadInnerBufferObj,roadInner.length/2,[.46,.51,.58]);gl.bindVertexArray(null)}
function drawPoints(){if(!allPoints.length)return;gl.bindVertexArray(pointVAO);gl.useProgram(pointProgram);gl.uniform2f(gl.getUniformLocation(pointProgram,'u_center'),camera.x,camera.z);gl.uniform1f(gl.getUniformLocation(pointProgram,'u_mpp'),camera.mpp);gl.uniform2f(gl.getUniformLocation(pointProgram,'u_viewport'),glCanvas.width,glCanvas.height);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.POINTS,0,allPoints.length);gl.disable(gl.BLEND);gl.bindVertexArray(null)}
function drawSelectedLabel(){const s=mapSize();labelCtx.clearRect(0,0,s.w,s.h);if(!selectedPoint)return;const sx=s.w*.5+(selectedPoint.x-camera.x)/camera.mpp,sy=s.h*.5+(selectedPoint.z-camera.z)/camera.mpp;if(sx<-120||sx>s.w+120||sy<-40||sy>s.h+40)return;labelCtx.font='12px Segoe UI,Arial,sans-serif';labelCtx.textAlign='left';labelCtx.textBaseline='bottom';labelCtx.lineWidth=3;labelCtx.strokeStyle='rgba(0,0,0,.95)';labelCtx.fillStyle='#f1f4f7';labelCtx.strokeText(selectedPoint.name,sx+9,sy-10);labelCtx.fillText(selectedPoint.name,sx+9,sy-10)}
function render(){if(!dirty)return;dirty=false;gl.viewport(0,0,glCanvas.width,glCanvas.height);gl.clearColor(15/255,18/255,23/255,1);gl.clear(gl.COLOR_BUFFER_BIT);drawRoads();drawPoints();drawSelectedLabel()}function requestFrame(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function screenToWorld(px,py){const r=map.getBoundingClientRect();return{x:camera.x+(px-r.left-r.width*.5)*camera.mpp,z:camera.z+(py-r.top-r.height*.5)*camera.mpp}}glCanvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;lastX=e.clientX;lastY=e.clientY;glCanvas.setPointerCapture(e.pointerId);glCanvas.style.cursor='grabbing'});glCanvas.addEventListener('pointermove',e=>{if(!dragging)return;camera.x-=(e.clientX-lastX)*camera.mpp;camera.z-=(e.clientY-lastY)*camera.mpp;lastX=e.clientX;lastY=e.clientY;dirty=true;requestFrame()});function stop(e){if(!dragging)return;dragging=false;try{glCanvas.releasePointerCapture(e.pointerId)}catch{}glCanvas.style.cursor='grab'}glCanvas.addEventListener('pointerup',stop);glCanvas.addEventListener('pointercancel',stop);glCanvas.style.cursor='grab';glCanvas.addEventListener('wheel',e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),factor=Math.pow(1.13,e.deltaY/100);camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,camera.mpp*factor));const after=screenToWorld(e.clientX,e.clientY);camera.x+=before.x-after.x;camera.z+=before.z-after.z;dirty=true;requestFrame()},{passive:false});
function updateStatus(){status.textContent=`Map Editor 2 · roads ${roadsCount.toLocaleString()} · points ${allPoints.length.toLocaleString()} · files ${loadedPointFileCount.toLocaleString()} · ${activeTool}`}
