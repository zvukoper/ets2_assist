<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ETS2 Map Editor 2</title>
<style>
:root{--top:40px;--footer:26px;--status:30px;--left:290px;--right:300px;--panel:#171c23;--line:rgba(150,165,185,.2);--font-scale:1.15}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1217;color:#e7ebf0;font:calc(12px*var(--font-scale)) "Segoe UI",Arial,sans-serif}
body{user-select:none}
#app{width:100%;height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--footer)}
#topMenu{display:flex;align-items:center;gap:18px;padding:0 14px;background:#151a21;border-bottom:1px solid var(--line);position:relative}
.brand{font-weight:700;font-size:calc(13px*var(--font-scale));margin-right:8px}
.menuItem{color:#b8c0cb;cursor:pointer;padding:5px 2px}.menuItem:hover{color:#fff}
.menuPopup{position:absolute;top:35px;left:92px;display:none;min-width:170px;background:#202732;border:1px solid rgba(180,195,215,.22);border-radius:4px;box-shadow:0 10px 22px rgba(0,0,0,.35);z-index:20;padding:4px}
.menuPopup.open{display:block}.menuBtn{display:block;width:100%;border:0;background:transparent;color:#b8c0cb;text-align:left;padding:7px 9px;font-size:calc(11px*var(--font-scale));cursor:pointer;border-radius:3px}.menuBtn:hover{background:#2b3440;color:#fff}
#workspace{min-height:0;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right)}
#leftPane,#rightPane{min-width:0;min-height:0;background:var(--panel);display:grid}
#leftPane{grid-template-rows:auto 1fr;border-right:1px solid var(--line)}#rightPane{grid-template-rows:36px 1fr;border-left:1px solid var(--line)}
#pointTools{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:5px 6px;background:#151a21;border-bottom:1px solid var(--line)}
.tool{border:1px solid rgba(150,165,185,.18);background:#202732;color:#b8c0cb;border-radius:3px;padding:5px 7px;font-size:calc(10px*var(--font-scale));cursor:pointer}.tool:hover{background:#293240;color:#fff}.tool.active{background:#334052;border-color:rgba(170,190,215,.4)}
#categoryList{overflow:auto;padding:5px}.category{border:1px solid rgba(150,165,185,.14);border-radius:4px;background:#1a2028;margin-bottom:3px;overflow:hidden}
.categoryHead{width:100%;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--catbg,#27303a);color:#b8c0cb;border:0;text-align:left;cursor:pointer;font:600 calc(11px*var(--font-scale)) "Segoe UI",Arial,sans-serif;text-shadow:0 0 4px rgba(0,0,0,.9)}
.categoryHead:hover{filter:brightness(1.12)}.caret{width:9px;color:#9ca7b5}.catCheck,.pointCheck{accent-color:#b7ff46}.catName{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catCount{color:#b8c0cb;font-weight:400;font-size:calc(9px*var(--font-scale));margin-left:2px;text-shadow:0 0 4px rgba(0,0,0,.9)}
.eye{width:24px;height:22px;border:0;background:transparent;color:#b8c0cb;cursor:pointer;border-radius:3px;font-size:calc(13px*var(--font-scale));padding:0;text-shadow:0 0 5px #000}.eye.off{opacity:.35}
.categoryBody{display:none;padding:3px;border-top:1px solid rgba(255,255,255,.1)}.category.open .categoryBody{display:block}
.pointButton{display:flex;align-items:center;gap:5px;width:100%;border:0;background:#20262f;color:#b8c0cb;border-radius:3px;padding:4px 6px;margin:0 0 2px;text-align:left;cursor:pointer;font:calc(10px*var(--font-scale)) "Segoe UI",Arial,sans-serif}.pointButton:hover{background:#29313d}.pointButton.selected{background:#2b3542}.pointCheck{display:none}.pointButton.multi .pointCheck,.category.multi .catCheck{display:block}.pointName{display:block;font-weight:600;color:#b8c0cb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pointButton.selected .pointName{color:#fff}
.loading,.empty{padding:7px;color:#8995a4;font-size:calc(9px*var(--font-scale))}
#mapPane{position:relative;min-width:0;min-height:0;background:#0f1217;display:grid;grid-template-rows:minmax(0,1fr) var(--status)}
#map{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0f1217;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#terrain{z-index:0;pointer-events:none}#roads{z-index:1;pointer-events:none}#grid{z-index:2;pointer-events:none}#labels{z-index:3;pointer-events:none}
#interaction{position:absolute;inset:0;z-index:4;background:transparent;cursor:default}
#status{display:flex;align-items:center;gap:0;padding:0 8px;background:#151a21;border-top:1px solid var(--line);color:#b8c0cb;font-size:calc(10px*var(--font-scale));white-space:nowrap}
.statusToggle{display:flex;align-items:center;gap:6px;cursor:pointer}.statusToggle input{width:15px;height:15px}.statusToggle+.statusToggle{margin-left:14px}
#terrainStatus{margin-left:14px;color:#9fa9b7;font-size:calc(10px*var(--font-scale))}.terrainLink{color:#aeb8c5;text-decoration:underline;cursor:pointer}.terrainLink:hover{color:#fff}
#mapInfo{position:absolute;right:8px;bottom:6px;z-index:5;pointer-events:none;text-align:right;color:#b8c0cb;text-shadow:0 1px 3px #000;background:rgba(10,13,17,.48);padding:3px 6px;border-radius:3px;font-size:calc(9px*var(--font-scale));white-space:nowrap}
#tooltip{position:absolute;display:none;z-index:50;pointer-events:none;max-width:320px;padding:6px 8px;border:1px solid rgba(180,195,215,.28);border-radius:4px;background:rgba(18,23,30,.96);box-shadow:0 4px 14px rgba(0,0,0,.55);color:#d7dde5;font:12px "Segoe UI",Arial,sans-serif;line-height:1.35}
#rightTitle{display:flex;align-items:center;padding:0 10px;background:#151a21;border-bottom:1px solid var(--line);font-weight:600;font-size:calc(11px*var(--font-scale));color:#b8c0cb}
#rightBody{padding:9px;overflow:auto}.hint{color:#85909e;line-height:1.4}.field{margin:0 0 8px}.label{color:#7f8a99;font-size:calc(9px*var(--font-scale));margin-bottom:2px}.value{color:#b8c0cb;font-size:calc(10px*var(--font-scale));word-break:break-word}.createBtn{border:1px solid rgba(150,165,185,.24);background:#202732;color:#fff;border-radius:3px;padding:6px 9px;font-size:calc(10px*var(--font-scale));cursor:pointer}
#footer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#12171d;border-top:1px solid var(--line);color:#7f8a98;font-size:calc(9px*var(--font-scale))}
</style>
</head>
<body>
<div id="app">
<div id="topMenu"><div class="brand">Редактор карты 2</div><div class="menuItem" data-menu="file">Файл</div><div class="menuItem" data-menu="view">Вид</div><div class="menuItem" data-menu="points">Точки</div><div class="menuItem" data-menu="service">Сервис</div><div class="menuItem" data-menu="tools">Инструменты</div>
<div id="viewPopup" class="menuPopup"><button class="menuBtn" id="fontPlus">Шрифт+</button><button class="menuBtn" id="fontMinus">Шрифт-</button></div>
<div id="toolsPopup" class="menuPopup" style="left:310px"><button class="menuBtn" id="generateTerrain">Генерировать карту высот</button><button class="menuBtn" id="terrainToggle">Скрыть карту высот</button></div></div>
<div id="workspace">
<aside id="leftPane"><div id="pointTools"><button class="tool" id="showAllBtn">Показать все</button><button class="tool" id="hideAllBtn">Скрыть все</button><button class="tool" id="invertBtn">Инверсия</button><button class="tool" id="resetBtn">Сброс</button><button class="tool active" data-tool="select">Выбор</button><button class="tool" data-tool="add">Добавить</button><button class="tool" data-tool="delete">Удалить</button><button class="tool" id="fitBtn">Fit</button></div><div id="categoryList"><div class="loading">Загрузка категорий…</div></div></aside>
<section id="mapPane"><div id="map"><canvas id="terrain"></canvas><canvas id="roads"></canvas><canvas id="grid"></canvas><canvas id="labels"></canvas><div id="interaction"></div><div id="tooltip"></div><div id="mapInfo"></div></div>
<div id="status"><label class="statusToggle"><input id="onlySelectedChk" type="checkbox">только выделенные<span id="selectedCount"></span></label><label class="statusToggle"><input id="showNamesChk" type="checkbox" checked>названия</label><label class="statusToggle"><input id="showCitiesChk" type="checkbox" checked>города</label><span id="terrainStatus"></span></div></section>
<aside id="rightPane"><div id="rightTitle">Редактирование точки</div><div id="rightBody"><div class="hint">Выберите точку в левом сайдбаре или на карте.</div></div></aside>
</div>
<footer id="footer"><div><span>ETS2 Assist</span><span style="margin-left:14px">Map Editor 2</span></div><span>Canvas</span></footer>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const map=$("map"),interaction=$("interaction"),terrain=$("terrain"),roads=$("roads"),grid=$("grid"),labels=$("labels");
const terrainCtx=terrain.getContext("2d"),roadsCtx=roads.getContext("2d"),gridCtx=grid.getContext("2d"),labelCtx=labels.getContext("2d");
const categoryList=$("categoryList"),rightBody=$("rightBody"),mapInfo=$("mapInfo"),tooltip=$("tooltip"),statusTerrain=$("terrainStatus");
const onlySelectedChk=$("onlySelectedChk"),showNamesChk=$("showNamesChk"),showCitiesChk=$("showCitiesChk"),selectedCount=$("selectedCount");
const dpr=Math.min(devicePixelRatio||1,1.5),camera={x:0,z:0,mpp:100},limits={minMpp:.02,maxMpp:10000};
const state={roads:[],roadBounds:null,externalPoints:[],allPoints:[],categories:[],staticFiles:[],meta:{},selectedIds:new Set(),selectedPoint:null,multi:false,onlySelected:false,showNames:true,showCities:true,fontScale:1.15,terrainVisible:true,terrainImage:null,terrainMeta:null,gridStep:100,activeTool:"select",renderQueued:false};
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function size(){return{w:Math.max(1,map.clientWidth),h:Math.max(1,map.clientHeight)}}
function setupCanvas(c,ctx){const s=size(),w=Math.floor(s.w*dpr),h=Math.floor(s.h*dpr);c.width=w;c.height=h;c.style.width=s.w+"px";c.style.height=s.h+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
function resize(){for(const [c,ctx] of [[terrain,terrainCtx],[roads,roadsCtx],[grid,gridCtx],[labels,labelCtx]])setupCanvas(c,ctx);state.renderQueued=false;requestRender()}addEventListener("resize",resize);
function requestRender(){if(state.renderQueued)return;state.renderQueued=true;requestAnimationFrame(()=>{state.renderQueued=false;render()})}
function addBounds(b,x,z){b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minZ=Math.min(b.minZ,z);b.maxZ=Math.max(b.maxZ,z)}
function fitPoints(){const pts=state.allPoints.filter(p=>categoryVisible(p.category)&&(!p.isCity||state.showCities));if(!pts.length)return;let b={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};for(const p of pts)addBounds(b,p.x,p.z);if(!Number.isFinite(b.minX))return;const s=size(),dx=Math.max(50,b.maxX-b.minX),dz=Math.max(50,b.maxZ-b.minZ);camera.x=(b.minX+b.maxX)/2;camera.z=(b.minZ+b.maxZ)/2;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.78),dz/(s.h*.78))));requestRender()}
function fitSelection(){const pts=state.allPoints.filter(p=>state.selectedIds.has(p.id));if(!pts.length)return;let b={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};for(const p of pts)addBounds(b,p.x,p.z);const s=size(),dx=Math.max(50,b.maxX-b.minX),dz=Math.max(50,b.maxZ-b.minZ);camera.x=(b.minX+b.maxX)/2;camera.z=(b.minZ+b.maxZ)/2;camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,Math.max(dx/(s.w*.72),dz/(s.h*.72))));requestRender()}
function niceStep(target){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,target)))),n=target/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p}
function worldToScreen(p){const s=size();return{x:s.w/2+(p.x-camera.x)/camera.mpp,y:s.h/2+(p.z-camera.z)/camera.mpp}}
function screenToWorld(x,y){const s=size();return{x:camera.x+(x-s.w/2)*camera.mpp,z:camera.z+(y-s.h/2)*camera.mpp}}
function parseColor(s){if(typeof s!=="string"||!s)return[.65,.65,.65];let t=s.trim().toLowerCase();const n={red:[1,.2,.2],green:[.35,.9,.4],blue:[.3,.6,1],yellow:[1,.9,.2],orange:[1,.55,.2],gray:[.65,.65,.65],grey:[.65,.65,.65],white:[.95,.95,.95]};if(n[t])return n[t];if(t[0]==="#")t=t.slice(1);if(/^[0-9a-f]{6}$/.test(t))return[parseInt(t.slice(0,2),16)/255,parseInt(t.slice(2,4),16)/255,parseInt(t.slice(4,6),16)/255];if(/^[0-9a-f]{3}$/.test(t))return[parseInt(t[0]+t[0],16)/255,parseInt(t[1]+t[1],16)/255,parseInt(t[2]+t[2],16)/255];return[.65,.65,.65]}
function categoryVisible(key){const c=state.categories.find(x=>x.key===key);return c?c.visible!==false:true}
function getVisiblePoints(){return state.allPoints.filter(p=>categoryVisible(p.category)&&(!state.onlySelected||state.selectedIds.has(p.id)||(state.selectedPoint&&state.selectedPoint.id===p.id))&&(!p.isCity||state.showCities))}
function selected(p){return state.selectedIds.has(p.id)||(state.selectedPoint&&state.selectedPoint.id===p.id)}
function getCandidates(data){if(Array.isArray(data))return data;for(const k of ["objects","points","items"])if(Array.isArray(data?.[k]))return data[k];if(data?.type==="FeatureCollection"&&Array.isArray(data.features))return data.features;return[]}
function categoryFromFile(path){const base=path.split("/").pop().replace(/\.json$/i,"");if(base==="meta")return null;let key=base;if(base.startsWith("model_"))key=base.slice(6);else if(base.startsWith("overlay_"))key=base.slice(8);const meta=state.meta[key]||{};return{key,label:meta.name||key,color:meta.color||"#6f7f8f",files:[],points:[],loaded:false,visible:true}}
function groupCategories(){const by=new Map();for(const path of state.staticFiles){const c=categoryFromFile(path);if(!c)continue;let x=by.get(c.key);if(!x){x={...c};by.set(c.key,x)}x.files.push(path)}state.categories=[...by.values()].sort((a,b)=>a.label.localeCompare(b.label,"ru"));state.categories.unshift({key:"__cities",label:"Города",color:"#ffe600",files:[],points:[],loaded:false,visible:true});rebuildPoints();renderCategories()}
async function readCategory(cat){if(cat.loaded)return;if(cat.key==="__cities"){const r=await fetch("../localized_cities/cities_sibirmap.json",{cache:"no-store"});if(r.ok){const d=await r.json();cat.points=(Array.isArray(d?.citiesList)?d.citiesList:[]).map((o,i)=>{const x=Number(o?.x),y=Number(o?.y),z=Number(o?.z);if(!Number.isFinite(x)||!Number.isFinite(z))return null;const uid=String(o?.gameName??o?.id??o?.realName??(i+1));return{id:`city:${uid}:${i}`,uid,name:String(o?.realName??uid),x,z,y:Number.isFinite(y)?y:0,color:cat.color,category:cat.key,isCity:true}}).filter(Boolean)}cat.loaded=true;return}
const all=[];for(const file of cat.files){try{const r=await fetch("../"+file,{cache:"no-store"});if(!r.ok)continue;const data=await r.json(),raw=getCandidates(data),isEaster=Boolean(data?.easter)||file.toLowerCase().split("/").pop().startsWith("easter_");raw.forEach((o,i)=>{if(!o||typeof o!=="object")return;let x=Number(o.x),z=Number(o.z);if((!Number.isFinite(x)||!Number.isFinite(z))&&o.position){x=Number(o.position.x);z=Number(o.position.z)}if((!Number.isFinite(x)||!Number.isFinite(z))&&o.geometry?.type==="Point"&&Array.isArray(o.geometry.coordinates)){x=Number(o.geometry.coordinates[0]);z=Number(o.geometry.coordinates[1])}if(!Number.isFinite(x)||!Number.isFinite(z))return;const uid=String(o.uid??o.id??o.name??(i+1));const name=isEaster?String(o.name??uid):String(cat.label);const y=Number(o.y??o.height??o.position?.y);all.push({id:`${file}:${uid}:${i}`,uid,name,x,z,y:Number.isFinite(y)?y:0,color:cat.color,category:cat.key,file})})}catch(e){console.warn("Point file failed",file,e)}}cat.points=all;cat.loaded=true}
async function loadAllCategories(){for(const cat of state.categories)await readCategory(cat).catch(()=>{});rebuildPoints();renderCategories();fitPoints();requestRender()}
function rebuildPoints(){const fromCats=state.categories.filter(c=>c.key!=="__custom").flatMap(c=>c.points||[]),custom=state.categories.find(c=>c.key==="__custom");state.allPoints=state.externalPoints.concat(fromCats).concat(custom?.points||[])}
function renderCategoryBody(cat,body){body.innerHTML="";if(!cat.points.length){body.innerHTML='<div class="empty">Точек с координатами X/Z не найдено</div>';return}const frag=document.createDocumentFragment();for(const p of cat.points){const b=document.createElement("button");b.className="pointButton"+(selected(p)?" selected":"")+(state.multi?" multi":"");b.dataset.pointId=p.id;b.innerHTML=`<input class="pointCheck" type="checkbox" ${state.selectedIds.has(p.id)?"checked":""}><span class="pointName">${esc(p.name)}</span>`;b.querySelector(".pointCheck")?.addEventListener("click",e=>{e.stopPropagation();togglePoint(p,b.querySelector(".pointCheck").checked)});b.addEventListener("click",()=>{if(state.multi)togglePoint(p,!state.selectedIds.has(p.id));else selectPoint(p)});frag.appendChild(b)}body.appendChild(frag)}
function categoryCountText(cat){if(state.multi){const n=cat.points.filter(p=>state.selectedIds.has(p.id)).length;return n?n.toLocaleString():""}return cat.points.length.toLocaleString()}
function renderCategories(){categoryList.innerHTML="";state.categories.forEach(cat=>{const el=document.createElement("div");el.className="category"+(state.multi?" multi":"");el.style.setProperty("--catbg",cat.color+"aa");const head=document.createElement("div");head.className="categoryHead";head.innerHTML=`<span class="caret">▸</span>${state.multi?`<input class="catCheck" type="checkbox" ${cat.points.length&&cat.points.every(p=>state.selectedIds.has(p.id))?"checked":""}>`:``}<span class="catName">${esc(cat.label)}</span><span class="catCount">${categoryCountText(cat)}</span>${cat.key==="__cities"?"":"<button class=\"eye "+(cat.visible===false?"off":"")+" title=\"Переключить видимость\">◉</button>"}`;const body=document.createElement("div");body.className="categoryBody";body.innerHTML='<div class="loading">Загрузка…</div>';
head.addEventListener("click",async e=>{if(e.target.closest(".eye")||e.target.closest(".catCheck"))return;el.classList.toggle("open");head.querySelector(".caret").textContent=el.classList.contains("open")?"▾":"▸";if(el.classList.contains("open")){await readCategory(cat).catch(()=>{});renderCategoryBody(cat,body);updateCategoryCountNodes()}});
head.querySelector(".catCheck")?.addEventListener("click",e=>{e.stopPropagation();const checked=head.querySelector(".catCheck").checked;if(checked)cat.points.forEach(p=>state.selectedIds.add(p.id));else cat.points.forEach(p=>state.selectedIds.delete(p.id));state.selectedPoint=null;syncSelection();fitSelection();requestRender()});
head.querySelector(".eye")?.addEventListener("click",e=>{e.stopPropagation();cat.visible=cat.visible!==false;renderCategories();requestRender()});
el.append(head,body);categoryList.appendChild(el);if(cat.key==="__cities"&&cat.loaded)renderCategoryBody(cat,body)});updateSelectionUi()}
function updateCategoryCountNodes(){document.querySelectorAll(".category").forEach((el,i)=>{const cat=state.categories[i];const node=el.querySelector(".catCount");if(node)node.textContent=categoryCountText(cat)})}
function syncSelection(){document.querySelectorAll(".category").forEach((el,i)=>{const cat=state.categories[i];el.querySelectorAll(".pointButton").forEach(b=>{const p=cat?.points.find(x=>x.id===b.dataset.pointId);if(!p)return;b.classList.toggle("selected",selected(p));const cb=b.querySelector(".pointCheck");if(cb)cb.checked=state.selectedIds.has(p.id)})});updateSelectionUi();requestRender()}
function updateSelectionUi(){const total=state.selectedIds.size+(state.selectedPoint&&!state.multi&&!state.selectedIds.has(state.selectedPoint.id)?1:0);selectedCount.textContent=total?` (${total.toLocaleString()})`:"";updateCategoryCountNodes()}
function togglePoint(p,on){if(!state.multi){selectPoint(p);return}if(on)state.selectedIds.add(p.id);else state.selectedIds.delete(p.id);state.selectedPoint=null;syncSelection();fitSelection()}
function selectPoint(p){state.selectedIds.clear();state.selectedPoint=p;state.multi=false;document.querySelectorAll('[data-tool="select"]').forEach(b=>b.classList.add("active"));syncSelection();showPointInfo(p);camera.x=p.x;camera.z=p.z;camera.mpp=.5;requestRender()}
function clearSelections(){state.selectedIds.clear();state.selectedPoint=null;state.multi=false;state.onlySelected=false;state.showNames=true;onlySelectedChk.checked=false;showNamesChk.checked=true;renderCategories();syncSelection();rightBody.innerHTML='<div class="hint">Выделение сброшено.</div>';requestRender()}
function showPointInfo(p){rightBody.innerHTML=`<div class="field"><div class="label">Категория</div><div class="value">${esc(p.isCity?"Города":p.category||"")}</div></div><div class="field"><div class="label">Название</div><div class="value">${esc(p.name)}</div></div><div class="field"><div class="label">X</div><div class="value">${p.x.toFixed(3)}</div></div><div class="field"><div class="label">Y</div><div class="value">${Number(p.y||0).toFixed(3)}</div></div><div class="field"><div class="label">Z</div><div class="value">${p.z.toFixed(3)}</div></div><div class="field"><div class="label">UID</div><div class="value">${esc(p.uid??p.id??"")}</div></div><div class="field"><div class="label">Файл</div><div class="value">${esc(p.file||"")}</div></div>`}
function parseRoads(geo){const out=[];let b={minX:Infinity,maxX:-Infinity,minZ:Infinity,maxZ:-Infinity};const add=coords=>{if(!Array.isArray(coords)||coords.length<2)return;for(let i=1;i<coords.length;i++){const a=coords[i-1],c=coords[i],ax=Number(a?.[0]),az=Number(a?.[1]),bx=Number(c?.[0]),bz=Number(c?.[1]);if(![ax,az,bx,bz].every(Number.isFinite))continue;out.push([ax,az,bx,bz]);addBounds(b,ax,az);addBounds(b,bx,bz)}};for(const f of geo?.features||[]){const g=f?.geometry;if(g?.type==="LineString")add(g.coordinates);else if(g?.type==="MultiLineString")for(const l of g.coordinates||[])add(l)}state.roads=out;state.roadBounds=b}
async function loadRoads(){try{const r=await fetch("../GeoJson/roads.geojson",{cache:"no-store"});if(r.ok)parseRoads(await r.json())}catch(e){console.warn("Road load failed",e)}requestRender()}
function drawTerrain(){const s=size();terrainCtx.setTransform(dpr,0,0,dpr,0,0);terrainCtx.clearRect(0,0,s.w,s.h);if(!state.terrainVisible||!state.terrainImage||!state.terrainMeta)return;const m=state.terrainMeta,x0=Number(m.minX),x1=Number(m.maxX),z0=Number(m.minZ),z1=Number(m.maxZ);if(![x0,x1,z0,z1].every(Number.isFinite)||x1<=x0||z1<=z0)return;const sx=s.w/2+(x0-camera.x)/camera.mpp,sy=s.h/2+(z0-camera.z)/camera.mpp,ex=s.w/2+(x1-camera.x)/camera.mpp,ey=s.h/2+(z1-camera.z)/camera.mpp;terrainCtx.save();terrainCtx.globalAlpha=.68;terrainCtx.imageSmoothingEnabled=true;terrainCtx.drawImage(state.terrainImage,sx,sy,ex-sx,ey-sy);terrainCtx.restore()}
function drawRoads(){const s=size();roadsCtx.setTransform(dpr,0,0,dpr,0,0);roadsCtx.clearRect(0,0,s.w,s.h);if(!state.roads.length)return;roadsCtx.lineCap="round";for(const [ax,az,bx,bz] of state.roads){const a=worldToScreen({x:ax,z:az}),b=worldToScreen({x:bx,z:bz});roadsCtx.beginPath();roadsCtx.moveTo(a.x,a.y);roadsCtx.lineTo(b.x,b.y);roadsCtx.lineWidth=Math.max(1,Math.min(7,55/camera.mpp));roadsCtx.strokeStyle="rgba(14,17,22,.86)";roadsCtx.stroke();roadsCtx.beginPath();roadsCtx.moveTo(a.x,a.y);roadsCtx.lineTo(b.x,b.y);roadsCtx.lineWidth=Math.max(.7,Math.min(4,31/camera.mpp));roadsCtx.strokeStyle="rgba(118,130,146,.9)";roadsCtx.stroke()}}
function drawGrid(){const s=size();gridCtx.setTransform(dpr,0,0,dpr,1,1);gridCtx.clearRect(-1,-1,s.w+2,s.h+2);const step=niceStep(camera.mpp*80),px=step/camera.mpp;state.gridStep=step;if(!Number.isFinite(px)||px<22||px>260)return;const left=camera.x-s.w/2*camera.mpp,top=camera.z-s.h/2*camera.mpp,sx=(-((left%step)+step)%step)/camera.mpp,sy=(-((top%step)+step)%step)/camera.mpp;gridCtx.lineWidth=1;gridCtx.strokeStyle="rgba(140,155,175,.32)";gridCtx.beginPath();for(let x=sx;x<s.w;x+=px){gridCtx.moveTo(Math.round(x)+.5,0);gridCtx.lineTo(Math.round(x)+.5,s.h)}for(let y=sy;y<s.h;y+=px){gridCtx.moveTo(0,Math.round(y)+.5);gridCtx.lineTo(s.w,Math.round(y)+.5)}gridCtx.stroke();const major=px*5;gridCtx.lineWidth=1.2;gridCtx.strokeStyle="rgba(180,195,215,.5)";gridCtx.beginPath();for(let x=sx;x<s.w;x+=major){gridCtx.moveTo(Math.round(x)+.5,0);gridCtx.lineTo(Math.round(x)+.5,s.h)}for(let y=sy;y<s.h;y+=major){gridCtx.moveTo(0,Math.round(y)+.5);gridCtx.lineTo(s.w,Math.round(y)+.5)}gridCtx.stroke()}
function drawPoint(p,city){const q=worldToScreen(p),sel=selected(p),radius=city?(sel?7.2:5.6):(sel?6.4:4.8),c=parseColor(p.color);if(q.x<-140||q.x>size().w+140||q.y<-90||q.y>size().h+60)return;labelCtx.save();if(sel){labelCtx.beginPath();labelCtx.arc(q.x,q.y,radius+3.2,0,Math.PI*2);labelCtx.lineWidth=3;labelCtx.strokeStyle="lime";labelCtx.stroke()}labelCtx.shadowColor="rgba(0,0,0,.82)";labelCtx.shadowBlur=4;labelCtx.shadowOffsetX=0;labelCtx.shadowOffsetY=0;labelCtx.beginPath();labelCtx.arc(q.x,q.y,radius,0,Math.PI*2);labelCtx.fillStyle=`rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;labelCtx.fill();labelCtx.shadowColor="rgba(0,0,0,0)";labelCtx.shadowBlur=0;labelCtx.lineWidth=2;labelCtx.strokeStyle="#0a0c0f";labelCtx.stroke();labelCtx.restore()}
function drawLabel(p,city,force=false){const q=worldToScreen(p),sel=selected(p);if(!force&&!state.showNames)return;labelCtx.save();const sizePx=10*state.fontScale*(city?1.2:1),fill=city?"#ffe600":sel?"#fff":"#b8c0cb";labelCtx.font=`${city||sel?"700":"600"} ${sizePx.toFixed(2)}px Segoe UI,Arial,sans-serif`;labelCtx.textAlign="center";labelCtx.textBaseline="alphabetic";labelCtx.fillStyle=fill;labelCtx.lineWidth=1;labelCtx.strokeStyle="rgba(0,0,0,.82)";labelCtx.shadowColor="rgba(0,0,0,.95)";labelCtx.shadowBlur=4;labelCtx.shadowOffsetX=0;labelCtx.shadowOffsetY=0;labelCtx.strokeText(p.name,q.x,q.y-(city?5.6:4.8));labelCtx.fillText(p.name,q.x,q.y-(city?5.6:4.8));labelCtx.restore()}
function drawLabels(){const s=size();labelCtx.setTransform(dpr,0,0,dpr,0,0);labelCtx.clearRect(0,0,s.w,s.h);if(camera.mpp>800)return;const visible=getVisiblePoints(),normal=visible.filter(p=>!p.isCity),cities=state.showCities?visibleCityPoints():[];for(const p of normal.filter(p=>!selected(p)))drawPoint(p,false);for(const p of normal.filter(selected))drawPoint(p,false);for(const p of cities)drawPoint(p,true);for(const p of normal.filter(p=>!selected(p)))drawLabel(p,false,false);for(const p of normal.filter(selected))drawLabel(p,false,true);for(const p of cities)drawLabel(p,true,true)}
function visibleCityPoints(){return state.categories.find(c=>c.key==="__cities")?.points||[]}
function render(){drawTerrain();drawRoads();drawGrid();drawLabels();mapInfo.textContent=`Zoom ${camera.mpp.toFixed(3)} m/px · клетка ${state.gridStep.toFixed(3)} м · roads ${state.roads.length.toLocaleString()} · points ${state.allPoints.length.toLocaleString()} · cities ${visibleCityPoints().length.toLocaleString()}`}
function openTerrainStatus(text){statusTerrain.innerHTML="";const label=document.createElement("span");label.textContent=text+" · ";const a=document.createElement("a");a.className="terrainLink";a.href="#";a.textContent="data\\map_editor2\\terrain_height.png";a.onclick=e=>{e.preventDefault();window.chrome?.webview?.postMessage("map2-open-terrain-file")};statusTerrain.append(label,a)}
async function loadTerrain(){try{const r=await fetch("./terrain_height_meta.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();state.terrainMeta=await r.json();const img=new Image();img.src="./terrain_height.png?ts="+Date.now();await img.decode();state.terrainImage=img;openTerrainStatus("Карта высот загружена")}catch{state.terrainMeta=null;state.terrainImage=null;openTerrainStatus("Карта высот не найдена · сначала сгенерируйте её")}requestRender()}
function toggleTerrain(){state.terrainVisible=!state.terrainVisible;$("terrainToggle").textContent=state.terrainVisible?"Скрыть карту высот":"Показать карту высот";openTerrainStatus(state.terrainVisible?"Карта высот включена":"Карта высот скрыта");requestRender()}
function updateCitiesVisibility(){const c=state.categories.find(x=>x.key==="__cities");if(c)c.visible=showCitiesChk.checked;requestRender()}
function updateFont(delta){state.fontScale=Math.max(.75,Math.min(2,state.fontScale+delta));document.documentElement.style.setProperty("--font-scale",state.fontScale.toFixed(2));requestRender()}
function findPoint(x,y){let best=null,bd=Infinity;for(const p of getVisiblePoints()){const q=worldToScreen(p),d=Math.hypot(q.x-x,q.y-y),hit=p.isCity?13:12;if(d<=hit&&d<bd){best=p;bd=d}}return best}
function showTooltip(e){const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=findPoint(x,y);if(!p){tooltip.style.display="none";return}const cat=state.categories.find(c=>c.key===p.category),name=p.isCity?"Города":(cat?.label||p.category||"");tooltip.innerHTML=`<div><b>${esc(p.name)}</b></div><div>Категория: ${esc(name)}</div><div>UID: ${esc(p.uid??p.id??"")}</div>`;tooltip.style.display="block";const pad=14,w=tooltip.offsetWidth,h=tooltip.offsetHeight;let tx=x+pad,ty=y+pad;if(tx+w>r.width-4)tx=x-w-pad;if(ty+h>r.height-4)ty=y-h-pad;tooltip.style.left=Math.max(4,tx)+"px";tooltip.style.top=Math.max(4,ty)+"px"}
let drag=null;
interaction.addEventListener("pointerdown",e=>{const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(e.button===1||e.button===2){drag={button:e.button,x,y,cx:camera.x,cz:camera.z,moved:false};interaction.setPointerCapture?.(e.pointerId);e.preventDefault();return}if(e.button===0&&state.activeTool==="select"){drag={button:0,x,y,cx:camera.x,cz:camera.z,moved:false};e.preventDefault()}});
interaction.addEventListener("pointermove",e=>{showTooltip(e);if(!drag)return;const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-drag.x,dy=y-drag.y;if(drag.button!==0||state.activeTool==="select"){if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){camera.x=drag.cx-dx*camera.mpp;camera.z=drag.cz-dy*camera.mpp;requestRender()}}});
interaction.addEventListener("pointerup",e=>{if(!drag)return;const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,moved=!!drag.moved;if(e.button===0&&!moved&&state.activeTool==="select"){const p=findPoint(x,y);if(p){if(state.multi){if(state.selectedIds.has(p.id))state.selectedIds.delete(p.id);else state.selectedIds.add(p.id);state.selectedPoint=null}else{state.selectedIds.clear();state.selectedPoint=p}syncSelection();showPointInfo(p)}else if(!state.multi){state.selectedIds.clear();state.selectedPoint=null;syncSelection()}}else if(e.button===0&&!moved&&state.activeTool==="add"){const w=screenToWorld(x,y);window.chrome?.webview?.postMessage(JSON.stringify({type:"map2-create-point",x:w.x,y:0,z:w.z}))}drag=null;requestRender()});
interaction.addEventListener("pointercancel",()=>{drag=null});
interaction.addEventListener("wheel",e=>{const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,before=screenToWorld(x,y),factor=Math.pow(1.13,e.deltaY/100);camera.mpp=Math.max(limits.minMpp,Math.min(limits.maxMpp,camera.mpp*factor));const after=screenToWorld(x,y);camera.x+=before.x-after.x;camera.z+=before.z-after.z;requestRender();e.preventDefault()},{passive:false});
interaction.addEventListener("contextmenu",e=>e.preventDefault());interaction.addEventListener("mouseleave",()=>tooltip.style.display="none");
onlySelectedChk.addEventListener("change",()=>{state.onlySelected=onlySelectedChk.checked;requestRender()});showNamesChk.addEventListener("change",()=>{state.showNames=showNamesChk.checked;requestRender()});showCitiesChk.addEventListener("change",updateCitiesVisibility);
$("showAllBtn").onclick=()=>{state.categories.forEach(c=>c.visible=true);showCitiesChk.checked=true;renderCategories();requestRender()};$("hideAllBtn").onclick=()=>{state.categories.forEach(c=>c.visible=false);showCitiesChk.checked=false;renderCategories();requestRender()};$("invertBtn").onclick=()=>{state.categories.forEach(c=>c.visible=c.visible===false);const city=state.categories.find(c=>c.key==="__cities");showCitiesChk.checked=city?.visible!==false;renderCategories();requestRender()};$("resetBtn").onclick=clearSelections;$("fitBtn").onclick=()=>state.selectedIds.size?fitSelection():fitPoints();
document.querySelectorAll("[data-tool]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-tool]").forEach(x=>x.classList.remove("active"));btn.classList.add("active");state.activeTool=btn.dataset.tool;if(state.activeTool==="select"){state.multi=!state.multi;state.selectedIds.clear();state.selectedPoint=null;renderCategories()}});
const viewPopup=$("viewPopup"),toolsPopup=$("toolsPopup");document.querySelector('[data-menu="view"]').onclick=e=>{e.stopPropagation();viewPopup.classList.toggle("open");toolsPopup.classList.remove("open")};document.querySelector('[data-menu="tools"]').onclick=e=>{e.stopPropagation();toolsPopup.classList.toggle("open");viewPopup.classList.remove("open")};document.addEventListener("click",()=>{viewPopup.classList.remove("open");toolsPopup.classList.remove("open")});
$("fontPlus").onclick=e=>{e.stopPropagation();updateFont(.03)};$("fontMinus").onclick=e=>{e.stopPropagation();updateFont(-.03)};$("generateTerrain").onclick=e=>{e.stopPropagation();toolsPopup.classList.remove("open");window.chrome?.webview?.postMessage("map2-generate-terrain")};$("terrainToggle").onclick=e=>{e.stopPropagation();toggleTerrain()};
window.MapEditor2SetStaticPointFiles=files=>{state.staticFiles=Array.isArray(files)?files.filter(x=>typeof x==="string"&&/\.json$/i.test(x)):[];loadStaticPointData()};
async function loadStaticPointData(){try{const r=await fetch("../editor_static_data/meta.json",{cache:"no-store"});if(r.ok){const m=await r.json();state.meta=m?.categories&&typeof m.categories==="object"?m.categories:{}}}catch{}groupCategories();await loadAllCategories();window.chrome?.webview?.postMessage("map2-data-ready")}
window.MapEditor2SetTargets=items=>{state.externalPoints=Array.isArray(items)?items.map((p,i)=>({...p,source:"custom",category:"__custom",name:p.name||p.id||("Цель "+(i+1)),color:p.color||"#ffd45c"})):[];let c=state.categories.find(x=>x.key==="__custom");if(!c){c={key:"__custom",label:"Цели",color:"#a78945",files:[],points:[],loaded:true,visible:true};state.categories.push(c)}c.points=state.externalPoints;rebuildPoints();renderCategories();fitPoints()};
window.MapEditor2ShowNewPoint=(x,y,z)=>{rightBody.innerHTML=`<div class="field"><div class="label">Режим</div><div class="value">Новая точка</div></div><div class="field"><div class="label">X</div><div class="value">${Number(x).toFixed(2)}</div></div><div class="field"><div class="label">Y</div><div class="value">${Number(y).toFixed(2)}</div></div><div class="field"><div class="label">Z</div><div class="value">${Number(z).toFixed(2)}</div></div>`};
window.MapEditor2TerrainProgress=openTerrainStatus;window.MapEditor2ReloadTerrain=loadTerrain;window.MapEditor2ToggleTerrain=toggleTerrain;
resize();openTerrainStatus("Карта высот не найдена · сначала сгенерируйте её");loadRoads();loadTerrain();window.chrome?.webview?.postMessage("map2-ready");
})();
