<body><div id="app">

function parseCoords(e){const raw=e.coords!=null?String(e.coords):null;let x,y,z;if(raw){const parts=raw.split(/[,;\s]+/).filter(Boolean);if(parts.length>=3){x=Number(parts[0]);y=Number(parts[1]);z=Number(parts[2])}}if(!Number.isFinite(x)&&e.x!=null)x=Number(e.x);if(!Number.isFinite(y)&&e.y!=null)y=Number(e.y);if(!Number.isFinite(z)&&e.z!=null)z=Number(e.z);if(!Number.isFinite(x)||!Number.isFinite(z))return null;if(!Number.isFinite(y))y=0;return[x,y,z]}
function updateSaveStatusPoints(applied){const total=state.ovrMap.size;if(total)setSaveStatus(`Переопределено точек: ${applied} из ${total}`)}

function ensureSavedCategory(){let c=state.specialCats.find(x=>x.key==='__saved');if(!c){c={key:'__saved',label:'Сохранённые',color:'#4787d1',files:[],points:[],loaded:true,visible:true,isSpecial:true};state.specialCats.push(c)}const inF=state.ovrFiles.filter(f=>f.pos>0).sort((a,b)=>a.pos-b.pos||a.name.localeCompare(b.name,'ru'));const exF=state.ovrFiles.filter(f=>!(f.pos>0)).slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));const order=inF.concat(exF);const byFile=new Map();const seenGn=new Set();for(const p of state.allPoints){if(p.source!=='override')continue;const gn=String(p.GameName??p.uid??p.id??'');if(!gn||seenGn.has(gn))continue;seenGn.add(gn);const fl=(p.__ovrFiles||[]).map(x=>String(x).toLowerCase());const inMine=state.ovrFiles.filter(f=>f.pos>0&&fl.includes(f.name.toLowerCase())).sort((a,b)=>a.pos-b.pos);let src=null,active=false;if(inMine.length){src=inMine[inMine.length-1];active=true}else{const exMine=state.ovrFiles.filter(f=>!(f.pos>0)&&fl.includes(f.name.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(!exMine.length)continue;src=exMine[0]}p.__savedKey='__saved';p.__savedActive=active;p.__ovrClickCreate=!active;const fk=src.name.toLowerCase();if(!byFile.has(fk))byFile.set(fk,[]);byFile.get(fk).push(p)}const heads=[],pts=[];for(const f of order){const list=byFile.get(f.name.toLowerCase());if(!list||!list.length)continue;for(const p of list)pts.push(p);heads.push({afterCount:pts.length,name:f.name,excluded:!(f.pos>0)})}c.points=pts;c.__fileHeads=heads;return c}

function collectDirtyFields(p){const payload={};payload.gameName=String(p.GameName??p.uid??p.id??'');if(!payload.gameName)return null;const dk=pointDirtyKeys(p);for(const [group,key,label,type,required] of FIELD_DEFS){if(!dk.has(key))continue;if(key==='GameName')continue;const v=pointValue(p,key);if(type==='bool')payload[fieldJsonKey(key)]=v?1:0;else if(key==='X'||key==='Z'||key==='Y'){if(payload.coords===undefined)payload.coords=`${numStr(p.x)}, ${numStr(Number(p.y)||0)}, ${numStr(p.z)}`}else payload[fieldJsonKey(key)]=typeof v==='number'?v:String(v)}if(payload.coords===undefined)payload.coords=`${numStr(p.x)}, ${numStr(Number(p.y)||0)}, ${numStr(p.z)}`;return payload}

function initFavStarRow(p,panel){if(!panel)panel=rightBody.querySelector('.editPanel');if(!panel)return;const old=panel.querySelector('.favStarRow');if(old)old.remove();const row=document.createElement('div');row.className='editRow favStarRow';row.style.cssText='align-items:center';const key=String(p?.GameName??p?.uid??p?.id??'');const on=key!==''&&state.favorites.has(key);const lab=document.createElement('label');lab.id='favStarLabel';lab.className='editCheck';lab.style.cssText='gap:6px;cursor:pointer'+(on?';color:#ffd45c;font-weight:700':'');const star=document.createElement('span');star.id='favStarIcon';star.className='favStarIcon'+(on?' on':'');star.textContent=on?'★':'☆';const txt=document.createElement('span');txt.id='favStarText';txt.textContent=on?'В избранном':'В избранное';lab.append(star,txt);lab.addEventListener('click',e=>{e.preventDefault();toggleFavorite(p)});row.appendChild(lab);panel.insertBefore(row,panel.firstChild)}

{id:'legend',title:'Условные обозначения',html:`
