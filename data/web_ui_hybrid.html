<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ETS2 Telemetry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: transparent !important;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow: hidden;
            cursor: none;
        }
        .dashboard {
            max-width: 1100px;
            width: 100%;
            background: rgba(20, 26, 36, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 12px 16px 16px;
            border: 1px solid rgba(42, 51, 66, 0.3);
            position: relative;
            z-index: 5;
            box-shadow: none;
        }

        .header-row, .zoom-controls, .row, .footer {
            display: none !important;
        }

        .distance-bar-wrap {
            margin-top: 4px;
            margin-bottom: 12px;
        }
        .distance-bar {
            position: relative;
            background: #1e2633;
            border-radius: 30px;
            height: 24px;
            overflow: hidden;
            border: 1px solid #2f3a4a;
        }
        .distance-bar .fill {
            height: 100%;
            width: 0%;
            background-color: #2e7d32;
            border-radius: 30px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .distance-bar .label {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            z-index: 2;
            pointer-events: none;
        }
        .distance-bar .flag {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            z-index: 3;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .distance-bar.hidden { display: none; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
            margin: 12px 0;
        }
        .card {
            position: relative;
            overflow: hidden;
            background: rgba(30, 38, 51, 0.8);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid #2f3a4a;
            transition: background-color 0.3s, border-color 0.3s;
            z-index: 1;
        }
        .card .progress-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: 14px;
            z-index: -1;
            transition: width 0.3s ease, background-color 0.3s ease;
            pointer-events: none;
            background-color: transparent;
        }
        .card.fuel.critical .progress-bg { animation: blink-bg 0.6s infinite; }
        .card.rest.critical .progress-bg { animation: blink-bg 0.6s infinite; }
        .card.job.critical .progress-bg { animation: blink-bg 0.6s infinite; }
        @keyframes blink-bg {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .card .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c0c0c0;
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .card .value {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .card .unit {
            font-size: 14px;
            font-weight: 300;
            color: #ddd;
            margin-left: 3px;
        }

        /* ---- скорость ---- */
        .card.speed .unit {
            display: block;              /* переносим на новую строку */
            font-size: 14px;
            color: #ddd;
            margin-top: 2px;
            margin-left: 0;
        }
        .card.speed .value {
            font-size: 40px;
        }
        .card.speed.redzone {
            background-color: #cc0000 !important;
            border-color: #ff4444;
        }
        .card.speed.redzone .value {
            color: white !important;
            font-weight: 700;
            font-size: 44px;
        }
        .card.speed.redzone .unit {
            color: white !important;
        }
        .card.speed.redzone .label {
            color: #ffdddd !important;
        }

        /* ---- иконки ---- */
        .speed-icon {
            position: absolute;
            z-index: 10;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            border: 1.5px solid rgba(200, 200, 200, 0.4);
            transition: all 0.25s ease;
            user-select: none;
            pointer-events: none;
            background: rgba(80, 80, 80, 0.35);
            color: rgba(200, 200, 200, 0.5);
            line-height: 1;
            transform: translateY(-2px);  /* поднимаем на 2 пикселя */
        }
        .speed-icon.engine-icon {
            top: 6px;
            left: 6px;
        }
        .speed-icon.parking-icon {
            top: 6px;
            right: 6px;
        }

        .speed-icon.engine-active {
            background: rgba(0, 180, 0, 0.85);
            border-color: #00cc00;
            color: white;
            font-weight: 700;
            text-shadow: 0 0 6px rgba(0,255,0,0.4);
        }
        .speed-icon.engine-inactive {
            background: rgba(80, 80, 80, 0.3);
            border-color: rgba(150, 150, 150, 0.25);
            color: rgba(200, 200, 200, 0.4);
            font-weight: 400;
        }
        .speed-icon.parking-active {
            background: rgba(220, 30, 30, 0.9);
            border-color: #ff4444;
            color: white;
            font-weight: 700;
            text-shadow: 0 0 6px rgba(255,0,0,0.4);
        }
        .speed-icon.parking-inactive {
            background: rgba(80, 80, 80, 0.3);
            border-color: rgba(150, 150, 150, 0.25);
            color: rgba(200, 200, 200, 0.4);
            font-weight: 400;
        }

        /* ---- остальные карточки ---- */
        .card.fuel .value { color: #66ff99; }
        .card.rest .value { color: #ffaa66; }
        .card.job .value { color: #ff9966; }

        .card.range-mode .value {
            font-size: 24px;
            color: #ffcc66;
            line-height: 1.2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .card.range-mode .sub {
            font-size: 16px;
            color: #ccc;
            margin-top: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .job-status {
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        .job-status.ontime { background: #1a6b3c; color: #8bffb0; }
        .job-status.hurry { background: #6b5a1a; color: #ffd966; }
        .job-status.late { background: #6b1a1a; color: #ff8a8a; }

        .range-bar {
            margin: 12px 0 10px;
            background: #1e2633;
            border-radius: 30px;
            height: 22px;
            overflow: hidden;
            border: 1px solid #2f3a4a;
            position: relative;
        }
        .range-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s ease, background-color 0.3s ease;
            background-color: #4caf50;
        }
        .range-bar .label {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            color: #ddd;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 2;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
            .card .value { font-size: 22px; }
            .card.speed .value { font-size: 30px; }
            .card.speed.redzone .value { font-size: 34px; }
            .distance-bar .label { font-size: 11px; }
            .range-bar .label { font-size: 10px; }
            .speed-icon { width: 26px; height: 26px; font-size: 14px; transform: translateY(-2px); }
        }
    </style>
</head>
<body>
<div class="dashboard" id="dashboard">

    <div class="distance-bar-wrap" id="distanceWrap">
        <div class="distance-bar" id="distanceBar">
            <div class="fill" id="distanceFill" style="width:0%;"></div>
            <div class="label" id="distanceLabel">DESTINATION: --</div>
            <div class="flag">🏁</div>
        </div>
    </div>

    <div class="grid">
        <div class="card speed" id="speedCard">
            <div class="label">Speed</div>
            <div class="value"><span id="speedValue">0</span><span class="unit">km/h</span></div>
            <div class="speed-icon engine-icon engine-inactive" id="engineIcon">(E)</div>
            <div class="speed-icon parking-icon parking-inactive" id="parkingIcon">(P)</div>
        </div>

        <div class="card fuel" id="fuelCard">
            <div class="progress-bg" id="fuelProgress"></div>
            <div class="label" data-i18n="fuel">Fuel</div>
            <div class="value"><span id="fuelValue">--</span><span class="unit">%</span></div>
        </div>

        <div class="card rest" id="restCard">
            <div class="progress-bg" id="restProgress"></div>
            <div class="label" data-i18n="rest">Rest in</div>
            <div class="value"><span id="restValue">--</span><span class="unit"></span></div>
        </div>

        <div class="card job" id="jobCard" style="display:none;">
            <div class="progress-bg" id="jobProgress"></div>
            <div class="label" data-i18n="job">Job deadline</div>
            <div class="value"><span id="jobValue">--</span><span class="unit"></span></div>
            <div class="job-status" id="jobStatus"></div>
        </div>

        <div class="card range-mode">
            <div class="label" data-i18n="mode">Mode</div>
            <div class="value" id="modeLabel">0-30</div>
            <div class="sub" id="rangeLabel">km/h</div>
        </div>
    </div>

    <div style="margin: 6px 0 4px;">
        <div class="range-bar">
            <div class="fill" id="rangeFill" style="width: 0%;"></div>
            <div class="label" data-i18n="steering_sensitivity">STEERING SENSITIVITY</div>
        </div>
    </div>

</div>

<script>
    // ---- Load language (fallback) ----
    let lang = {};
    async function loadLanguage() {
        try {
            const res = await fetch('lang.json?' + Date.now());
            if (!res.ok) throw new Error('not found');
            lang = await res.json();
            applyTranslations();
        } catch (e) {
            lang = {
                fuel: 'Fuel', rest: 'Rest in', job: 'Job deadline',
                mode: 'Mode', destination_label: 'DESTINATION',
                steering_sensitivity: 'STEERING SENSITIVITY',
                ontime: '✅ On time', hurry: '⚡ Need to hurry', late: '⚠️ You\'re late!'
            };
            applyTranslations();
        }
    }
    function applyTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (lang[key] !== undefined) el.textContent = lang[key];
        });
    }

    // ---- DOM refs ----
    const speedValue = document.getElementById('speedValue');
    const speedUnit = document.querySelector('.card.speed .unit');
    const speedCard = document.getElementById('speedCard');
    const fuelValue = document.getElementById('fuelValue');
    const fuelProgress = document.getElementById('fuelProgress');
    const fuelCard = document.getElementById('fuelCard');
    const restValue = document.getElementById('restValue');
    const restProgress = document.getElementById('restProgress');
    const restCard = document.getElementById('restCard');
    const jobCard = document.getElementById('jobCard');
    const jobValue = document.getElementById('jobValue');
    const jobProgress = document.getElementById('jobProgress');
    const jobStatus = document.getElementById('jobStatus');
    const modeLabel = document.getElementById('modeLabel');
    const rangeLabel = document.getElementById('rangeLabel');
    const rangeFill = document.getElementById('rangeFill');
    const distanceWrap = document.getElementById('distanceWrap');
    const distanceFill = document.getElementById('distanceFill');
    const distanceLabel = document.getElementById('distanceLabel');
    const engineIcon = document.getElementById('engineIcon');
    const parkingIcon = document.getElementById('parkingIcon');

    // ---- State ----
    let httpData = {
        fuelPercent: 0, restHours: 0, jobRemaining: 0, hasJob: false,
        jobInitial: 0, estimatedHours: 0, estimatedDistance: 0, initialDistance: 0,
        parking: 'OFF', engine: 'OFF', rangeMin: 400, rangeMax: 623
    };
    let lastSpeed = 0;
    let wsConnected = false;

    // ---- Helpers ----
    function formatHours(h) {
        if (!h || h <= 0) return '--';
        const totalMin = Math.round(h * 60);
        const hrs = Math.floor(totalMin / 60);
        const min = totalMin % 60;
        return hrs + ':' + min.toString().padStart(2, '0');
    }

    function getProgressColor(percent) {
        if (percent >= 40) return '#2e7d32';
        else if (percent >= 30) return '#1565c0';
        else {
            const p = percent / 30;
            const r = 255;
            const g = Math.round(80 * p);
            const b = 0;
            return `rgb(${r}, ${g}, ${b})`;
        }
    }

    function getRangeColor(percent) {
        const p = percent / 100;
        const r = Math.round(46 * (1 - p) + 2 * p);
        const g = Math.round(125 * (1 - p) + 119 * p);
        const b = Math.round(50 * (1 - p) + 189 * p);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function getSensitivityProgress(speed) {
        let min, max;
        if (speed < 1) { min = 282; max = 742; }
        else if (speed < 30) { min = 256; max = 768; }
        else if (speed < 60) { min = 179; max = 844; }
        else if (speed < 80) { min = 128; max = 896; }
        else if (speed < 100) { min = 77; max = 947; }
        else if (speed < 140) { min = 38; max = 986; }
        else { min = 0; max = 1023; }
        const width = max - min;
        const maxWidth = 1023;
        const minWidth = 460;
        return ((maxWidth - width) / (maxWidth - minWidth)) * 100;
    }

    function getSpeedRange(speed) {
        if (speed < 1) return '0-1';
        else if (speed < 30) return '0-30';
        else if (speed < 60) return '30-60';
        else if (speed < 80) return '60-80';
        else if (speed < 100) return '80-100';
        else if (speed < 140) return '100-140';
        else return '140+';
    }

    // ---- Update UI ----
    function updateUI() {
        const speed = lastSpeed || 0;
        const engineOn = (httpData.engine === 'ON');

        // --- Speed & Mode ---
        if (engineOn) {
            speedValue.textContent = Math.round(speed);
            speedUnit.style.display = 'block';
            const rangeText = getSpeedRange(speed);
            modeLabel.textContent = rangeText;
            rangeLabel.textContent = 'km/h';
            const isInZone = (speed >= 100 && speed <= 120);
            if (isInZone) speedCard.classList.add('redzone');
            else speedCard.classList.remove('redzone');
        } else {
            speedValue.textContent = '--';
            speedUnit.style.display = 'none';
            modeLabel.textContent = '--';
            rangeLabel.textContent = '';
            speedCard.classList.remove('redzone');
        }

        // --- Engine icon ---
        if (engineOn) {
            engineIcon.className = 'speed-icon engine-icon engine-active';
        } else {
            engineIcon.className = 'speed-icon engine-icon engine-inactive';
        }

        // --- Parking icon ---
        const parkingOn = (httpData.parking === 'ON');
        if (parkingOn) {
            parkingIcon.className = 'speed-icon parking-icon parking-active';
        } else {
            parkingIcon.className = 'speed-icon parking-icon parking-inactive';
        }

        // --- Fuel (always update) ---
        const fuel = httpData.fuelPercent || 0;
        if (fuel <= 0) {
            fuelValue.textContent = '--';
            fuelProgress.style.width = '0%';
            fuelProgress.style.backgroundColor = 'transparent';
            fuelCard.classList.remove('warning', 'critical');
        } else {
            fuelValue.textContent = fuel;
            fuelProgress.style.width = fuel + '%';
            fuelProgress.style.backgroundColor = getProgressColor(fuel);
            fuelCard.classList.remove('warning', 'critical');
            if (fuel < 10) fuelCard.classList.add('critical');
            else if (fuel < 15) fuelCard.classList.add('warning');
        }

        // --- Rest (always update) ---
        const restHours = httpData.restHours || 0;
        if (restHours <= 0) {
            restValue.textContent = '--';
            restProgress.style.width = '0%';
            restProgress.style.backgroundColor = 'transparent';
            restCard.classList.remove('warning', 'critical');
        } else {
            restValue.textContent = formatHours(restHours);
            const restPercent = Math.min(100, (restHours / 11) * 100);
            restProgress.style.width = restPercent + '%';
            restProgress.style.backgroundColor = getProgressColor(restPercent);
            restCard.classList.remove('warning', 'critical');
            if (restHours < 1) restCard.classList.add('critical');
            else if (restHours < 2) restCard.classList.add('warning');
        }

        // --- Job (always update if present) ---
        const hasJob = httpData.hasJob || false;
        const jobRemaining = httpData.jobRemaining || 0;
        const jobInitial = httpData.jobInitial || 0;
        const estimatedHours = httpData.estimatedHours || 0;
        if (hasJob && jobRemaining > 0) {
            jobCard.style.display = 'block';
            const maxJob = (jobInitial > 0) ? jobInitial : jobRemaining;
            const jobPercent = Math.min(100, (jobRemaining / maxJob) * 100);
            jobValue.textContent = formatHours(jobRemaining);
            jobProgress.style.width = jobPercent + '%';
            jobProgress.style.backgroundColor = getProgressColor(jobPercent);
            jobCard.classList.remove('warning', 'critical');
            if (jobRemaining < 1) jobCard.classList.add('critical');
            else if (jobRemaining < 2) jobCard.classList.add('warning');
            let statusText = '', statusClass = '';
            if (estimatedHours > 0 && jobRemaining > 0) {
                const ratio = estimatedHours / jobRemaining;
                if (ratio >= 1.0) { statusText = lang.late || '⚠️ You\'re late!'; statusClass = 'late'; }
                else if (ratio >= 0.85) { statusText = lang.hurry || '⚡ Need to hurry'; statusClass = 'hurry'; }
                else { statusText = lang.ontime || '✅ On time'; statusClass = 'ontime'; }
            } else {
                statusText = lang.ontime || '✅ On time';
                statusClass = 'ontime';
            }
            jobStatus.textContent = statusText;
            jobStatus.className = 'job-status ' + statusClass;
        } else {
            jobCard.style.display = 'none';
        }

        // --- Sensitivity bar (only if engine on) ---
        if (engineOn) {
            const progress = getSensitivityProgress(speed);
            rangeFill.style.width = Math.min(100, Math.max(0, progress)) + '%';
            rangeFill.style.backgroundColor = getRangeColor(progress);
        } else {
            rangeFill.style.width = '0%';
            rangeFill.style.backgroundColor = 'transparent';
        }

        // --- Distance (only if job and engine on) ---
const initialDist = httpData.initialDistance || 0;
const estimatedDist = httpData.estimatedDistance !== undefined && httpData.estimatedDistance !== null ? httpData.estimatedDistance : 0;
console.log(`[Distance] engineOn=${engineOn}, hasJob=${hasJob}, initialDist=${initialDist}, estimatedDist=${estimatedDist}`);

if (engineOn && hasJob) {
    distanceWrap.style.display = 'block';
    console.log('[Distance] Блок показан (engineOn && hasJob)');

    let progressDist = 0;
    let timeStr = '--';

    if (initialDist > 0 && estimatedDist >= 0) {
        progressDist = (1 - (estimatedDist / initialDist)) * 100;
        progressDist = Math.min(100, Math.max(0, progressDist));
        timeStr = (httpData.estimatedHours > 0) ? formatHours(httpData.estimatedHours) : '--';
        console.log(`[Distance] Прогресс ${progressDist.toFixed(1)}%, время ${timeStr}`);
    } else {
        console.log('[Distance] Данных о расстоянии нет, показываем "--" и нулевой прогресс');
    }

    // Устанавливаем ширину прогресса (минимум 1%, чтобы полоса всегда была видна)
    distanceFill.style.width = Math.max(1, progressDist) + '%';
    distanceLabel.textContent = (lang.destination_label || 'DESTINATION') + ': ' + timeStr;
} else {
    distanceWrap.style.display = 'none';
    console.log('[Distance] Блок скрыт (условие не выполнено)');
}
    }

    // ---- HTTP fetch ----
    async function fetchHttpData() {
        try {
            const res = await fetch('web_data.json?' + Date.now());
            if (!res.ok) throw new Error('HTTP error');
            const data = await res.json();
            httpData.fuelPercent = data.fuel ?? 0;
            httpData.restHours = data.restHours ?? 0;
            httpData.jobRemaining = data.jobRemaining ?? 0;
            httpData.hasJob = data.hasJob === true;
            httpData.jobInitial = data.jobInitial ?? 0;
            httpData.estimatedHours = data.estimatedHours ?? 0;
            httpData.estimatedDistance = data.estimatedDistance ?? 0;
            httpData.initialDistance = data.initialDistance ?? 0;
            httpData.parking = data.parking || 'OFF';
            httpData.engine = data.engine || 'OFF';
            httpData.rangeMin = data.rangeMin ?? 400;
            httpData.rangeMax = data.rangeMax ?? 623;
            if (!wsConnected) {
                const speedFromHttp = data.speed ?? 0;
                if (speedFromHttp > 0) lastSpeed = speedFromHttp;
            }
            updateUI();
        } catch (e) { /* ignore */ }
    }

    // ---- WebSocket ----
    const WS_URL = 'ws://localhost:8081/api/ws/delta/flat/?throttle=50';
    let socket = null, reconnectTimer = null, wsTimeoutId = null;

    function connectWebSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) return;
        socket = new WebSocket(WS_URL);
        socket.onopen = function() {
            wsConnected = true;
            if (wsTimeoutId) clearTimeout(wsTimeoutId);
        };
        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data['truck.speed'] !== undefined) {
                    let speedVal = Math.abs(data['truck.speed']) * 3.6;
                    lastSpeed = Math.round(speedVal);
                    updateUI();
                }
            } catch (e) { /* ignore */ }
        };
        socket.onerror = function() { wsConnected = false; };
        socket.onclose = function() {
            wsConnected = false;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => connectWebSocket(), 3000);
        };
        wsTimeoutId = setTimeout(() => {
            if (!wsConnected) {
                wsConnected = false;
                if (socket && socket.readyState !== WebSocket.CLOSED) socket.close();
            }
        }, 5000);
    }

    // ---- Start ----
    loadLanguage().then(() => {
        fetchHttpData();
        setInterval(fetchHttpData, 1000);
        connectWebSocket();
    });
</script>
</body>
</html>
