<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0e14">
    <title>ETS2 Telemetry Dashboard (WebSocket)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease;
        }
        body.bg-red { background-color: #cc0000 !important; }
        body.bg-green { background-color: #1a7a3a !important; }
        body.bg-orange { background-color: #cc6600 !important; }
        body.bg-black { background-color: #0b0e14 !important; }

        .dashboard {
            max-width: 1100px;
            width: 100%;
            background: rgba(20, 26, 36, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 20px 16px 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a3342;
            position: relative;
            z-index: 5;
        }

        .header-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .header-row h1 {
            font-weight: 300;
            letter-spacing: 1px;
            color: #8ab4f8;
            font-size: inherit;
            margin: 0;
        }
        .header-row .status-badge {
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: inherit;
            background: #2a3342;
            color: #ccc;
        }
        .header-row .status-badge.active { background: #1a6b3c; color: #8bffb0; }
        .header-row .status-badge.waiting { background: #6b5a1a; color: #ffd966; }
        .header-row .status-badge.error { background: #6b1a1a; color: #ff8a8a; }
        .header-row .timestamp {
            color: #888;
            font-size: inherit;
            margin-left: auto;
        }

        .distance-bar-wrap {
            margin-bottom: 16px;
        }
        .distance-bar {
            position: relative;
            background: #1e2633;
            border-radius: 30px;
            height: 24px;
            overflow: hidden;
            border: 1px solid #2f3a4a;
        }
        .distance-bar .fill {
            height: 100%;
            width: 0%;
            background-color: #2e7d32;
            border-radius: 30px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .distance-bar .label {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            z-index: 2;
            pointer-events: none;
        }
        .distance-bar .flag {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            z-index: 3;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .distance-bar.hidden {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
            margin: 15px 0;
        }
        .card {
            position: relative;
            overflow: hidden;
            background: rgba(30, 38, 51, 0.8);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid #2f3a4a;
            transition: background-color 0.3s, border-color 0.3s;
            z-index: 1;
        }
        .card .progress-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            border-radius: 14px;
            z-index: -1;
            transition: width 0.3s ease, background-color 0.3s ease;
            pointer-events: none;
            background-color: transparent;
        }
        .card.fuel.critical .progress-bg { animation: blink-bg 0.6s infinite; }
        .card.rest.critical .progress-bg { animation: blink-bg 0.6s infinite; }
        .card.job.critical .progress-bg { animation: blink-bg 0.6s infinite; }

        @keyframes blink-bg {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .card .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c0c0c0;
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .card .value {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .card .unit {
            font-size: 14px;
            font-weight: 300;
            color: #ddd;
            margin-left: 3px;
        }
        .card.speed .unit {
            display: block;
            margin-left: 0;
            font-size: 16px;
            color: #ddd;
        }
        .card.speed .value {
            font-size: 32px;
        }
        .card.speed.redzone {
            background-color: #cc0000 !important;
            border-color: #ff4444;
        }
        .card.speed.redzone .value {
            color: white !important;
            font-weight: 700;
            font-size: 38px;
        }
        .card.speed.redzone .unit {
            color: white !important;
        }
        .card.speed.redzone .label {
            color: #ffdddd !important;
        }

        .card.fuel .value { color: #66ff99; }
        .card.rest .value { color: #ffaa66; }
        .card.job .value { color: #ff9966; }

        .card.range-mode .value {
            font-size: 20px;
            color: #ffcc66;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .card.range-mode .sub {
            font-size: 14px;
            color: #ccc;
            margin-top: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .job-status {
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        .job-status.ontime { background: #1a6b3c; color: #8bffb0; }
        .job-status.hurry { background: #6b5a1a; color: #ffd966; }
        .job-status.late { background: #6b1a1a; color: #ff8a8a; }

        .range-bar {
            margin: 12px 0 10px;
            background: #1e2633;
            border-radius: 30px;
            height: 22px;
            overflow: hidden;
            border: 1px solid #2f3a4a;
            position: relative;
        }
        .range-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s ease, background-color 0.3s ease;
            background-color: #4caf50;
        }
        .range-bar .label {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            color: #ddd;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            z-index: 2;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            background: #2a3342;
            color: #ccc;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            transition: background-color 0.3s;
        }
        .badge.on { background: #1a6b3c; color: #8bffb0; }
        .badge.off { background: #4a2a2a; color: #ff8a8a; }

        .badge.on.blink {
            animation: blink-parking 0.8s infinite;
        }
        @keyframes blink-parking {
            0% { background-color: #1a6b3c; color: #8bffb0; }
            50% { background-color: #cc6600; color: white; }
            100% { background-color: #1a6b3c; color: #8bffb0; }
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #1e2633;
            padding-top: 12px;
        }

        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
            .card .value { font-size: 22px; }
            .card.speed .value { font-size: 26px; }
            .card.speed.redzone .value { font-size: 30px; }
            .header-row { font-size: 11px; gap: 8px; }
            .distance-bar .label { font-size: 11px; }
            .range-bar .label { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Header -->
    <div class="header-row">
        <h1>🚛 ETS2 Telemetry</h1>
        <span class="status-badge" id="statusBadge">Connecting...</span>
        <span class="timestamp" id="timestamp"></span>
    </div>

    <!-- Distance progress bar -->
    <div class="distance-bar-wrap" id="distanceWrap">
        <div class="distance-bar" id="distanceBar">
            <div class="fill" id="distanceFill" style="width:0%;"></div>
            <div class="label" id="distanceLabel">DESTINATION: --</div>
            <div class="flag">🏁</div>
        </div>
    </div>

    <!-- Grid cards -->
    <div class="grid">
        <div class="card speed" id="speedCard">
            <div class="label">Speed</div>
            <div class="value"><span id="speedValue">0</span><span class="unit">km/h</span></div>
        </div>

        <div class="card fuel" id="fuelCard">
            <div class="progress-bg" id="fuelProgress"></div>
            <div class="label">Fuel</div>
            <div class="value"><span id="fuelValue">--</span><span class="unit">%</span></div>
        </div>

        <div class="card rest" id="restCard">
            <div class="progress-bg" id="restProgress"></div>
            <div class="label">Rest in</div>
            <div class="value"><span id="restValue">--</span><span class="unit"></span></div>
        </div>

        <div class="card job" id="jobCard" style="display:none;">
            <div class="progress-bg" id="jobProgress"></div>
            <div class="label">Job deadline</div>
            <div class="value"><span id="jobValue">--</span><span class="unit"></span></div>
            <div class="job-status" id="jobStatus"></div>
        </div>

        <div class="card range-mode">
            <div class="label">Mode</div>
            <div class="value" id="modeLabel">max.sensitivity</div>
            <div class="sub" id="rangeLabel">[400–623]</div>
        </div>
    </div>

    <!-- Steering Sensitivity -->
    <div style="margin: 6px 0 4px;">
        <div class="range-bar">
            <div class="fill" id="rangeFill" style="width: 61%;"></div>
            <div class="label">STEERING SENSITIVITY</div>
        </div>
    </div>

    <div class="row">
        <span class="badge" id="parkingBadge">Parking: OFF</span>
        <span class="badge" id="engineBadge">Engine: OFF</span>
    </div>

    <div class="footer">
        Data via WebSocket (flat) &bull; Real-time
    </div>
</div>

<script>
    // ---- Screen Wake Lock ----
    let wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.addEventListener('visibilitychange', async () => {
                    if (document.visibilityState === 'visible' && wakeLock === null) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                });
            }
        } catch (err) { console.warn('Wake Lock error:', err); }
    }
    requestWakeLock();

    // ---- State ----
    let prevSpeed = 0;
    let currentBg = 'black';
    let initialDistance = 0;
    let initialJobTime = 0;
    let savedJobId = null;
    let hasJob = false;

    // ---- DOM refs ----
    const statusBadge = document.getElementById('statusBadge');
    const timestampEl = document.getElementById('timestamp');
    const speedCard = document.getElementById('speedCard');
    const speedValue = document.getElementById('speedValue');
    const fuelCard = document.getElementById('fuelCard');
    const fuelValue = document.getElementById('fuelValue');
    const fuelProgress = document.getElementById('fuelProgress');
    const restCard = document.getElementById('restCard');
    const restValue = document.getElementById('restValue');
    const restProgress = document.getElementById('restProgress');
    const jobCard = document.getElementById('jobCard');
    const jobValue = document.getElementById('jobValue');
    const jobProgress = document.getElementById('jobProgress');
    const jobStatus = document.getElementById('jobStatus');
    const modeLabel = document.getElementById('modeLabel');
    const rangeLabel = document.getElementById('rangeLabel');
    const rangeFill = document.getElementById('rangeFill');
    const parkingBadge = document.getElementById('parkingBadge');
    const engineBadge = document.getElementById('engineBadge');
    const distanceWrap = document.getElementById('distanceWrap');
    const distanceFill = document.getElementById('distanceFill');
    const distanceLabel = document.getElementById('distanceLabel');

    // ---- Helpers ----
    function formatHours(hours) {
        if (!hours || hours <= 0) return '--';
        const totalMinutes = Math.round(hours * 60);
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return h + ':' + m.toString().padStart(2, '0');
    }

    function getProgressColor(percent) {
        if (percent >= 40) return '#2e7d32';
        else if (percent >= 30) return '#1565c0';
        else {
            const p = percent / 30;
            const r = 255;
            const g = Math.round(80 * p);
            const b = 0;
            return `rgb(${r}, ${g}, ${b})`;
        }
    }

    function getRangeColor(percent) {
        const p = percent / 100;
        const r = Math.round(46 * (1 - p) + 2 * p);
        const g = Math.round(125 * (1 - p) + 119 * p);
        const b = Math.round(50 * (1 - p) + 189 * p);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function setBackground(color) {
        const body = document.body;
        body.classList.remove('bg-red', 'bg-green', 'bg-orange', 'bg-black');
        if (color === 'red') body.classList.add('bg-red');
        else if (color === 'green') body.classList.add('bg-green');
        else if (color === 'orange') body.classList.add('bg-orange');
        else body.classList.add('bg-black');
        currentBg = color;
    }

    // ---- Main update ----
    function updateUI(data) {
        const speed = Math.abs(data['truck.speed'] ?? 0) * 3.6;
        const parking = data['truck.brake.parking'] === true ? 'ON' : 'OFF';
        const engine = data['truck.engine.enabled'] === true ? 'ON' : 'OFF';
        const fuelAmount = data['truck.fuel.amount'] ?? 0;
        const fuelCapacity = data['truck.fuel.capacity'] ?? 1;
        const fuelPercent = Math.round((fuelAmount / fuelCapacity) * 100);
        const restSeconds = data['rest.stop'] ?? 0;
        const restHours = restSeconds / 3600;
        const plannedDistanceKm = data['job.planned_distance.km'] ?? 0;
        const remainingDistanceM = data['truck.navigation.distance'] ?? 0;
        const remainingDistanceKm = remainingDistanceM / 1000;
        const jobDeliveryTime = data['job.delivery.time'] ?? 0;
        const jobCargo = data['job.cargo'] ?? '';
        const jobSource = data['job.source.city'] ?? '';
        const jobDest = data['job.destination.city'] ?? '';
        const jobId = jobSource + '->' + jobDest + '|' + jobCargo;
        const trailerConnected = data['trailer.0.connected'] === true;
        const currentHasJob = (jobDeliveryTime > 0 && trailerConnected);

        // Save initial values for new job
        if (currentHasJob && (jobId !== savedJobId)) {
            initialDistance = plannedDistanceKm * 1000;
            initialJobTime = jobDeliveryTime;
            savedJobId = jobId;
            hasJob = true;
        } else if (!currentHasJob) {
            hasJob = false;
            savedJobId = null;
        }

        // Status
        if (speed > 1 || (data['frame.paused'] === false)) {
            statusBadge.textContent = 'Active';
            statusBadge.className = 'status-badge active';
        } else if (data['frame.paused'] === true) {
            statusBadge.textContent = 'Paused';
            statusBadge.className = 'status-badge waiting';
        } else {
            statusBadge.textContent = 'Waiting...';
            statusBadge.className = 'status-badge waiting';
        }
        timestampEl.textContent = new Date().toLocaleTimeString();

        // Speed
        speedValue.textContent = Math.round(speed);
        const isInZone = (speed >= 100 && speed <= 120);
        if (isInZone) {
            speedCard.classList.add('redzone');
            if (prevSpeed < 100) setBackground('red');
            else if (prevSpeed > 120) setBackground('green');
            else if (currentBg !== 'red' && currentBg !== 'green') setBackground('red');
        } else {
            speedCard.classList.remove('redzone');
            if (parking !== 'ON') setBackground('black');
        }
        prevSpeed = speed;

        // Parking
        if (parking === 'ON') {
            parkingBadge.textContent = 'Parking: ON';
            parkingBadge.className = 'badge on blink';
            setBackground('orange');
            speedCard.classList.remove('redzone');
        } else {
            parkingBadge.textContent = 'Parking: OFF';
            parkingBadge.className = 'badge off';
            if (!isInZone) setBackground('black');
        }

        // Engine
        if (engine === 'ON') {
            engineBadge.textContent = 'Engine: ON';
            engineBadge.className = 'badge on';
        } else {
            engineBadge.textContent = 'Engine: OFF';
            engineBadge.className = 'badge off';
        }
        const engineOn = (engine === 'ON');

        // Fuel
        if (!engineOn || fuelPercent <= 0) {
            fuelValue.textContent = '--';
            fuelProgress.style.width = '0%';
            fuelProgress.style.backgroundColor = 'transparent';
            fuelCard.classList.remove('warning', 'critical');
        } else {
            fuelValue.textContent = fuelPercent;
            fuelProgress.style.width = fuelPercent + '%';
            fuelProgress.style.backgroundColor = getProgressColor(fuelPercent);
            fuelCard.classList.remove('warning', 'critical');
            if (fuelPercent < 10) fuelCard.classList.add('critical');
            else if (fuelPercent < 15) fuelCard.classList.add('warning');
        }

        // Rest
        if (!engineOn || restHours <= 0) {
            restValue.textContent = '--';
            restProgress.style.width = '0%';
            restProgress.style.backgroundColor = 'transparent';
            restCard.classList.remove('warning', 'critical');
        } else {
            restValue.textContent = formatHours(restHours);
            const restPercent = Math.min(100, (restHours / 11) * 100);
            restProgress.style.width = restPercent + '%';
            restProgress.style.backgroundColor = getProgressColor(restPercent);
            restCard.classList.remove('warning', 'critical');
            if (restHours < 1) restCard.classList.add('critical');
            else if (restHours < 2) restCard.classList.add('warning');
        }

        // Job
        if (engineOn && hasJob && jobDeliveryTime > 0) {
            jobCard.style.display = 'block';
            const maxJob = (initialJobTime > 0) ? initialJobTime : jobDeliveryTime;
            const jobPercent = Math.min(100, (jobDeliveryTime / maxJob) * 100);
            jobValue.textContent = formatHours(jobDeliveryTime / 3600);
            jobProgress.style.width = jobPercent + '%';
            jobProgress.style.backgroundColor = getProgressColor(jobPercent);
            jobCard.classList.remove('warning', 'critical');
            if (jobDeliveryTime < 3600) jobCard.classList.add('critical');
            else if (jobDeliveryTime < 7200) jobCard.classList.add('warning');

            const etaSeconds = data['truck.navigation.time'] ?? 0;
            let statusText = '', statusClass = '';
            if (etaSeconds > 0 && jobDeliveryTime > 0) {
                const ratio = etaSeconds / jobDeliveryTime;
                if (ratio >= 1.0) { statusText = '⚠️ You\'re late!'; statusClass = 'late'; }
                else if (ratio >= 0.85) { statusText = '⚡ Need to hurry'; statusClass = 'hurry'; }
                else { statusText = '✅ On time'; statusClass = 'ontime'; }
            } else {
                statusText = '✅ On time';
                statusClass = 'ontime';
            }
            jobStatus.textContent = statusText;
            jobStatus.className = 'job-status ' + statusClass;
        } else {
            jobCard.style.display = 'none';
        }

        // Mode & Range (static placeholder, actual range from Arduino not used here)
        let mode = 'max.sensitivity';
        if (speed < 10) mode = 'max.sensitivity';
        else if (speed < 30) mode = 'up to 30 km/h';
        else if (speed < 60) mode = 'up to 60 km/h';
        else if (speed < 80) mode = 'up to 80 km/h';
        else if (speed < 100) mode = 'up to 100 km/h';
        else if (speed < 140) mode = 'up to 140 km/h';
        else mode = '>140 km/h';
        modeLabel.textContent = mode;
        // Placeholder range (no actual range from Arduino here)
        const minR = 400, maxR = 623;
        rangeLabel.textContent = '[' + minR + '–' + maxR + ']';
        const rangePercent = ((maxR - minR) / 1023) * 100;
        rangeFill.style.width = Math.min(100, rangePercent) + '%';
        rangeFill.style.backgroundColor = getRangeColor(rangePercent);

        // Distance
        if (engineOn && initialDistance > 0 && remainingDistanceM >= 0) {
            distanceWrap.style.display = 'block';
            let progress = (1 - (remainingDistanceM / initialDistance)) * 100;
            progress = Math.min(100, Math.max(0, progress));
            distanceFill.style.width = progress + '%';
            const etaHours = (data['truck.navigation.time'] ?? 0) / 3600;
            const timeStr = (etaHours > 0) ? formatHours(etaHours) : '--';
            distanceLabel.textContent = 'DESTINATION: ' + timeStr;
        } else {
            distanceWrap.style.display = 'none';
        }
    }

    // ---- WebSocket ----
    const WS_URL = 'ws://192.168.0.110:8081/api/ws/delta/flat/?throttle=50';
    let socket = null;
    let reconnectTimer = null;

    function connectWebSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) return;
        statusBadge.textContent = 'Connecting...';
        statusBadge.className = 'status-badge waiting';

        socket = new WebSocket(WS_URL);

        socket.onopen = function() {
            console.log('WebSocket connected');
            statusBadge.textContent = 'Connected';
            statusBadge.className = 'status-badge active';
        };

        socket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                updateUI(data);
            } catch (e) {
                console.error('Parse error:', e);
            }
        };

        socket.onerror = function(error) {
            console.error('WebSocket error:', error);
            statusBadge.textContent = 'Error';
            statusBadge.className = 'status-badge error';
        };

        socket.onclose = function(event) {
            console.log('WebSocket closed:', event.code);
            statusBadge.textContent = 'Disconnected';
            statusBadge.className = 'status-badge error';
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                console.log('Reconnecting...');
                connectWebSocket();
            }, 3000);
        };
    }

    // ---- Start ----
    connectWebSocket();
</script>
</body>
</html>
