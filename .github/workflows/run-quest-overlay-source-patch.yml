name: Run quest overlay source patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: pwsh
        run: ./tools/apply-quest-overlay-screen-fix.ps1
      - name: Commit source and remove patch files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainForm.cs Quests/QuestRuntime.cs Quests/QuestModels.cs tools/apply-quest-overlay-screen-fix.ps1 .github/workflows/run-quest-overlay-source-patch.yml
          git commit -m 'Fix quest overlay screen geometry and lifecycle'
          git push
          git rm tools/apply-quest-overlay-screen-fix.ps1 .github/workflows/run-quest-overlay-source-patch.yml
          git commit -m 'Remove temporary quest overlay patch files'
          git push
