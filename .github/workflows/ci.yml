name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinForms (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ETS2_Assist_GUI.csproj

      - name: Build
        run: dotnet build ETS2_Assist_GUI.csproj --configuration Release --no-restore

  cleanup_obsolete_branches:
    name: Delete obsolete test branches
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Delete feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/feature/quest-system-prototype || true

      - name: Delete temporary test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/${{ github.repository }}/git/refs/heads/tmp/quest-ux-run2 || true
