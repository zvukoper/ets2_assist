name: Apply Map Editor 2 source fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source changes
        run: python3 tools/apply_map2_small_fixes.py
      - name: Commit final source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft HEAD~2
          git add -A
          git commit -m "Map Editor 2 small fixes after pre-stable"
          git push --force-with-lease origin HEAD:main
