name: One-time quest runtime pause fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO-FIX QUEST RUNTIME PAUSE') && !contains(github.event.head_commit.message, 'Remove temporary quest runtime pause workflow') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: false

      - name: Restore
        shell: pwsh
        run: dotnet restore ETS2_Assist_GUI.csproj

      - name: Patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Quests/QuestRuntime.cs'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $old = '"http://localhost:8080/api/rest/single/frame/paused"'
          $new = '$"http://localhost:{TruckTelemetry.Port}/api/rest/single/frame/paused"'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one hardcoded QuestRuntime pause URL, found $count." }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
          git diff --check
          git diff -- Quests/QuestRuntime.cs

      - name: Build
        shell: pwsh
        run: dotnet build ETS2_Assist_GUI.csproj --configuration Release --no-restore

      - name: Commit and remove workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Quests/QuestRuntime.cs
          git commit -m 'AUTO-FIX QUEST RUNTIME PAUSE: use active TruckTel port'
          git rm .github/workflows/tmp-quest-runtime-pause-fix.yml
          git commit -m 'Remove temporary quest runtime pause workflow'
          git push
